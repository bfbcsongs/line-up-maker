
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Line-up Maker</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
    getDatabase, ref, set, get, remove, onValue
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBLXaXG8EcxhGxqZCkFiqzLp9uF7vnYZS0",
    authDomain: "preach-mate.firebaseapp.com",
    databaseURL: "https://preach-mate-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "preach-mate",
    storageBucket: "preach-mate.firebasestorage.app",
    messagingSenderId: "977514996603",
    appId: "1:1b0521748b3f7692b553de"
};

try {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.fbDB = db;
    window.fbRef = ref;
    window.fbSet = set;
    window.fbGet = get;
    window.fbRemove = remove;
    window.fbOnValue = onValue;

    window.dispatchEvent(new Event("firebase-ready"));
} catch (error) {
    console.error("Firebase initialization failed:", error);
    alert("Firebase initialization failed: " + error.message);
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root {
    --bg-color: #0b0f19;
    --panel-bg: #131b2e;
    --panel-border: #1e293b;
    --card-bg: #1a233a;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #2563eb;
    --success: #059669;
    --danger: #dc2626;
    --chord: #4ade80;
    --section: #38bdf8;
    --highlight: #facc15;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-color);
    color: var(--text-main);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

header {
    background: var(--panel-bg);
    border-bottom: 1px solid var(--panel-border);
    padding: 8px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    z-index: 100;
}

.brand-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.3px;
    white-space: nowrap;
}

.toolbar-tools {
    display: flex;
    gap: 4px;
    align-items: center;
    overflow-x: auto;
    max-width: 65%;
}

.toolbar-tools::-webkit-scrollbar {
    display: none;
}

.tool-btn {
    background: #1e293b;
    color: var(--text-main);
    border: 1px solid #334155;
    padding: 4px 8px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 0.7rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
}

.trans-badge {
    display: flex;
    align-items: center;
    background: #0f172a;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    overflow: hidden;
    font-size: 0.68rem;
    flex-shrink: 0;
}

.trans-badge span {
    padding: 2px 3px;
    color: var(--text-muted);
    font-family: monospace;
}

.trans-badge button {
    background: #273548;
    color: #fff;
    border: none;
    padding: 2px 5px;
    cursor: pointer;
    font-weight: bold;
}

.workspace {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

.view-section {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    flex-direction: column;
    background: var(--bg-color);
}

.view-section.active {
    display: flex;
}

.active-lineup-screen {
    flex: 1;
    margin: 10px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

.screen-header {
    font-size: 0.85rem;
    font-weight: bold;
    color: var(--section);
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 6px;
}

.category-row {
    background: #0f172a;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
}

.cat-label {
    font-weight: bold;
    font-size: 0.8rem;
    color: var(--text-muted);
    flex-shrink: 0;
}

.cat-song-title {
    font-size: 0.88rem;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    flex: 1;
    margin: 0 5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
}

.drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 15, 0.75);
    backdrop-filter: blur(3px);
    display: none;
    justify-content: flex-end;
    flex-direction: column;
    z-index: 9999;
}

.drawer-panel {
    background: var(--panel-bg);
    border-top: 1px solid var(--panel-border);
    border-radius: 16px 16px 0 0;
    padding: 18px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
}

.btn {
    background: #273548;
    color: #fff;
    border: 1px solid #334155;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 0.8rem;
    cursor: pointer;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    justify-content: center;
}

.btn-primary {
    background: var(--accent);
    border: none;
}

.btn-success {
    background: var(--success);
    border: none;
    color: #fff;
    font-weight: bold;
}

.btn-danger {
    background: var(--danger);
    border: none;
}

.btn-sm {
    padding: 4px 8px;
    font-size: 0.72rem;
    flex-shrink: 0;
}

.full-screen-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    background: var(--bg-color);
}

.edit-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: var(--panel-bg);
    border-bottom: 1px solid var(--panel-border);
    flex-shrink: 0;
    z-index: 50;
    gap: 6px;
}

.edit-mode-tabs {
    display: flex;
    background: #0f172a;
    border-radius: 6px;
    border: 1px solid #334155;
    overflow: hidden;
}

.edit-tab-btn {
    background: transparent;
    color: var(--text-muted);
    border: none;
    padding: 4px 10px;
    font-size: 0.72rem;
    font-weight: bold;
    cursor: pointer;
}

.edit-tab-btn.active {
    background: var(--accent);
    color: #fff;
}

.editor-textarea {
    flex: 1;
    width: 100%;
    background: transparent;
    color: var(--text-main);
    border: none;
    padding: 16px;
    font-family: monospace;
    font-size: 0.95rem;
    line-height: 1.6;
    resize: none;
    outline: none;
    min-height: 0;
    -webkit-overflow-scrolling: touch;
}

/* VISUAL CHORD EDITOR */

.visual-chord-editor {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    background: var(--bg-color);
}

.chord-canvas-box {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 1.1rem;
    line-height: 1.8;
    white-space: pre-wrap;
    user-select: none;
    -webkit-user-select: none;
}

.editor-lyric-row {
    display: block;
    min-height: 1.8em;
    white-space: pre-wrap;
}

.editor-lyric-row.has-chords {
    padding-top: 1.35em;
}

.interactive-char {
    display: inline-block;
    position: relative;
    padding: 1px 2px;
    border-radius: 3px;
    cursor: pointer;
    white-space: pre;
}

.interactive-char:hover {
    background: rgba(56, 189, 248, 0.2);
}

.interactive-char.selected-char {
    background: var(--highlight) !important;
    color: #000 !important;
    font-weight: bold;
    outline: 2px solid #fff;
}

.editor-positioned-chord {
    position: absolute;
    left: 50%;
    top: -1.4em;
    transform: translateX(-50%);
    color: #4ade80 !important;
    font-size: 0.85em;
    font-weight: bold;
    white-space: nowrap;
    pointer-events: none;
    z-index: 5;
}

.chord-popup-bar {
    background: var(--panel-bg);
    border-top: 1px solid var(--panel-border);
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
}

.chord-palette {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding-bottom: 4px;
}

.chord-palette::-webkit-scrollbar {
    display: none;
}

.chord-choice-btn {
    background: #1e293b;
    color: #4ade80;
    border: 1px solid #334155;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
}

.chord-choice-btn:hover {
    background: #4ade80;
    color: #000;
}

/* PLAY VIEW */

.play-workspace {
    display: flex;
    flex: 1;
    position: relative;
    overflow: hidden;
    min-height: 0;
}

.output-box {
    flex: 1;
    padding: 16px 20px;
    overflow-y: auto;
    overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 1.15rem;
    line-height: 1.8;
    scroll-behavior: smooth;
    min-height: 0;
    -webkit-overflow-scrolling: touch;
    text-align: center;
}

.play-right-bar {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    max-height: 75vh;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 8px 5px;
    overflow-y: auto;
    overflow-x: hidden;
    z-index: 99;
    background: transparent !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    border: none !important;
    border-radius: 14px;
    -webkit-overflow-scrolling: touch;
}

.jumper-chip {
    background: rgba(30, 41, 59, 0.08) !important;
    color: var(--section);
    border: 1px solid rgba(56, 189, 248, 0.35);
    padding: 9px 5px;
    border-radius: 11px;
    font-size: 0.7rem;
    font-weight: bold;
    text-align: center;
    width: 68px;
    min-height: 38px;
    cursor: pointer;
    text-transform: uppercase;
    flex-shrink: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.12);
    transition: background 0.2s, border-color 0.2s;
}

.song-part-block {
    display: block;
    width: 100%;
    padding: 12px 0;
    margin: 0 0 16px 0;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
}

.song-part-block.active-block {
    background: rgba(250, 204, 21, 0.12) !important;
    border: 1px solid var(--highlight) !important;
    border-radius: 10px;
}

.song-part-title-wrapper {
    display: block;
    width: 100%;
    text-align: center;
    margin-bottom: 4px;
    padding: 0;
}

.song-part-title {
    display: inline-block;
    color: var(--section);
    font-weight: bold;
    text-align: center;
    margin: 0;
    padding: 0;
    font-size: 0.9rem;
    letter-spacing: 1px;
}

.song-part-content {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    align-items: center;
}

.lyric-line-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

.chord-line {
    display: flex;
    justify-content: center;
    gap: 12px;
    font-family: monospace;
    font-size: 0.95rem;
    color: #4ade80;
    font-weight: bold;
    min-height: 22px;
    margin-bottom: 2px;
}

.lyric-text-line {
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--text-main);
    letter-spacing: 0.5px;
    white-space: pre-wrap;
}

.positioned-lyric-line {
    padding-top: 1.35em;
}

.lyric-char {
    display: inline-block;
    position: relative;
    white-space: pre;
}

.positioned-chord {
    position: absolute;
    left: 50%;
    top: -1.4em;
    transform: translateX(-50%);
    color: #4ade80 !important;
    font-size: 0.85em;
    font-weight: bold;
    white-space: nowrap;
    pointer-events: none;
    z-index: 5;
}

.chord {
    color: #4ade80 !important;
    font-weight: bold;
}

.jumper-chip:active,
.jumper-chip.selected {
    background: rgba(30, 41, 59, 0.08) !important;
    color: var(--highlight);
    border: 2px solid var(--highlight);
    box-shadow: 0 0 5px rgba(250, 204, 21, 0.35);
}

@media(max-width: 480px) {
    .brand-title {
        font-size: 0.75rem;
    }

    .toolbar-tools {
        max-width: 72%;
    }

    .tool-btn {
        font-size: 0.65rem;
        padding: 4px 6px;
    }

    .play-right-bar {
        right: 4px;
    }

    .jumper-chip {
        width: 62px;
        min-height: 36px;
        font-size: 0.65rem;
    }

    .output-box {
        font-size: 1rem;
        padding: 10px;
    }
}
</style>
</head>

<body>

<header>
    <span class="brand-title">Line-up Maker</span>

    <div class="toolbar-tools">
        <div class="trans-badge">
            <span>K:<strong id="trans-val" style="color:#fff;">0</strong></span>
            <button onclick="transposeGlobal(-1)">-</button>
            <button onclick="transposeGlobal(1)">+</button>
        </div>

        <button class="tool-btn" onclick="openDrawer('drawer-setlist')">📋 Set List</button>
        <button class="tool-btn" onclick="openDrawer('drawer-songs')">🎵 Songs</button>
        <button class="tool-btn" onclick="openAddSongModal()">➕ Add Song</button>
        <button class="tool-btn" onclick="openDrawer('drawer-newlineup')">📝 New</button>
        <button class="tool-btn" onclick="openQRModal()">🌐 Wi-Fi</button>
    </div>
</header>

<div class="workspace">

    <!-- HOME -->
    <div id="view-home" class="view-section active">
        <div class="active-lineup-screen">
            <div class="screen-header">
                <span>ACTIVE LINE-UP</span>
                <span id="home-worship-leader"></span>
            </div>

            <div id="home-lineup-container" style="display:flex;flex-direction:column;gap:8px;">
                <div class="empty-message">No active line-up. Select Start Jam.</div>
            </div>

            <button id="start-jam-btn" class="btn btn-primary"
                onclick="openDrawer('drawer-setlist')">
                Start Jam
            </button>
        </div>
    </div>

    <!-- EDIT -->
    <div id="view-edit" class="view-section">
        <div class="full-screen-container">
            <div class="edit-topbar">
                <button class="btn btn-sm" onclick="goBackFromEdit()">⬅ Back</button>

                <span id="edit-song-title-label" style="font-weight:bold;color:var(--accent);">
                    Edit Song
                </span>

                <div class="edit-mode-tabs">
                    <button id="tab-btn-lyrics" class="edit-tab-btn active"
                        onclick="switchEditMode('lyrics')">Lyrics</button>
                    <button id="tab-btn-chords" class="edit-tab-btn"
                        onclick="switchEditMode('chords')">Chords</button>
                </div>

                <div style="display:flex;gap:4px;">
                    <button class="btn btn-sm btn-danger" onclick="deleteCurrentSong()">Delete</button>
                    <button class="btn btn-sm btn-success" onclick="saveSongFromEditor()">Save</button>
                </div>
            </div>

            <textarea id="editor-textarea" class="editor-textarea"
                placeholder="[Intro]..."></textarea>

            <div id="visual-chord-editor" class="visual-chord-editor" style="display:none;">
                <div id="chord-canvas-box" class="chord-canvas-box"></div>

                <div class="chord-popup-bar">
                    <div style="font-size:0.75rem;color:var(--text-muted);display:flex;justify-content:space-between;align-items:center;">
                        <span>Tap any letter to place chord above it:</span>
                        <button class="btn btn-sm btn-danger"
                            onclick="removeSelectedChord()" style="padding:2px 6px;">
                            Remove Chord
                        </button>
                    </div>

                    <div id="chord-palette" class="chord-palette"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- PLAY -->
    <div id="view-play" class="view-section">
        <div class="full-screen-container">
            <div class="edit-topbar">
                <button class="btn btn-sm" onclick="goBackFromPlay()">⬅ Back</button>

                <span id="play-song-title" style="font-weight:bold;color:var(--section);">
                    Song Title
                </span>

                <button class="btn btn-sm btn-primary" onclick="openEditorFromPlay()">Edit</button>
            </div>

            <div class="play-workspace">
                <div id="play-lyrics-box" class="output-box"></div>
                <div id="floating-jumper-bar" class="play-right-bar"></div>
            </div>
        </div>
    </div>

</div>

<!-- SET LIST DRAWER -->
<div id="drawer-setlist" class="drawer-overlay" onclick="closeDrawer('drawer-setlist')">
    <div class="drawer-panel" onclick="event.stopPropagation()">
        <h3 style="color:var(--success);font-size:0.95rem;">Set List (Saved Line-ups)</h3>
        <div id="setlist-container" style="max-height:250px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;"></div>
        <button class="btn" onclick="closeDrawer('drawer-setlist')">Close</button>
    </div>
</div>

<!-- SONG DATABASE -->
<div id="drawer-songs" class="drawer-overlay" onclick="closeDrawer('drawer-songs')">
    <div class="drawer-panel" onclick="event.stopPropagation()">
        <h3 style="color:var(--accent);font-size:0.95rem;">Song Database</h3>
        <input type="text" id="song-search-input" placeholder="Search song..."
            oninput="renderSongsDatabase()"
            style="background:#0f172a;border:1px solid #334155;color:#fff;padding:8px;border-radius:6px;outline:none;">
        <div id="songs-db-container" style="max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;"></div>
        <button class="btn" onclick="closeDrawer('drawer-songs')">Close</button>
    </div>
</div>

<!-- NEW LINEUP -->
<div id="drawer-newlineup" class="drawer-overlay" onclick="closeDrawer('drawer-newlineup')">
    <div class="drawer-panel" onclick="event.stopPropagation()">
        <h3 style="color:var(--highlight);font-size:0.95rem;">Create New Line-up</h3>
        <input type="text" id="new-wl-name" placeholder="Worship Leader Name..."
            style="background:#0f172a;border:1px solid #334155;color:#fff;padding:8px;border-radius:6px;outline:none;">
        <div id="new-lineup-selectors" style="max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;"></div>
        <div style="display:flex;gap:6px;">
            <button class="btn btn-sm" onclick="openAddCategoryModal()">+ Category</button>
            <button class="btn btn-success" style="flex:1;" onclick="saveNewLineUpFromForm()">Save</button>
        </div>
        <button class="btn" onclick="closeDrawer('drawer-newlineup')">Close</button>
    </div>
</div>

<!-- SELECT SONG -->
<div id="select-song-modal" class="drawer-overlay" onclick="closeModal('select-song-modal')">
    <div class="drawer-panel" onclick="event.stopPropagation()">
        <h3 style="font-size:0.95rem;">
            Select Song for <span id="select-modal-cat" style="color:var(--section);"></span>
        </h3>
        <div id="modal-songs-list" style="max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;"></div>
        <button class="btn" onclick="closeModal('select-song-modal')">Cancel</button>
    </div>
</div>

<!-- SAVE ACTIVE LINEUP -->
<div id="save-lineup-modal" class="drawer-overlay" onclick="closeModal('save-lineup-modal')">
    <div class="drawer-panel" onclick="event.stopPropagation()">
        <h3 style="color:var(--success);font-size:0.95rem;">Save Active Line-up</h3>
        <input type="text" id="save-wl-input" placeholder="Worship Leader Name..."
            style="background:#0f172a;border:1px solid #334155;color:#fff;padding:8px;border-radius:6px;outline:none;">
        <button class="btn btn-success" onclick="confirmSaveActiveLineUp()">Save</button>
        <button class="btn" onclick="closeModal('save-lineup-modal')">Cancel</button>
    </div>
</div>

<!-- QR -->
<div id="qr-modal" class="drawer-overlay" onclick="closeModal('qr-modal')">
    <div class="drawer-panel" onclick="event.stopPropagation()" style="align-items:center;text-align:center;">
        <h3 style="font-size:0.95rem;">Local Wi-Fi QR Code</h3>
        <div id="qrcode" style="background:#fff;padding:10px;border-radius:8px;"></div>
        <p style="font-size:0.75rem;color:var(--text-muted);word-break:break-all;" id="wifi-link-text"></p>
        <button class="btn" onclick="closeModal('qr-modal')">Close</button>
    </div>
</div>

<!-- ADD CATEGORY -->
<div id="add-cat-modal" class="drawer-overlay" onclick="closeModal('add-cat-modal')">
    <div class="drawer-panel" onclick="event.stopPropagation()">
        <h3 style="font-size:0.95rem;">Add Custom Category</h3>
        <input type="text" id="new-cat-input" placeholder="Category Name..."
            style="background:#0f172a;border:1px solid #334155;color:#fff;padding:8px;border-radius:6px;outline:none;">
        <button class="btn btn-primary" onclick="confirmAddCategory()">Add</button>
        <button class="btn" onclick="closeModal('add-cat-modal')">Cancel</button>
    </div>
</div>

<script>
let categories = ["Opening", "Joyful", "Solemn", "Offering", "Closing"];
let activeLineUp = {};
let songsDatabase = {};
let songKeys = {};
let songTitles = {};
let setLists = [];

let globalSemitones = 0;
let activeEditingKey = null;
let currentPlayingSong = { title: "", content: "" };
let activeCategoryToAssign = null;
let viewHistory = ["home"];
let selectedCharIndex = null;

const notesSharp = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

const commonChords = [
    "C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B",
    "Dm", "Em", "Am", "F#m", "Bm", "G7", "C7", "D7", "A7", "E7", "B7"
];

let firebaseInitialized = false;

window.addEventListener("firebase-ready", initializeFirebase);

function initializeFirebase() {
    if (firebaseInitialized || !window.fbDB) return;

    firebaseInitialized = true;

    window.fbOnValue(
        window.fbRef(window.fbDB, "worship_songs"),
        snapshot => {
            const data = snapshot.val() || {};

            songsDatabase = {};
            songKeys = {};

            Object.entries(data).forEach(([key, content]) => {
                const title = songTitles[key] || key.replace(/_/g, " ");
                songsDatabase[title] = content;
                songKeys[title] = key;
            });

            renderSongsDatabase();
            renderNewLineUpForm();
        },
        error => console.error("Songs listener:", error)
    );

    window.fbOnValue(
        window.fbRef(window.fbDB, "worship_song_titles"),
        snapshot => {
            songTitles = snapshot.val() || {};

            window.fbGet(window.fbRef(window.fbDB, "worship_songs"))
                .then(songSnapshot => {
                    songsDatabase = {};
                    songKeys = {};

                    const data = songSnapshot.val() || {};

                    Object.entries(data).forEach(([key, content]) => {
                        const title = songTitles[key] || key.replace(/_/g, " ");
                        songsDatabase[title] = content;
                        songKeys[title] = key;
                    });

                    renderSongsDatabase();
                    renderNewLineUpForm();
                })
                .catch(console.error);
        },
        error => console.error("Song titles listener:", error)
    );

    window.fbOnValue(
        window.fbRef(window.fbDB, "worship_setlists"),
        snapshot => {
            const data = snapshot.val();

            if (!data) {
                setLists = [];
            } else if (Array.isArray(data)) {
                setLists = data.filter(Boolean);
            } else {
                setLists = Object.values(data).filter(Boolean);
            }

            renderSetList();
        },
        error => console.error("Set lists listener:", error)
    );

    window.fbOnValue(
        window.fbRef(window.fbDB, "worship_categories"),
        snapshot => {
            const saved = snapshot.val();

            if (Array.isArray(saved) && saved.length) {
                categories = saved;
            }

            renderNewLineUpForm();
        },
        error => console.error("Categories listener:", error)
    );
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function safeKey(title) {
    return title.replace(/[.#$/\[\]]/g, "_");
}

function getSongKey(title) {
    return songKeys[title] || safeKey(title);
}

function switchView(viewName, pushHistory = true) {
    document.querySelectorAll(".view-section")
        .forEach(el => el.classList.remove("active"));

    const target = document.getElementById("view-" + viewName);

    if (target) target.classList.add("active");

    if (pushHistory) {
        const currentTop = viewHistory[viewHistory.length - 1];

        if (currentTop !== viewName) {
            viewHistory.push(viewName);
        }
    }
}

function goBack() {
    if (viewHistory.length > 1) {
        viewHistory.pop();

        const previousView = viewHistory[viewHistory.length - 1];

        switchView(previousView, false);
    } else {
        switchView("home", false);
    }
}

function goBackFromEdit() {
    goBack();
}

function goBackFromPlay() {
    goBack();
}

function openDrawer(drawerId) {
    document.querySelectorAll(".drawer-overlay")
        .forEach(el => el.style.display = "none");

    const d = document.getElementById(drawerId);

    if (d) d.style.display = "flex";
}

function closeDrawer(drawerId) {
    const d = document.getElementById(drawerId);

    if (d) d.style.display = "none";
}

function closeModal(modalId) {
    const m = document.getElementById(modalId);

    if (m) m.style.display = "none";
}

/* CHORD MARKER FORMAT */

const chordMarkerRegex = /^\[([A-G](?:#|b)?(?:maj|min|m|dim|aug|sus|add|M)?\d*(?:\/[A-G](?:#|b)?)?)\]/;

function switchEditMode(mode) {
    const textarea = document.getElementById("editor-textarea");
    const chordEditor = document.getElementById("visual-chord-editor");
    const tabLyrics = document.getElementById("tab-btn-lyrics");
    const tabChords = document.getElementById("tab-btn-chords");

    if (mode === "lyrics") {
        chordEditor.style.display = "none";
        textarea.style.display = "block";

        tabLyrics.classList.add("active");
        tabChords.classList.remove("active");
    } else {
        textarea.style.display = "none";
        chordEditor.style.display = "flex";

        tabChords.classList.add("active");
        tabLyrics.classList.remove("active");

        renderVisualChordCanvas();
        renderChordPalette();
    }
}

function renderChordPalette() {
    const palette = document.getElementById("chord-palette");

    palette.innerHTML = "";

    commonChords.forEach(chord => {
        const btn = document.createElement("button");

        btn.className = "chord-choice-btn";
        btn.textContent = chord;

        btn.onclick = () => assignChordToSelected(chord);

        palette.appendChild(btn);
    });
}

/*
 * EDITOR RENDERING
 *
 * Chord markers are stored in the text as [C], [G], etc.
 * They are removed from the visible lyrics and attached
 * to the exact character immediately following the marker.
 */

function renderVisualChordCanvas() {
    const canvas = document.getElementById("chord-canvas-box");
    const text = document.getElementById("editor-textarea").value;

    canvas.innerHTML = "";
    selectedCharIndex = null;

    const lines = text.split("\n");
    let sourceIndex = 0;

    lines.forEach(line => {
        const row = document.createElement("div");

        row.className = "editor-lyric-row";

        let i = 0;
        let pendingChord = null;
        let hasChords = false;

        while (i < line.length) {
            const remaining = line.slice(i);
            const match = remaining.match(chordMarkerRegex);

            if (match) {
                pendingChord = match[1];
                hasChords = true;

                i += match[0].length;
                sourceIndex += match[0].length;

                continue;
            }

            const char = line[i];

            const span = document.createElement("span");

            span.className = "interactive-char";
            span.dataset.index = sourceIndex;

            if (pendingChord) {
                const chord = document.createElement("span");

                chord.className = "editor-positioned-chord";
                chord.textContent = transposeNote(
                    pendingChord,
                    globalSemitones
                );

                span.appendChild(chord);
                pendingChord = null;
            }

            span.appendChild(document.createTextNode(char));

            span.onclick = e => {
                e.stopPropagation();

                canvas.querySelectorAll(".interactive-char")
                    .forEach(c => c.classList.remove("selected-char"));

                span.classList.add("selected-char");

                selectedCharIndex = Number(span.dataset.index);
            };

            row.appendChild(span);

            i++;
            sourceIndex++;
        }

        if (hasChords) {
            row.classList.add("has-chords");
        }

        canvas.appendChild(row);

        sourceIndex++;
    });
}

/*
 * PLACE CHORD
 *
 * Replaces an existing chord marker if one is already
 * attached to the selected character.
 */

function assignChordToSelected(chordName) {
    if (selectedCharIndex === null) {
        alert("Please tap a specific letter first.");
        return;
    }

    const textarea = document.getElementById("editor-textarea");

    let text = textarea.value;
    const index = selectedCharIndex;

    const before = text.slice(0, index);

    const existing = before.match(
        /\[([A-G](?:#|b)?(?:maj|min|m|dim|aug|sus|add|M)?\d*(?:\/[A-G](?:#|b)?)?)\]$/
    );

    if (existing) {
        const start = index - existing[0].length;

        text =
            text.slice(0, start) +
            `[${chordName}]` +
            text.slice(index);
    } else {
        text =
            text.slice(0, index) +
            `[${chordName}]` +
            text.slice(index);
    }

    textarea.value = text;

    renderVisualChordCanvas();
}

/*
 * REMOVE CHORD FROM SELECTED CHARACTER
 */

function removeSelectedChord() {
    if (selectedCharIndex === null) return;

    const textarea = document.getElementById("editor-textarea");

    let text = textarea.value;

    const before = text.slice(0, selectedCharIndex);

    const match = before.match(
        /\[([A-G](?:#|b)?(?:maj|min|m|dim|aug|sus|add|M)?\d*(?:\/[A-G](?:#|b)?)?)\]$/
    );

    if (!match) {
        alert("No chord above this letter.");
        return;
    }

    const start = selectedCharIndex - match[0].length;

    text =
        text.slice(0, start) +
        text.slice(selectedCharIndex);

    textarea.value = text;

    renderVisualChordCanvas();
}

/*
 * TRANSPOSE
 */

function transposeGlobal(amount) {
    globalSemitones += amount;

    const el = document.getElementById("trans-val");

    if (el) {
        el.innerText = globalSemitones > 0
            ? "+" + globalSemitones
            : globalSemitones;
    }

    if (document.getElementById("view-play")?.classList.contains("active")) {
        renderPlayScreen();
    }

    if (document.getElementById("view-edit")?.classList.contains("active") &&
        document.getElementById("visual-chord-editor").style.display !== "none") {
        renderVisualChordCanvas();
    }
}

function transposeNote(chord, semitones) {
    const match = chord.match(
        /^([A-G](?:#|b)?)(.*?)(?:\/([A-G](?:#|b)?))?$/
    );

    if (!match) return chord;

    function shift(note) {
        if (!note) return "";

        const normalized = note
            .replace("Db", "C#")
            .replace("Eb", "D#")
            .replace("Gb", "F#")
            .replace("Ab", "G#")
            .replace("Bb", "A#");

        let index = notesSharp.indexOf(normalized);

        if (index === -1) return note;

        index = (index + semitones) % 12;

        if (index < 0) index += 12;

        return notesSharp[index];
    }

    return shift(match[1]) +
        match[2] +
        (match[3] ? "/" + shift(match[3]) : "");
}

/*
 * SONG SECTION DETECTION
 */

function isSongPartHeading(line) {
    let text = line.trim();

    if (!text) return null;

    text = text
        .replace(/^\[(.*?)\]$/, "$1")
        .trim()
        .replace(/:$/, "")
        .trim();

    const patterns = [
        /^intro(?:duction)?$/i,
        /^verse(?:\s*\d+)?$/i,
        /^v(?:erse)?\s*\d+$/i,
        /^chorus$/i,
        /^pre[\s-]?chorus$/i,
        /^post[\s-]?chorus$/i,
        /^bridge$/i,
        /^ad[\s-]?lib$/i,
        /^outro$/i,
        /^ending$/i,
        /^end$/i,
        /^refrain$/i,
        /^tag$/i,
        /^instrumental$/i,
        /^interlude$/i,
        /^solo$/i,
        /^repeat(?:\s+chorus)?$/i,
        /^turnaround$/i,
        /^vamp$/i,
        /^coda$/i,
        /^modulation$/i,
        /^spoken$/i,
        /^prayer$/i
    ];

    return patterns.some(pattern => pattern.test(text))
        ? text.toUpperCase()
        : null;
}

function isPureChordLine(line) {
    const tokens = line.trim().split(/\s+/).filter(Boolean);

    if (tokens.length === 0) return false;

    return tokens.every(token => {
        const cleaned = token.replace(/^[|]+|[|]+$/g, "");

        return cleaned === "" ||
            /^[A-G](?:#|b)?(?:maj|min|m|dim|aug|sus|add|M)?\d*(?:\/[A-G](?:#|b)?)?$/.test(cleaned);
    });
}

/*
 * PLAY MODE POSITIONED CHORD RENDERER
 *
 * The chord is attached to the exact character after its marker.
 * It is not rendered as inline text.
 */

function renderPositionedLyrics(line) {
    let html = "";
    let i = 0;
    let pendingChord = null;
    let hasChords = false;

    while (i < line.length) {
        const remaining = line.slice(i);
        const match = remaining.match(chordMarkerRegex);

        if (match) {
            pendingChord = match[1];
            hasChords = true;

            i += match[0].length;

            continue;
        }

        html += `<span class="lyric-char">`;

        if (pendingChord) {
            const transposed = transposeNote(
                pendingChord,
                globalSemitones
            );

            html += `
                <span class="positioned-chord">
                    ${escapeHTML(transposed)}
                </span>
            `;

            pendingChord = null;
        }

        html += escapeHTML(line[i]);
        html += `</span>`;

        i++;
    }

    return {
        html,
        hasChords
    };
}

/*
 * PLAY SCREEN
 */

function renderPlayScreen() {
    const box = document.getElementById("play-lyrics-box");
    const jumper = document.getElementById("floating-jumper-bar");

    if (!box || !jumper) return;

    box.innerHTML = "";
    jumper.innerHTML = "";

    const content = currentPlayingSong.content || "";
    const rawLines = content.split(/\r?\n/);

    let htmlOutput = "";
    let partCounter = 0;
    let insideBlock = false;
    let pendingChords = "";

    function closeBlock() {
        if (insideBlock) {
            if (pendingChords) {
                htmlOutput += `
                    <div class="lyric-line-wrapper">
                        <div class="chord-line">${pendingChords}</div>
                        <div class="lyric-text-line"></div>
                    </div>
                `;

                pendingChords = "";
            }

            htmlOutput += "</div></div>";

            insideBlock = false;
        }
    }

    function createBlock(label) {
        const id = "song-part-" + partCounter++;

        htmlOutput += `
            <div id="${id}" class="song-part-block">
                <div class="song-part-title-wrapper">
                    <span class="song-part-title"
                        onclick="jumpToBlock('${id}')">
                        [${escapeHTML(label)}]
                    </span>
                </div>

                <div class="song-part-content">
        `;

        const chip = document.createElement("button");

        chip.className = "jumper-chip";
        chip.textContent = label;
        chip.dataset.target = id;
        chip.onclick = () => jumpToBlock(id);

        jumper.appendChild(chip);

        insideBlock = true;
    }

    const chordRegex =
        /[A-G](?:#|b)?(?:maj|min|m|dim|aug|sus|add|M)?\d*(?:\/[A-G](?:#|b)?)?/g;

    for (let i = 0; i < rawLines.length; i++) {
        const line = rawLines[i];
        const trimmed = line.trim();

        const detectedPart = isSongPartHeading(trimmed);

        if (detectedPart) {
            closeBlock();
            createBlock(detectedPart);

        } else if (insideBlock) {

            if (!trimmed) {
                if (pendingChords) {
                    htmlOutput += `
                        <div class="lyric-line-wrapper">
                            <div class="chord-line">${pendingChords}</div>
                            <div class="lyric-text-line"></div>
                        </div>
                    `;

                    pendingChords = "";
                }

                continue;
            }

            if (isPureChordLine(trimmed)) {
                if (pendingChords) {
                    htmlOutput += `
                        <div class="lyric-line-wrapper">
                            <div class="chord-line">${pendingChords}</div>
                            <div class="lyric-text-line"></div>
                        </div>
                    `;
                }

                pendingChords = trimmed.replace(
                    chordRegex,
                    chord => `<span class="chord">${escapeHTML(transposeNote(chord, globalSemitones))}</span>`
                );

            } else {
                const positionedLyrics = renderPositionedLyrics(line);

                const chordsToRender = pendingChords;

                pendingChords = "";

                htmlOutput += `
                    <div class="lyric-line-wrapper">
                        ${chordsToRender
                            ? `<div class="chord-line">${chordsToRender}</div>`
                            : ""
                        }

                        <div class="lyric-text-line ${positionedLyrics.hasChords ? "positioned-lyric-line" : ""}">
                            ${positionedLyrics.html}
                        </div>
                    </div>
                `;
            }
        }
    }

    closeBlock();

    box.innerHTML = htmlOutput ||
        '<div class="empty-message">No song sections found. Add section headers like [Verse 1].</div>';

    box.scrollTop = 0;
}

function jumpToBlock(id) {
    const box = document.getElementById("play-lyrics-box");
    const target = document.getElementById(id);

    if (!box || !target) return;

    box.querySelectorAll(".song-part-block")
        .forEach(b => b.classList.remove("active-block"));

    target.classList.add("active-block");

    document.querySelectorAll(".jumper-chip")
        .forEach(c => {
            c.classList.toggle("selected", c.dataset.target === id);
        });

    const boxRect = box.getBoundingClientRect();
    const targetRect = target.getBoundingClientRect();

    const targetPosition =
        box.scrollTop +
        targetRect.top -
        boxRect.top -
        (box.clientHeight / 2) +
        (target.offsetHeight / 2);

    box.scrollTo({
        top: Math.max(0, targetPosition),
        behavior: "smooth"
    });
}

/*
 * SET LIST
 */

function renderSetList() {
    const container = document.getElementById("setlist-container");

    if (!container) return;

    container.innerHTML = "";

    if (setLists.length === 0) {
        container.innerHTML =
            '<span class="empty-message">No saved set lists.</span>';

        return;
    }

    setLists.forEach((sl, index) => {
        const row = document.createElement("div");

        row.className = "category-row";

        const name = document.createElement("span");

        name.style.cssText =
            "font-size:0.85rem;font-weight:bold;color:var(--success);flex:1;";

        name.textContent =
            (index + 1) + ". " + (sl.worshipLeader || "Unnamed");

        const load = document.createElement("button");

        load.className = "btn btn-sm btn-primary";
        load.textContent = "Load";

        load.onclick = () => {
            loadSetListToActive(index);
            closeDrawer("drawer-setlist");
        };

        row.append(name, load);

        container.appendChild(row);
    });
}

function loadSetListToActive(index) {
    const sl = setLists[index];

    if (!sl || !sl.lineup) {
        alert("Unable to load selected Set List.");
        return;
    }

    activeLineUp = { ...sl.lineup };

    const leader = document.getElementById("home-worship-leader");

    if (leader) {
        leader.textContent = sl.worshipLeader || "Unnamed";
    }

    renderActiveLineUp();

    closeDrawer("drawer-setlist");

    switchView("home");
}

function renderActiveLineUp() {
    const container = document.getElementById("home-lineup-container");
    const startButton = document.getElementById("start-jam-btn");

    if (!container) return;

    container.innerHTML = "";

    const entries = Object.entries(activeLineUp);

    if (entries.length === 0) {
        container.innerHTML =
            '<div class="empty-message">No songs assigned.</div>';

        if (startButton) startButton.style.display = "block";

        return;
    }

    entries.forEach(([category, song]) => {
        const row = document.createElement("div");

        row.className = "category-row";

        const label = document.createElement("span");

        label.className = "cat-label";
        label.textContent = category;

        const title = document.createElement("span");

        title.className = "cat-song-title";
        title.textContent = song;

        title.onclick = () => {
            if (songsDatabase[song] !== undefined) {
                playSong(song);
            } else {
                alert("Song not found: " + song);
            }
        };

        row.append(label, title);

        container.appendChild(row);
    });

    if (startButton) startButton.style.display = "none";
}

/*
 * SONG DATABASE
 */

function renderSongsDatabase() {
    const container = document.getElementById("songs-db-container");
    const searchInput = document.getElementById("song-search-input");

    if (!container || !searchInput) return;

    container.innerHTML = "";

    const query = searchInput.value.toLowerCase();

    const titles = Object.keys(songsDatabase)
        .filter(t => t.toLowerCase().includes(query))
        .sort();

    if (titles.length === 0) {
        container.innerHTML =
            '<span class="empty-message">No matching songs.</span>';

        return;
    }

    titles.forEach(title => {
        const row = document.createElement("div");

        row.style.cssText =
            "display:flex;justify-content:space-between;align-items:center;background:#0f172a;padding:6px 10px;border-radius:6px;gap:6px;";

        const name = document.createElement("span");

        name.style.cssText =
            "font-size:0.85rem;cursor:pointer;color:#fff;flex:1;overflow:hidden;text-overflow:ellipsis;";

        name.textContent = "🎵 " + title;

        name.onclick = () => {
            playSong(title);
            closeDrawer("drawer-songs");
        };

        const edit = document.createElement("button");

        edit.className = "btn btn-sm";
        edit.textContent = "Edit";

        edit.onclick = () => {
            openEditSongDirect(title);
            closeDrawer("drawer-songs");
        };

        row.append(name, edit);

        container.appendChild(row);
    });
}

/*
 * ADD / EDIT SONG
 */

function openAddSongModal() {
    activeEditingKey = null;

    document.getElementById("edit-song-title-label").textContent =
        "Add New Song";

    document.getElementById("editor-textarea").value =
        "[Untitled Song]\n\n[Intro]\nC   G\n\n[Verse 1]\nC   G\nLyrics here...";

    switchEditMode("lyrics");

    switchView("edit");
}

function openEditSongDirect(title) {
    activeEditingKey = title;

    document.getElementById("edit-song-title-label").textContent =
        "Edit: " + title;

    document.getElementById("editor-textarea").value =
        `[${title}]\n\n` + (songsDatabase[title] || "");

    switchEditMode("lyrics");

    switchView("edit");
}

function openEditorFromPlay() {
    if (currentPlayingSong.title) {
        openEditSongDirect(currentPlayingSong.title);
    }
}

async function saveSongFromEditor() {
    const text = document.getElementById("editor-textarea").value.trim();

    if (!text) {
        return alert("Please enter song content.");
    }

    if (!window.fbDB) {
        return alert("Firebase is not connected.");
    }

    const match = text.match(/^\[(.*?)\]/);

    const title = match ? match[1].trim() : "Untitled";

    const content = text.replace(/^\[.*?\]\s*/, "").trim();

    const newKey = safeKey(title);

    try {
        await window.fbSet(
            window.fbRef(window.fbDB, "worship_songs/" + newKey),
            content
        );

        await window.fbSet(
            window.fbRef(window.fbDB, "worship_song_titles/" + newKey),
            title
        );

        activeEditingKey = title;

        switchView("home");

        alert("Song saved successfully!");

    } catch (e) {
        alert("Error saving song: " + e.message);
    }
}

async function deleteCurrentSong() {
    if (!activeEditingKey) {
        return alert("Song not saved yet.");
    }

    if (!confirm(`Delete "${activeEditingKey}"?`)) return;

    try {
        const key = getSongKey(activeEditingKey);

        await window.fbRemove(
            window.fbRef(window.fbDB, "worship_songs/" + key)
        );

        await window.fbRemove(
            window.fbRef(window.fbDB, "worship_song_titles/" + key)
        );

        activeEditingKey = null;

        switchView("home");

        alert("Song deleted.");

    } catch (e) {
        alert("Error deleting song: " + e.message);
    }
}

/*
 * NEW LINEUP
 */

function renderNewLineUpForm() {
    const container = document.getElementById("new-lineup-selectors");

    if (!container) return;

    container.innerHTML = "";

    categories.forEach((cat, index) => {
        const div = document.createElement("div");

        div.style.cssText =
            "display:flex;justify-content:space-between;align-items:center;background:#0f172a;padding:6px 10px;border-radius:6px;gap:6px;";

        const label = document.createElement("span");

        label.style.cssText =
            "font-size:0.8rem;color:var(--section);font-weight:bold;";

        label.textContent = "♦️ " + cat + ":";

        const select = document.createElement("select");

        select.id = "select-new-" + index;

        select.style.cssText =
            "background:#1e293b;color:#fff;border:1px solid #334155;padding:4px;border-radius:4px;font-size:0.8rem;width:60%;";

        const empty = document.createElement("option");

        empty.value = "";
        empty.textContent = "-- Select Song --";

        select.appendChild(empty);

        Object.keys(songsDatabase).sort().forEach(title => {
            const option = document.createElement("option");

            option.value = title;
            option.textContent = title;

            select.appendChild(option);
        });

        div.append(label, select);

        container.appendChild(div);
    });
}

async function saveNewLineUpFromForm() {
    const wlName = document.getElementById("new-wl-name").value.trim();

    if (!wlName) {
        return alert("Please input Worship Leader Name.");
    }

    const tempLineup = {};

    categories.forEach((cat, index) => {
        const select = document.getElementById("select-new-" + index);

        if (select && select.value) {
            tempLineup[cat] = select.value;
        }
    });

    try {
        const currentLists = Array.isArray(setLists)
            ? [...setLists]
            : [];

        currentLists.unshift({
            worshipLeader: wlName,
            lineup: tempLineup
        });

        await window.fbSet(
            window.fbRef(window.fbDB, "worship_setlists"),
            currentLists
        );

        document.getElementById("new-wl-name").value = "";

        closeDrawer("drawer-newlineup");

        alert("New Line-up saved!");

    } catch (e) {
        alert("Error saving line-up: " + e.message);
    }
}

function openSaveLineupModal() {
    document.getElementById("save-lineup-modal").style.display = "flex";
}

async function confirmSaveActiveLineUp() {
    const wlName = document.getElementById("save-wl-input").value.trim();

    if (!wlName) {
        return alert("Enter Worship Leader Name.");
    }

    try {
        const currentLists = Array.isArray(setLists)
            ? [...setLists]
            : [];

        currentLists.unshift({
            worshipLeader: wlName,
            lineup: { ...activeLineUp }
        });

        await window.fbSet(
            window.fbRef(window.fbDB, "worship_setlists"),
            currentLists
        );

        document.getElementById("save-wl-input").value = "";

        closeModal("save-lineup-modal");

        alert("Active Line-up saved!");

    } catch (e) {
        alert("Error saving line-up: " + e.message);
    }
}

/*
 * PLAY SONG
 */

function playSong(title) {
    if (!(title in songsDatabase)) {
        return alert("Song not found.");
    }

    currentPlayingSong = {
        title: title,
        content: songsDatabase[title]
    };

    document.getElementById("play-song-title").textContent = title;

    renderPlayScreen();

    switchView("play");
}

/*
 * QR CODE
 */

function openQRModal() {
    const localUrl = window.location.href;

    document.getElementById("wifi-link-text").textContent = localUrl;

    const qr = document.getElementById("qrcode");

    qr.innerHTML = "";

    if (typeof QRCode !== "undefined") {
        new QRCode(qr, {
            text: localUrl,
            width: 150,
            height: 150
        });
    }

    document.getElementById("qr-modal").style.display = "flex";
}

/*
 * CATEGORY
 */

function openAddCategoryModal() {
    document.getElementById("add-cat-modal").style.display = "flex";
}

async function confirmAddCategory() {
    const input = document.getElementById("new-cat-input");

    const name = input.value.trim();

    if (!name) return;

    if (categories.some(c => c.toLowerCase() === name.toLowerCase())) {
        return alert("Category already exists.");
    }

    categories.push(name);

    try {
        await window.fbSet(
            window.fbRef(window.fbDB, "worship_categories"),
            categories
        );

        input.value = "";

        renderNewLineUpForm();

        closeModal("add-cat-modal");

    } catch (e) {
        alert("Error saving category: " + e.message);

        categories.pop();
    }
}

/*
 * INITIALIZE
 */

document.addEventListener("DOMContentLoaded", () => {
    renderNewLineUpForm();
    renderSetList();
});
</script>
