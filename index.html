<script>
/* ==========================================
   GLOBAL VARIABLES
========================================== */

let categories = ["Opening", "Joyful", "Solemn", "Offering", "Closing"];

let activeLineUp = {};
let songsDatabase = {};
let songKeys = {};
let songTitles = {};
let setLists = [];

let globalSemitones = 0;
let activeEditingKey = null;
let currentPlayingSong = { title: "", content: "" };
let activeCategoryToAssign = null;

const notesSharp = [
    "C", "C#", "D", "D#", "E", "F",
    "F#", "G", "G#", "A", "A#", "B"
];

let firebaseInitialized = false;


/* ==========================================
   FIREBASE CONNECTION
========================================== */

window.addEventListener("firebase-ready", initializeFirebase);

function initializeFirebase() {

    if (firebaseInitialized || !window.fbDB) return;

    firebaseInitialized = true;

    // SONG DATABASE
    window.fbOnValue(
        window.fbRef(window.fbDB, "worship_songs"),
        snapshot => {

            const data = snapshot.val() || {};

            songsDatabase = {};
            songKeys = {};

            Object.entries(data).forEach(([key, content]) => {

                const title = songTitles[key] || key.replace(/_/g, " ");

                songsDatabase[title] = content;
                songKeys[title] = key;

            });

            renderSongsDatabase();
            renderActiveLineUpCanvas();
            renderNewLineUpForm();

        },
        error => console.error("Songs listener:", error)
    );


    // SONG TITLE METADATA
    window.fbOnValue(
        window.fbRef(window.fbDB, "worship_song_titles"),
        snapshot => {

            songTitles = snapshot.val() || {};

            const currentData = songsDatabase;

            window.fbGet(
                window.fbRef(window.fbDB, "worship_songs")
            ).then(songSnapshot => {

                songsDatabase = {};
                songKeys = {};

                const data = songSnapshot.val() || {};

                Object.entries(data).forEach(([key, content]) => {

                    const title = songTitles[key] || key.replace(/_/g, " ");

                    songsDatabase[title] = content;
                    songKeys[title] = key;

                });

                renderSongsDatabase();
                renderActiveLineUpCanvas();
                renderNewLineUpForm();

            }).catch(console.error);

        },
        error => console.error("Song titles listener:", error)
    );


    // SAVED SET LISTS
    window.fbOnValue(
        window.fbRef(window.fbDB, "worship_setlists"),
        snapshot => {

            const data = snapshot.val();

            setLists = snapshot.exists()
                ? (Array.isArray(data) ? data : Object.values(data))
                : [];

            renderSetList();

        },
        error => console.error("Set lists listener:", error)
    );


    // CUSTOM CATEGORIES
    window.fbOnValue(
        window.fbRef(window.fbDB, "worship_categories"),
        snapshot => {

            const saved = snapshot.val();

            if (Array.isArray(saved) && saved.length) {
                categories = saved;
            }

            renderActiveLineUpCanvas();
            renderNewLineUpForm();

        },
        error => console.error("Categories listener:", error)
    );

}


/* ==========================================
   GENERAL HELPERS
========================================== */

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function safeKey(title) {
    return title.replace(/[.#$/\[\]]/g, "_");
}

function getSongKey(title) {
    return songKeys[title] || safeKey(title);
}

function switchView(viewName) {

    document.querySelectorAll(".view-section").forEach(el => {
        el.classList.remove("active");
    });

    document.getElementById("view-" + viewName).classList.add("active");

}

function openDrawer(drawerId) {

    document.querySelectorAll(".drawer-overlay").forEach(el => {
        el.style.display = "none";
    });

    document.getElementById(drawerId).style.display = "flex";

}

function closeDrawer(drawerId) {
    document.getElementById(drawerId).style.display = "none";
}

function closeModal(modalId) {
    document.getElementById(modalId).style.display = "none";
}


/* ==========================================
   TRANSPOSE
========================================== */

function transposeGlobal(amount) {

    globalSemitones += amount;

    document.getElementById("trans-val").innerText =
        globalSemitones > 0
            ? "+" + globalSemitones
            : globalSemitones;

    if (document.getElementById("view-play").classList.contains("active")) {
        renderPlayScreen();
    }

}

function transposeNote(chord, semitones) {

    const match = chord.match(/^([A-G](?:#|b)?)(.*?)(?:\/([A-G](?:#|b)?))?$/);

    if (!match) return chord;

    function shift(note) {

        if (!note) return "";

        const normalized = note.replace("Db", "C#")
            .replace("Eb", "D#")
            .replace("Gb", "F#")
            .replace("Ab", "G#")
            .replace("Bb", "A#");

        let index = notesSharp.indexOf(normalized);

        if (index === -1) return note;

        index = (index + semitones) % 12;

        if (index < 0) index += 12;

        return notesSharp[index];

    }

    return shift(match[1]) + match[2] +
        (match[3] ? "/" + shift(match[3]) : "");

}


/* ==========================================
   SMART SONG PART DETECTOR
========================================== */

function isSongPartHeading(line) {

    let text = line.trim();

    if (!text) return null;

    // Remove brackets and optional colon
    text = text.replace(/^\[(.*?)\]$/, "$1").trim();
    text = text.replace(/:$/, "").trim();

    const patterns = [
        /^intro(?:duction)?$/i,
        /^verse(?:\s*\d+)?$/i,
        /^v(?:erse)?\s*\d+$/i,
        /^chorus$/i,
        /^pre[\s-]?chorus$/i,
        /^post[\s-]?chorus$/i,
        /^bridge$/i,
        /^ad[\s-]?lib$/i,
        /^outro$/i,
        /^ending$/i,
        /^end$/i,
        /^refrain$/i,
        /^tag$/i,
        /^instrumental$/i,
        /^interlude$/i,
        /^solo$/i,
        /^repeat(?:\s+chorus)?$/i,
        /^turnaround$/i,
        /^vamp$/i,
        /^coda$/i,
        /^modulation$/i,
        /^spoken$/i,
        /^prayer$/i
    ];

    if (patterns.some(pattern => pattern.test(text))) {
        return text.toUpperCase();
    }

    return null;

}


/* ==========================================
   CHORD DETECTOR
========================================== */

function isChordToken(token) {

    return /^[A-G](?:#|b)?(?:maj|min|m|dim|aug|sus|add|M)?\d*(?:\/[A-G](?:#|b)?)?$/.test(token);

}

function formatChordLine(line) {

    const chordRegex =
        /[A-G](?:#|b)?(?:maj|min|m|dim|aug|sus|add|M)?\d*(?:\/[A-G](?:#|b)?)?/g;

    const tokens = line.trim().split(/\s+/).filter(Boolean);

    // Format a line only when it consists of chord symbols
    // This avoids coloring ordinary lyric words as chords.
    const isChordLine =
        tokens.length > 0 &&
        tokens.every(token => {
            const cleaned = token.replace(/^[|]+|[|]+$/g, "");
            return cleaned === "" || isChordToken(cleaned);
        });

    if (isChordLine) {

        return line.replace(chordRegex, chord => {

            return `<span class="chord">${
                escapeHTML(transposeNote(chord, globalSemitones))
            }</span>`;

        });

    }

    // Also support inline chord notation such as [C]Amazing grace
    return escapeHTML(line).replace(
        /\[([A-G](?:#|b)?(?:maj|min|m|dim|aug|sus|add|M)?\d*(?:\/[A-G](?:#|b)?)?)\]/g,
        (match, chord) => {

            return `<span class="chord">${
                escapeHTML(transposeNote(chord, globalSemitones))
            }</span>`;

        }
    );

}


/* ==========================================
   RENDER PLAY SCREEN
   AUTOMATIC JUMPER GENERATION
========================================== */

function renderPlayScreen() {

    const box = document.getElementById("play-lyrics-box");
    const jumper = document.getElementById("floating-jumper-bar");

    box.innerHTML = "";
    jumper.innerHTML = "";

    const content = currentPlayingSong.content || "";
    const lines = content.split(/\r?\n/);

    let htmlOutput = "";
    let partCounter = 0;
    let insideBlock = false;
    let hasContent = false;

    function closeBlock() {

        if (insideBlock) {

            htmlOutput += "</div></div>\n";
            insideBlock = false;

        }

    }

    function createBlock(label) {

        const id = "song-part-" + partCounter++;

        htmlOutput += `
            <div id="${id}" class="song-part-block">
                <span class="song-part-title"
                      onclick="jumpToBlock('${id}')">
                    [${escapeHTML(label)}]
                </span>
                <div class="song-part-content">
        `;

        const chip = document.createElement("button");

        chip.className = "jumper-chip";
        chip.textContent = label;

        chip.dataset.target = id;

        chip.onclick = () => jumpToBlock(id);

        jumper.appendChild(chip);

        insideBlock = true;
        hasContent = true;

    }

    for (let i = 0; i < lines.length; i++) {

        const line = lines[i];
        const trimmed = line.trim();

        const detectedPart = isSongPartHeading(trimmed);

        if (detectedPart) {

            closeBlock();

            createBlock(detectedPart);

        } else {

            // If the song has no heading before its lyrics,
            // automatically create an INTRO section.
            if (!insideBlock) {

                createBlock("INTRO");

            }

            htmlOutput += formatChordLine(line) + "\n";

        }

    }

    closeBlock();

    box.innerHTML = htmlOutput;

    if (!hasContent) {

        box.innerHTML = '<div class="empty-message">No song content available.</div>';

    }

    // Reset scroll position whenever a new song is opened.
    box.scrollTop = 0;

    // Reset jumper selection.
    jumper.querySelectorAll(".jumper-chip").forEach(chip => {
        chip.classList.remove("selected");
    });

}


/* ==========================================
   JUMP TO SONG PART
========================================== */

function jumpToBlock(id) {

    const box = document.getElementById("play-lyrics-box");
    const target = document.getElementById(id);

    if (!box || !target) return;

    box.querySelectorAll(".song-part-block").forEach(block => {
        block.classList.remove("active-block");
    });

    target.classList.add("active-block");

    document.querySelectorAll(".jumper-chip").forEach(chip => {

        chip.classList.toggle(
            "selected",
            chip.dataset.target === id
        );

    });

    const boxRect = box.getBoundingClientRect();
    const targetRect = target.getBoundingClientRect();

    const currentScroll = box.scrollTop;

    const targetPosition =
        currentScroll +
        targetRect.top -
        boxRect.top -
        (box.clientHeight / 2) +
        (target.offsetHeight / 2);

    box.scrollTo({
        top: Math.max(0, targetPosition),
        behavior: "smooth"
    });

}

========================================== */

        name.textContent = (index + 1) + ". " + (sl.worshipLeader || "Unnamed");

        const load = document.createElement("button");

        load.className = "btn btn-sm btn-primary";
        load.textContent = "Load";

        load.onclick = () => {

            loadSetListToActive(index);

}

function loadSetListToActive(index) {

    if (sl && sl.lineup) {

        activeLineUp = { ...sl.lineup };

        renderActiveLineUpCanvas();

        alert("Loaded Line-up: " + sl.worshipLeader);

}


/* ==========================================

========================================== */

function renderActiveLineUpCanvas() {

    const container = document.getElementById("canvas-active-categories");

        const songTitle = activeLineUp[cat];

        const row = document.createElement("div");

        row.className = "category-row";

        const label = document.createElement("span");

        label.className = "cat-label";

        actions.style.cssText = "display:flex;gap:4px;";

            edit.textContent = "Edit";

/* ==========================================

========================================== */

function openSelectSongModal(cat) {

    activeCategoryToAssign = cat;

    document.getElementById("select-modal-cat").textContent = cat;

    const list = document.getElementById("modal-songs-list");

/* ==========================================
   SONG DATABASE
========================================== */

function renderSongsDatabase() {

    const container = document.getElementById("songs-db-container");

    const searchInput = document.getElementById("song-search-input");

    if (!container || !searchInput) return;

    container.innerHTML = "";

    const query = searchInput.value.toLowerCase();

    const titles = Object.keys(songsDatabase)
        .filter(title => title.toLowerCase().includes(query))
        .sort();

    if (titles.length === 0) {

    }

    titles.forEach(title => {

        row.style.cssText =
            "display:flex;justify-content:space-between;align-items:center;background:#0f172a;padding:6px 10px;border-radius:6px;gap:6px;";

        const name = document.createElement("span");

        name.style.cssText =
            "font-size:0.85rem;cursor:pointer;color:#fff;flex:1;overflow:hidden;text-overflow:ellipsis;";

        name.textContent = "🎵 " + title;

        name.onclick = () => {

            playSong(title);
            closeDrawer("drawer-songs");

        };

        const edit = document.createElement("button");

        edit.className = "btn btn-sm";
        edit.textContent = "Edit";

        edit.onclick = () => {

            openEditSongDirect(title);
            closeDrawer("drawer-songs");

        };

        row.append(name, edit);

        container.appendChild(row);

    });

}


/* ==========================================
   ADD / EDIT SONG
========================================== */

function openAddSongModal() {

    activeEditingKey = null;

    document.getElementById("edit-song-title-label").textContent = "Add New Song";

    document.getElementById("editor-textarea").value =
`[Untitled Song]

[Intro]
C   G

[Verse 1]
C   G
Lyrics here...

[Chorus]
F   C
Chorus lyrics here...`;

    switchView("edit");

}

function openEditSongDirect(title) {

    activeEditingKey = title;

    document.getElementById("edit-song-title-label").textContent =
        "Edit: " + title;

    document.getElementById("editor-textarea").value =
        `[${title}]\n\n` + (songsDatabase[title] || "");

}

function openEditorFromPlay() {

    if (currentPlayingSong.title) {

        openEditSongDirect(currentPlayingSong.title);

    }

}


/* ==========================================
   SAVE SONG
========================================== */

async function saveSongFromEditor() {

    const text = document.getElementById("editor-textarea").value.trim();

    if (!text) return alert("Please enter song content.");

    if (!window.fbDB) return alert("Firebase is not connected.");

    const match = text.match(/^\[(.*?)\]/);

    const title = match ? match[1].trim() : "Untitled";

    if (!title) return alert("Please enter a song title.");

    const content = text.replace(/^\[.*?\]\s*/, "").trim();

    const newKey = safeKey(title);

    try {

        // Save song content.
        await window.fbSet(
            window.fbRef(window.fbDB, "worship_songs/" + newKey),
            content
        );

        // Save original display title separately.
        await window.fbSet(
            window.fbRef(window.fbDB, "worship_song_titles/" + newKey),
            title
        );

        // Remove old song if renamed.
        if (activeEditingKey && activeEditingKey !== title) {

            const oldKey = getSongKey(activeEditingKey);

            if (oldKey !== newKey) {

                await window.fbRemove(
                    window.fbRef(window.fbDB, "worship_songs/" + oldKey)
                );

                await window.fbRemove(
                    window.fbRef(window.fbDB, "worship_song_titles/" + oldKey)
                );

            }

        }

        activeEditingKey = title;

        switchView("home");

        alert("Song saved successfully!");

    } catch (e) {

        alert("Error saving song: " + e.message);

    }

}


/* ==========================================
   DELETE SONG
========================================== */

async function deleteCurrentSong() {

    if (!activeEditingKey) {

        return alert("This song has not been saved yet.");

    }

    if (!confirm(`Delete "${activeEditingKey}"?`)) return;

    try {

        const key = getSongKey(activeEditingKey);

        await window.fbRemove(
            window.fbRef(window.fbDB, "worship_songs/" + key)
        );

        await window.fbRemove(
            window.fbRef(window.fbDB, "worship_song_titles/" + key)
        );

        delete activeLineUp[
            Object.keys(activeLineUp).find(
                cat => activeLineUp[cat] === activeEditingKey
            )
        ];

        activeEditingKey = null;

        switchView("home");

        alert("Song deleted.");

    } catch (e) {

        alert("Error deleting song: " + e.message);

    }

}

   NEW LINEUP FORM

}

async function saveNewLineUpFromForm() {

    const wlName = document.getElementById("new-wl-name").value.trim();

    if (!wlName) return alert("Please input Worship Leader Name.");

    const tempLineup = {};

    categories.forEach((cat, index) => {

        const select = document.getElementById("select-new-" + index);

        if (select && select.value) {

            tempLineup[cat] = select.value;

        }

    });

    try {

        setLists.unshift({
            worshipLeader: wlName,
            lineup: tempLineup
        });

        await window.fbSet(
            window.fbRef(window.fbDB, "worship_setlists"),
            setLists
        );

        document.getElementById("new-wl-name").value = "";

        closeDrawer("drawer-newlineup");

        alert("New Line-up saved to Set List!");

    } catch (e) {

        alert("Error saving line-up: " + e.message);

    }

}


/* ==========================================
   SAVE ACTIVE LINEUP
========================================== */

function openSaveLineupModal() {

    document.getElementById("save-lineup-modal").style.display = "flex";

}

async function confirmSaveActiveLineUp() {

    const wlName = document.getElementById("save-wl-input").value.trim();

    if (!wlName) return alert("Enter Worship Leader Name.");

    try {

        setLists.unshift({
            worshipLeader: wlName,
            lineup: { ...activeLineUp }
        });

        await window.fbSet(
            window.fbRef(window.fbDB, "worship_setlists"),
            setLists
        );

        document.getElementById("save-wl-input").value = "";

        closeModal("save-lineup-modal");

        alert("Active Line-up saved to Set List!");

    } catch (e) {

        alert("Error saving line-up: " + e.message);

    }

}


/* ==========================================
   PLAY SONG
========================================== */

function playSong(title) {

    if (!(title in songsDatabase)) {

        return alert("Song not found in database.");

    }

    currentPlayingSong = {
        title: title,
        content: songsDatabase[title]
    };

    document.getElementById("play-song-title").textContent = title;

    renderPlayScreen();

    switchView("play");

}


/* ==========================================
   QR CODE
========================================== */

function openQRModal() {

    const localUrl = window.location.href;

    document.getElementById("wifi-link-text").textContent = localUrl;

    const qr = document.getElementById("qrcode");

    qr.innerHTML = "";

    if (typeof QRCode === "undefined") {

        return alert("QR Code library is not available.");

    new QRCode(qr, {
        text: localUrl,
        width: 150,
        height: 150
    });

    document.getElementById("qr-modal").style.display = "flex";

}


/* ==========================================
   ADD CUSTOM CATEGORY
========================================== */

function openAddCategoryModal() {

    document.getElementById("add-cat-modal").style.display = "flex";

}

async function confirmAddCategory() {

    const input = document.getElementById("new-cat-input");

    const name = input.value.trim();

    if (!name) return;

    if (categories.some(cat => cat.toLowerCase() === name.toLowerCase())) {

        return alert("Category already exists.");

    }

    categories.push(name);

    try {

        await window.fbSet(
            window.fbRef(window.fbDB, "worship_categories"),
            categories
        );

        input.value = "";

        renderActiveLineUpCanvas();
        renderNewLineUpForm();

        closeModal("add-cat-modal");

    } catch (e) {

        alert("Error saving category: " + e.message);

        categories.pop();

    }

}


/* ==========================================
   INITIALIZE PAGE
========================================== */

document.addEventListener("DOMContentLoaded", () => {

    renderActiveLineUpCanvas();
    renderNewLineUpForm();
    renderSetList();

});
