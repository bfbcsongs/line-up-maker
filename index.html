<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Line-up Maker</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
    getDatabase, ref, set, get, remove, onValue
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBLXaXG8EcxhGxqZCkFiqzLp9uF7vnYZS0",
    authDomain: "preach-mate.firebaseapp.com",
    databaseURL: "https://preach-mate-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "preach-mate",
    storageBucket: "preach-mate.firebasestorage.app",
    messagingSenderId: "977514996603",
    appId: "1:1b0521748b3f7692b553de"
};

try {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.fbDB = db;
    window.fbRef = ref;
    window.fbSet = set;
    window.fbGet = get;
    window.fbRemove = remove;
    window.fbOnValue = onValue;

    window.dispatchEvent(new Event("firebase-ready"));
} catch (error) {
    console.error(error);
    alert("Firebase initialization failed: " + error.message);
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root {
    --bg-color: #0b0f19;
    --panel-bg: #131b2e;
    --panel-border: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #2563eb;
    --success: #059669;
    --danger: #dc2626;
    --chord: #4ade80;
    --section: #38bdf8;
    --highlight: #facc15;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-color);
    color: var(--text-main);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

header {
    background: var(--panel-bg);
    border-bottom: 1px solid var(--panel-border);
    padding: 8px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    z-index: 100;
}

.brand-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
}

.toolbar-tools {
    display: flex;
    gap: 4px;
    align-items: center;
    overflow-x: auto;
    max-width: 75%;
}

.toolbar-tools::-webkit-scrollbar {
    display: none;
}

.tool-btn {
    background: #1e293b;
    color: var(--text-main);
    border: 1px solid #334155;
    padding: 4px 8px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 0.7rem;
    cursor: pointer;
    white-space: nowrap;
}

.trans-badge {
    display: flex;
    align-items: center;
    background: #0f172a;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    overflow: hidden;
    font-size: 0.68rem;
    flex-shrink: 0;
}

.trans-badge span {
    padding: 2px 3px;
    color: var(--text-muted);
    font-family: monospace;
}

.trans-badge button {
    background: #273548;
    color: #fff;
    border: none;
    padding: 2px 5px;
    cursor: pointer;
    font-weight: bold;
}

.workspace {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

.view-section {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
    flex-direction: column;
    background: var(--bg-color);
}

.view-section.active {
    display: flex;
}

/* HOME SCREEN */

#view-home {
    justify-content: center;
    align-items: center;
}

.home-start-container {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.start-jam-button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 17px 45px;
    font-size: 1.15rem;
    font-weight: bold;
    cursor: pointer;
}

/* GENERAL */

.empty-message {
    color: var(--text-muted);
    text-align: center;
    padding: 18px 10px;
    font-size: 0.85rem;
}

.drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 15, 0.75);
    backdrop-filter: blur(3px);
    display: none;
    justify-content: flex-end;
    flex-direction: column;
    z-index: 9999;
}

.drawer-panel {
    background: var(--panel-bg);
    border-top: 1px solid var(--panel-border);
    border-radius: 16px 16px 0 0;
    padding: 18px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
}

.btn {
    background: #273548;
    color: #fff;
    border: 1px solid #334155;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 0.8rem;
    cursor: pointer;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    justify-content: center;
}

.btn-primary {
    background: var(--accent);
    border: none;
}

.btn-success {
    background: var(--success);
    border: none;
    color: #fff;
    font-weight: bold;
}

.btn-danger {
    background: var(--danger);
    border: none;
}

.btn-sm {
    padding: 4px 8px;
    font-size: 0.72rem;
    flex-shrink: 0;
}

.category-row {
    background: #0f172a;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
}

.full-screen-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
}

.edit-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: var(--panel-bg);
    border-bottom: 1px solid var(--panel-border);
    flex-shrink: 0;
    gap: 6px;
}

.editor-workspace,
.play-workspace {
    display: flex;
    flex: 1;
    position: relative;
    overflow: hidden;
    min-height: 0;
    justify-content: center;
}

.output-box {
    flex: 1;
    max-width: 800px;
    padding: 16px 20px;
    overflow-y: auto;
    overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 1.15rem;
    line-height: 1.8;
    scroll-behavior: smooth;
    min-height: 0;
    -webkit-overflow-scrolling: touch;
    text-align: center;
}

/* UNIFIED SONG EDITOR */

#editor-textarea {
    display: block;
    flex: 1;
    width: 100%;
    max-width: 800px;
    height: 100%;
    min-height: 0;
    margin: 0 auto;
    padding: 20px 16px;
    background: transparent;
    color: var(--text-main);
    border: none;
    outline: none;
    resize: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 1.1rem;
    line-height: 1.8;
    text-align: center;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    -webkit-overflow-scrolling: touch;
}

#editor-textarea::placeholder {
    color: var(--text-muted);
    opacity: 0.8;
    text-align: center;
}

/* SONG PARTS */

.song-part-block {
    display: block;
    width: 100%;
    padding: 12px 0;
    margin: 0 0 16px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
}

.song-part-block.active-block {
    background: rgba(250, 204, 21, 0.12) !important;
    border: 1px solid var(--highlight) !important;
}

.song-part-title-wrapper {
    display: block;
    width: 100%;
    text-align: center;
    margin-bottom: 8px;
}

.song-part-title {
    display: inline-block;
    color: var(--section);
    font-weight: bold;
    font-size: 0.9rem;
    letter-spacing: 1px;
}

.song-part-content {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    align-items: center;
}

.lyric-line-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

.lyric-text-line {
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--text-main);
    letter-spacing: 0.5px;
    white-space: pre-wrap;
    line-height: 1.8;
}

.chord-position {
    display: inline-flex;
    flex-direction: column;
    vertical-align: bottom;
    position: relative;
    align-items: center;
    line-height: 1.1;
}

.chord-position .chord {
    color: var(--chord) !important;
    font-size: 0.85em;
    font-weight: bold;
    white-space: nowrap;
    min-height: 1.1em;
    line-height: 1.1;
}

.chord-position .lyric-letter {
    color: var(--text-main);
    white-space: pre;
}

.chord {
    color: var(--chord) !important;
    font-weight: bold;
}

/* FLOATING JUMPER */

.play-right-bar {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    max-height: 75vh;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 8px 5px;
    overflow-y: auto;
    overflow-x: hidden;
    z-index: 99;
    background: transparent !important;
    border: none !important;
    border-radius: 14px;
    -webkit-overflow-scrolling: touch;
}

.jumper-chip {
    background: rgba(30, 41, 59, 0.08) !important;
    color: var(--section);
    border: 1px solid rgba(56, 189, 248, 0.35);
    padding: 9px 5px;
    border-radius: 11px;
    font-size: 0.7rem;
    font-weight: bold;
    text-align: center;
    width: 68px;
    min-height: 38px;
    cursor: pointer;
    text-transform: uppercase;
    flex-shrink: 0;
}

.jumper-chip:active,
.jumper-chip.selected {
    background: rgba(30, 41, 59, 0.08) !important;
    color: var(--highlight);
    border: 2px solid var(--highlight);
}

@media(max-width:480px) {
    .brand-title { font-size: 0.75rem; }
    .toolbar-tools { max-width: 75%; }
    .tool-btn { font-size: 0.65rem; padding: 4px 6px; }
    .play-right-bar { right: 4px; }
    .jumper-chip { width: 62px; min-height: 36px; font-size: 0.65rem; }
    .output-box { font-size: 1rem; padding: 10px; }
    .lyric-text-line { font-size: 1.05rem; }
    #editor-textarea {
        font-size: 1rem;
        padding: 16px 10px;
    }
}
</style>
</head>

<body>

<header>
    <span class="brand-title">Line-up Maker</span>

    <div class="toolbar-tools">
        <div class="trans-badge">
            <span>K:<strong id="trans-val" style="color:#fff;">0</strong></span>

        <button class="tool-btn" onclick="openDrawer('drawer-setlist')">📋 Set List</button>

    <!-- SONG VIEW -->

<!-- SET LIST DRAWER -->

<!-- SONG DATABASE -->

<!-- SELECT SONG -->

        <h3 style="font-size:0.95rem;">Local Wi-Fi QR Code</h3>
        <div id="qrcode" style="background:#fff;padding:10px;border-radius:8px;"></div>

<!-- ADD CATEGORY -->
<div id="add-cat-modal" class="drawer-overlay" onclick="closeModal('add-cat-modal')">
    <div class="drawer-panel" onclick="event.stopPropagation()">
        <h3 style="font-size:0.95rem;">Add Custom Category</h3>
        <input type="text" id="new-cat-input" placeholder="Category Name..."
            style="background:#0f172a;border:1px solid #334155;color:#fff;padding:8px;border-radius:6px;">
        <button class="btn btn-primary" onclick="confirmAddCategory()">Add</button>
        <button class="btn" onclick="closeModal('add-cat-modal')">Cancel</button>
    </div>
</div>

<script>
let categories = ["Opening", "Joyful", "Solemn", "Offering", "Closing"];
let activeLineUp = {};
let songsDatabase = {};
let songKeys = {};
let songTitles = {};
let setLists = [];

let globalSemitones = 0;
let activeEditingKey = null;
let currentPlayingSong = { title: "", content: "" };
let activeCategoryToAssign = null;
let viewHistory = ["home"];
let pendingSetListIndex = null;

/* ADD SONG STATE */

let newSongTitle = "";
let isNewSongDraft = false;

const notesSharp = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
let firebaseInitialized = false;

window.addEventListener("firebase-ready", initializeFirebase);

function initializeFirebase() {
    if (firebaseInitialized || !window.fbDB) return;
    firebaseInitialized = true;

    window.fbOnValue(window.fbRef(window.fbDB, "worship_songs"), snapshot => {
        const data = snapshot.val() || {};
        songsDatabase = {};
        songKeys = {};

        Object.entries(data).forEach(([key, content]) => {
            const title = songTitles[key] || key.replace(/_/g, " ");
            songsDatabase[title] = content;
            songKeys[title] = key;
        });

        renderSongsDatabase();
        renderNewLineUpForm();
    });

    window.fbOnValue(window.fbRef(window.fbDB, "worship_song_titles"), snapshot => {
        songTitles = snapshot.val() || {};

        window.fbGet(window.fbRef(window.fbDB, "worship_songs")).then(songSnapshot => {
            songsDatabase = {};
            songKeys = {};

            Object.entries(songSnapshot.val() || {}).forEach(([key, content]) => {
                const title = songTitles[key] || key.replace(/_/g, " ");
                songsDatabase[title] = content;
                songKeys[title] = key;
            });

            renderSongsDatabase();
            renderNewLineUpForm();
        }).catch(console.error);
    });

    window.fbOnValue(window.fbRef(window.fbDB, "worship_setlists"), snapshot => {
        const data = snapshot.val();

        if (!data) {
            setLists = [];
        } else if (Array.isArray(data)) {
            setLists = data.filter(Boolean);
        } else {
            setLists = Object.values(data).filter(Boolean);
        }

        renderSetList();
    });

    window.fbOnValue(window.fbRef(window.fbDB, "worship_categories"), snapshot => {
        const saved = snapshot.val();

        if (Array.isArray(saved) && saved.length) {
            categories = saved;
        }

        renderNewLineUpForm();
    });
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function safeKey(title) {
    return title.replace(/[\.#$/\[\]]/g, "_");
}

function switchView(viewName, pushHistory = true) {
    const normalizedName = viewName.startsWith("view-")
        ? viewName.substring(5)

    document.querySelectorAll(".view-section").forEach(el =>
        el.classList.remove("active")

    const target = document.getElementById("view-" + normalizedName);

    if (target) {
        target.classList.add("active");
    } else {
        console.error("View not found:", "view-" + normalizedName);

    if (pushHistory) {
        const currentTop = viewHistory[viewHistory.length - 1];

        if (currentTop !== normalizedName) {
            viewHistory.push(normalizedName);

}

/* TRANSPOSE */

function transposeGlobal(amount) {
    globalSemitones += amount;

    document.getElementById("trans-val").innerText =
        globalSemitones > 0 ? "+" + globalSemitones : globalSemitones;

    if (document.getElementById("view-play").classList.contains("active")) {
        renderPlayScreen();
    }

    if (document.getElementById("view-edit").classList.contains("active")) {
        renderEditScreen();
    }
}

function transposeNote(chord, semitones) {
    const match = chord.match(/^([A-G](?:#|b)?)(.*?)(?:\/([A-G](?:#|b)?))?$/);
    if (!match) return chord;

    function shift(note) {
        if (!note) return "";

        const normalized = note
            .replace("Db", "C#")
            .replace("Eb", "D#")
            .replace("Gb", "F#")
            .replace("Ab", "G#")
            .replace("Bb", "A#");

        let index = notesSharp.indexOf(normalized);
        if (index === -1) return note;

        index = (index + semitones) % 12;
        if (index < 0) index += 12;

        return notesSharp[index];
    }

    return shift(match[1]) + match[2] +
        (match[3] ? "/" + shift(match[3]) : "");
}

/* SONG FORMATTING */

/*
   Recognizes the requested section labels when they appear
   alone on their own line:

   Intro:
   Verse:
   Chorus:
   Bridge:
   Adlib:
   Outro:

   Existing bracketed section headings are also retained
   for compatibility with previously saved songs.
*/

function isSongPartHeading(line) {
    const text = line.trim();
    if (!text) return null;

    const colonLabels = [
        "Intro",
        "Verse",
        "Chorus",
        "Bridge",
        "Adlib",
        "Outro"
    ];

    const colonMatch = colonLabels.find(label =>
        new RegExp("^" + label + ":$", "i").test(text)
    );

    if (colonMatch) {
        return colonMatch.toUpperCase();
    }

    const bracketMatch = text.match(/^\[(.*?)\]$/);

    if (!bracketMatch) return null;

    const legacyText = bracketMatch[1].trim();

    const legacyPatterns = [
        /^intro(?:duction)?$/i,
        /^verse(?:\s*\d+)?$/i,
        /^v(?:erse)?\s*\d+$/i,
        /^chorus$/i,
        /^pre[\s-]?chorus$/i,
        /^post[\s-]?chorus$/i,
        /^bridge$/i,
        /^ad[\s-]?lib$/i,
        /^outro$/i,
        /^ending$/i,
        /^end$/i,
        /^refrain$/i,
        /^tag$/i,
        /^instrumental$/i,
        /^interlude$/i,
        /^solo$/i,
        /^repeat(?:\s+chorus)?$/i,
        /^turnaround$/i,
        /^vamp$/i,
        /^coda$/i,
        /^modulation$/i,
        /^spoken$/i,
        /^prayer$/i
    ];

    return legacyPatterns.some(pattern => pattern.test(legacyText))
        ? legacyText.toUpperCase()
        : null;
}

function isChordToken(token) {
    return /^[A-G](?:#|b)?(?:maj|min|m|dim|aug|sus|add|M)?\d*(?:\/[A-G](?:#|b)?)?$/.test(token);
}

function isPureChordLine(line) {
    const tokens = line.trim().split(/\s+/).filter(Boolean);
    if (!tokens.length) return false;

    return tokens.every(token => {
        const cleaned = token.replace(/^[|]+|[|]+$/g, "");
        return cleaned === "" || isChordToken(cleaned);
    });
}

function renderInlineChords(line) {
    const regex = /\[([A-G](?:#|b)?(?:maj|min|m|dim|aug|sus|add|M)?\d*(?:\/[A-G](?:#|b)?)?)\]/g;

    let result = "";
    let lastIndex = 0;
    let match;

    while ((match = regex.exec(line)) !== null) {
        result += escapeHTML(line.substring(lastIndex, match.index));

        const chord = transposeNote(match[1], globalSemitones);
        const nextChar = line.charAt(regex.lastIndex);

        if (!nextChar) {
            result += `<span class="chord">${escapeHTML(chord)}</span>`;
        } else {
            result += `
                <span class="chord-position">
                    <span class="chord">${escapeHTML(chord)}</span>
                    <span class="lyric-letter">${escapeHTML(nextChar)}</span>
                </span>
            `;

            regex.lastIndex++;
        }

        lastIndex = regex.lastIndex;
    }

    result += escapeHTML(line.substring(lastIndex));

    return result;
}

function renderSongContent(box, jumper, isPlayMode) {
    if (!box) return;

    box.innerHTML = "";
    if (jumper) jumper.innerHTML = "";

    const content = currentPlayingSong.content || "";
    const rawLines = content.split(/\r?\n/);

    let htmlOutput = "";
    let partCounter = 0;
    let insideBlock = false;
    let pendingChords = "";

    function closeBlock() {
        if (!insideBlock) return;

        if (pendingChords) {
            htmlOutput += `
                <div class="lyric-line-wrapper">
                    <div class="chord-line">${pendingChords}</div>
                </div>
            `;
            pendingChords = "";
        }

        htmlOutput += "</div></div>";
        insideBlock = false;
    }

    function createBlock(label) {
        const id = "song-part-" + partCounter++;

        htmlOutput += `
            <div id="${id}" class="song-part-block">
                <div class="song-part-title-wrapper">
                    <span class="song-part-title">[${escapeHTML(label)}]</span>
                </div>
                <div class="song-part-content">
        `;

        if (isPlayMode && jumper) {
            const chip = document.createElement("button");
            chip.className = "jumper-chip";
            chip.textContent = label;
            chip.dataset.target = id;
            chip.onclick = () => jumpToBlock(id);
            jumper.appendChild(chip);
        }

        insideBlock = true;
    }

    const chordRegex = /[A-G](?:#|b)?(?:maj|min|m|dim|aug|sus|add|M)?\d*(?:\/[A-G](?:#|b)?)?/g;

    for (const line of rawLines) {
        const trimmed = line.trim();
        const detectedPart = isSongPartHeading(trimmed);

        if (detectedPart) {
            closeBlock();
            createBlock(detectedPart);
            continue;
        }

        if (!insideBlock || !trimmed) continue;

        if (isPureChordLine(trimmed)) {
            if (pendingChords) {
                htmlOutput += `
                    <div class="lyric-line-wrapper">
                        <div class="chord-line">${pendingChords}</div>
                    </div>
                `;
            }

            pendingChords = trimmed.replace(chordRegex, chord =>
                `<span class="chord">${escapeHTML(transposeNote(chord, globalSemitones))}</span>`
            );

            continue;
        }

        const lyricHTML = renderInlineChords(line);

        htmlOutput += `
            <div class="lyric-line-wrapper">
                ${pendingChords ? `<div class="chord-line">${pendingChords}</div>` : ""}
                <div class="lyric-text-line">${lyricHTML}</div>
            </div>
        `;

        pendingChords = "";
    }

    closeBlock();

    box.innerHTML = htmlOutput ||
        '<div class="empty-message">No song sections found. Add section labels such as Intro: or Verse: on their own lines.</div>';

    box.scrollTop = 0;
}

function jumpToBlock(id) {
    const box = document.getElementById("play-lyrics-box");
    const target = document.getElementById(id);

    if (!box || !target) return;

    box.querySelectorAll(".song-part-block").forEach(block =>
        block.classList.remove("active-block")
    );

    target.classList.add("active-block");

    document.querySelectorAll(".jumper-chip").forEach(chip =>
        chip.classList.toggle("selected", chip.dataset.target === id)
    );

    const boxRect = box.getBoundingClientRect();
    const targetRect = target.getBoundingClientRect();

    const targetPosition =
        box.scrollTop +
        targetRect.top -
        boxRect.top -
        (box.clientHeight / 2) +
        (target.offsetHeight / 2);

    box.scrollTo({
        top: Math.max(0, targetPosition),
        behavior: "smooth"
    });
}

/* SET LIST */

function getSetListDate(sl) {
    return sl.createdAt || sl.dateCreated || sl.timestamp || 0;
}

function renderSetList() {
    const container = document.getElementById("setlist-container");
    if (!container) return;

    container.innerHTML = "";

    if (!setLists.length) {
        container.innerHTML = '<span class="empty-message">No saved set lists.</span>';
        return;
    }

    const sortedLists = setLists
        .map((item, originalIndex) => ({ ...item, originalIndex }))
        .sort((a, b) => {
            const dateDifference = getSetListDate(b) - getSetListDate(a);

            if (dateDifference !== 0) return dateDifference;

            return String(b.worshipLeader || "")
                .localeCompare(String(a.worshipLeader || ""));
        });

    sortedLists.forEach((sl, displayIndex) => {
        const row = document.createElement("div");
        row.className = "category-row";

        row.style.flexDirection = "column";
        row.style.alignItems = "stretch";
        row.style.gap = "5px";

        const heading = document.createElement("div");
        heading.style.cssText =
            "display:flex;justify-content:space-between;align-items:center;gap:8px;";

        const name = document.createElement("span");
        name.style.cssText =
            "font-size:0.85rem;font-weight:bold;color:var(--success);flex:1;";

        name.textContent = (displayIndex + 1) + ". " +
            (sl.worshipLeader || "Unnamed Worship Leader");

        const date = document.createElement("span");
        date.style.cssText =
            "font-size:0.68rem;color:var(--text-muted);";

        const dateValue = getSetListDate(sl);

        date.textContent = dateValue
            ? new Date(dateValue).toLocaleDateString()
            : "Date unavailable";

        heading.append(name, date);

        const buttons = document.createElement("div");
        buttons.style.cssText = "display:flex;gap:5px;";

        const load = document.createElement("button");
        load.className = "btn btn-sm btn-primary";
        load.textContent = "Select";

        load.onclick = () => {
            pendingSetListIndex = sl.originalIndex;

            document.getElementById("confirm-lineup-details").textContent =
                "Worship Leader: " +
                (sl.worshipLeader || "Unnamed");

            closeDrawer("drawer-setlist");
            document.getElementById("confirm-lineup-modal").style.display = "flex";
        };

        const del = document.createElement("button");
        del.className = "btn btn-sm btn-danger";
        del.textContent = "Delete";

        del.onclick = async () => {
            const leader = sl.worshipLeader || "Unnamed";

            if (!confirm(`Delete the set list for "${leader}"?`)) return;

            try {
                setLists.splice(sl.originalIndex, 1);
                await window.fbSet(
                    window.fbRef(window.fbDB, "worship_setlists"),
                    setLists
                );

                renderSetList();
            } catch (error) {
                alert("Error deleting set list: " + error.message);
            }
        };

        buttons.append(load, del);
        row.append(heading, buttons);
        container.appendChild(row);
    });
}

function playLineUp() {

    if (!playLineUpEntries.length) return;

    playLineUpSongAt(0);
}

function playLineUpSongAt(index) {
    if (index < 0 || index >= playLineUpEntries.length) return;

    currentLineUpIndex = index;

    const [category, title] = playLineUpEntries[index];

    if (!songsDatabase[title]) {
        alert("Song not found: " + title);

    currentPlayingSong = {

    };

    document.getElementById("play-song-title").textContent =
        category + " — " + title;

    switchView("play");
}

/* SAVE NEW OR EDITED SONG */

async function saveSongFromEditor() {
    const content = document.getElementById("editor-textarea").value.trim();

    if (!content) {
        return alert("Please enter song lyrics.");
    }

    if (!window.fbDB) {
        return alert("Firebase is not connected.");
    }

    let title;

    if (isNewSongDraft) {
        title = newSongTitle.trim();

        if (!title) {
            return alert("Song title is missing. Please start again.");
        }
    } else {
        title = activeEditingKey;

        if (!title) {
            return alert("Song title is missing.");
        }
    }

    const newKey = safeKey(title);

    try {
        await window.fbSet(
            window.fbRef(window.fbDB, "worship_songs/" + newKey),
            content
        );

        await window.fbSet(
            window.fbRef(window.fbDB, "worship_song_titles/" + newKey),
            title
        );

        activeEditingKey = title;
        isNewSongDraft = false;
        newSongTitle = "";

        currentPlayingSong = {
            title: title,
            content: content
        };

        document.getElementById("edit-song-title-label").textContent = title;
        document.getElementById("play-song-title").textContent = title;

        /*
           Return to the song view after saving.
           Remove the editor from history so Back does not
           reopen the editor immediately.
        */

        if (viewHistory[viewHistory.length - 1] === "song-editor") {
            viewHistory.pop();
        }

        if (viewHistory[viewHistory.length - 1] !== "edit") {
            viewHistory.push("edit");
        }

        renderEditScreen();
        switchView("view-edit", false);

        alert("Song saved successfully!");

    } catch (error) {
        alert("Error saving song: " + error.message);
    }
}

async function deleteCurrentSong() {
    if (!activeEditingKey) return alert("Song not saved yet.");

    if (!confirm(`Delete "${activeEditingKey}"?`)) return;

    try {
        const key = getSongKey(activeEditingKey);

        await window.fbRemove(
            window.fbRef(window.fbDB, "worship_songs/" + key)
        );

        await window.fbRemove(
            window.fbRef(window.fbDB, "worship_song_titles/" + key)
        );

        activeEditingKey = null;
        currentPlayingSong = { title: "", content: "" };

        viewHistory = ["home"];
        switchView("home", false);

        alert("Song deleted.");
    } catch (error) {
        alert("Error deleting song: " + error.message);
    }
}

}

async function confirmAddCategory() {
    const input = document.getElementById("new-cat-input");
    const name = input.value.trim();

    if (!name) return;

    if (categories.some(category =>
        category.toLowerCase() === name.toLowerCase()
    )) {
        return alert("Category already exists.");
    }

    categories.push(name);

    try {
        await window.fbSet(
            window.fbRef(window.fbDB, "worship_categories"),
            categories
        );

        input.value = "";
        renderNewLineUpForm();
        closeModal("add-cat-modal");
    } catch (error) {
        alert("Error saving category: " + error.message);
        categories.pop();
    }
}

/* INITIALIZE */

document.addEventListener("DOMContentLoaded", () => {
    renderNewLineUpForm();
    renderSetList();

    document.getElementById("new-song-title-input")
        .addEventListener("keydown", event => {
            if (event.key === "Enter") {
                confirmAddSongTitle();
            }
        });
});
</script>
