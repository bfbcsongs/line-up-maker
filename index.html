
<!DOCTYPE html>
<html lang="en">
<head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
    getDatabase, ref, set, get, remove, onValue
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBLXaXG8EcxhGxqZCkFiqzLp9uF7vnYZS0",
    authDomain: "preach-mate.firebaseapp.com",
    databaseURL: "https://preach-mate-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "preach-mate",
    storageBucket: "preach-mate.firebasestorage.app",
    messagingSenderId: "977514996603",
    appId: "1:977514996603:web:1b0521748b3f7692b553de"
};

try {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.fbDB = db;
    window.fbRef = ref;
    window.fbSet = set;
    window.fbGet = get;
    window.fbRemove = remove;
    window.fbOnValue = onValue;

    window.dispatchEvent(new Event("firebase-ready"));
} catch (error) {
    console.error("Firebase initialization failed:", error);
    alert("Firebase initialization failed: " + error.message);
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root {
    --bg-color:#0b0f19;
    --panel-bg:#131b2e;
    --panel-border:#1e293b;
    --card-bg:#1a233a;
    --text-main:#f8fafc;
    --text-muted:#94a3b8;
    --accent:#2563eb;
    --success:#059669;
    --danger:#dc2626;
    --chord:#4ade80;
    --section:#38bdf8;
    --highlight:#facc15;
}

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg-color);
    color:var(--text-main);
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

header {
    background:var(--panel-bg);
    border-bottom:1px solid var(--panel-border);
    padding:8px 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-shrink:0;
    z-index:100;
    gap:6px;
}

.brand-title {
    font-size:.85rem;
    font-weight:700;
    color:#fff;
    letter-spacing:.3px;
    white-space:nowrap;
}

.toolbar-tools {
    display:flex;
    gap:4px;
    align-items:center;
    overflow-x:auto;
    max-width:65%;
}

.toolbar-tools::-webkit-scrollbar,
.play-right-bar::-webkit-scrollbar {
    display:none;
}

.tool-btn {
    background:#1e293b;
    color:var(--text-main);
    border:1px solid #334155;
    padding:4px 8px;
    border-radius:6px;
    display:flex;
    align-items:center;
    gap:3px;
    font-size:.7rem;
    font-weight:500;
    cursor:pointer;
    white-space:nowrap;
}

.trans-badge {
    display:flex;
    align-items:center;
    background:#0f172a;
    border:1px solid var(--panel-border);
    border-radius:6px;
    overflow:hidden;
    font-size:.68rem;
    flex-shrink:0;
}

.trans-badge span {
    padding:2px 3px;
    color:var(--text-muted);
    font-family:monospace;
}

.trans-badge button {
    background:#273548;
    color:#fff;
    border:none;
    padding:2px 5px;
    cursor:pointer;
    font-weight:bold;
}

.workspace {
    flex:1;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    min-height:0;
}

.view-section {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:none;
    flex-direction:column;
    background:var(--bg-color);
}

.view-section.active {
    display:flex;
}

.active-lineup-screen {
    flex:1;
    margin:10px;
    background:var(--panel-bg);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:10px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}

.screen-header {
    font-size:.85rem;
    font-weight:bold;
    color:var(--section);
    text-transform:uppercase;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--panel-border);
    padding-bottom:6px;
}

.category-row {
    background:#0f172a;
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:10px 12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:6px;
}

.cat-label {
    font-weight:bold;
    font-size:.8rem;
    color:var(--text-muted);
    flex-shrink:0;
}

.cat-song-title {
    font-size:.88rem;
    font-weight:600;
    color:#fff;
    cursor:pointer;
    flex:1;
    margin:0 5px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
}

.drawer-overlay {
    position:fixed;
    inset:0;
    background:rgba(5,8,15,.75);
    backdrop-filter:blur(3px);
    display:none;
    justify-content:flex-end;
    flex-direction:column;
    z-index:9999;
}

.drawer-panel {
    background:var(--panel-bg);
    border-top:1px solid var(--panel-border);
    border-radius:16px 16px 0 0;
    padding:18px;
    max-height:80vh;
    display:flex;
    flex-direction:column;
    gap:10px;
    box-shadow:0 -10px 25px rgba(0,0,0,.5);
}

.btn {
    background:#273548;
    color:#fff;
    border:1px solid #334155;
    padding:8px 12px;
    border-radius:6px;
    font-size:.8rem;
    cursor:pointer;
    font-weight:500;
    display:inline-flex;
    align-items:center;
    gap:4px;
    justify-content:center;
}

.btn-primary {
    background:var(--accent);
    border:none;
}

.btn-success {
    background:var(--success);
    border:none;
    color:#fff;
    font-weight:bold;
}

.btn-danger {
    background:var(--danger);
    border:none;
}

.btn-sm {
    padding:4px 8px;
    font-size:.72rem;
    flex-shrink:0;
}

.full-screen-container {
    display:flex;
    flex-direction:column;
    height:100%;
    min-height:0;
    background:var(--bg-color);
}

.edit-topbar {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 12px;
    background:var(--panel-bg);
    border-bottom:1px solid var(--panel-border);
    flex-shrink:0;
    z-index:50;
    gap:6px;
}

.editor-textarea {
    flex:1;
    width:100%;
    background:transparent;
    color:var(--text-main);
    border:none;
    padding:16px;
    font-family:monospace;
    font-size:.95rem;
    line-height:1.6;
    resize:none;
    outline:none;
    min-height:0;
    white-space:pre;
    tab-size:4;
    -webkit-overflow-scrolling:touch;
}

.editor-textarea::placeholder {
    color:#64748b;
}

.editor-detection {
    flex-shrink:0;
    padding:6px 12px;
    background:#0f172a;
    border-bottom:1px solid var(--panel-border);
    color:var(--text-muted);
    font-size:.68rem;
    display:flex;
    align-items:center;
    gap:5px;
    overflow-x:auto;
    white-space:nowrap;
}

.editor-detection strong {
    color:var(--section);
}

.editor-detection .detected-part {
    background:#1e293b;
    border:1px solid #334155;
    padding:3px 7px;
    border-radius:5px;
    color:var(--section);
    font-weight:bold;
}

.play-workspace {
    display:flex;
    flex:1;
    position:relative;
    overflow:hidden;
    min-height:0;
}

.output-box {
    flex:1;
    padding:12px 80px 12px 16px;
    overflow-y:auto;
    overflow-x:hidden;
    font-family:monospace;
    font-size:.95rem;
    line-height:1.35;
    white-space:pre;
    scroll-behavior:smooth;
    min-height:0;
    -webkit-overflow-scrolling:touch;
}

.play-right-bar {
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    max-height:75vh;
    display:flex;
    flex-direction:column;
    gap:5px;
    padding:6px 4px;
    overflow-y:auto;
    overflow-x:hidden;
    z-index:99;
    background:rgba(19,27,46,.25);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.05);
    border-radius:14px;
    -webkit-overflow-scrolling:touch;
}

.jumper-chip {
    background:rgba(30,41,59,.4);
    color:var(--section);
    border:1px solid rgba(56,189,248,.15);
    padding:6px 4px;
    border-radius:10px;
    font-size:.6rem;
    font-weight:bold;
    text-align:center;
    width:58px;
    cursor:pointer;
    text-transform:uppercase;
    flex-shrink:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    backdrop-filter:blur(2px);
    box-shadow:0 2px 6px rgba(0,0,0,.2);
}

.jumper-chip:active,
.jumper-chip.selected {
    background:var(--highlight);
    color:#000;
    border-color:var(--highlight);
}

.chord {
    color:var(--chord);
    font-weight:bold;
}

.song-part-block {
    display:block;
    margin-top:10px;
    margin-bottom:4px;
    padding:2px 4px;
    border-radius:6px;
    border:1px solid transparent;
    white-space:pre;
}

.song-part-title-wrapper {
    text-align:center;
    margin-bottom:2px;
    white-space:normal;
}

.song-part-title {
    color:var(--section);
    font-weight:bold;
    text-transform:uppercase;
    font-size:.85rem;
    cursor:pointer;
    display:inline-block;
}

.song-part-content {
    display:block;
    white-space:pre;
    line-height:1.3;
}

.song-part-block.active-block {
    background-color:rgba(250,204,21,.12)!important;
    border:1px solid rgba(250,204,21,.65)!important;
    margin-top:0;
    margin-bottom:0;
    min-height:100%;
    display:flex;
    flex-direction:column;
}

.song-part-block.active-block .song-part-title-wrapper {
    flex-shrink:0;
    padding-top:3px;
}

.song-part-block.active-block .song-part-title {
    color:var(--highlight)!important;
}

.song-part-block.active-block .song-part-content {
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-height:0;
}

.loose-content {
    white-space:pre;
    display:block;
}

.empty-message {
    font-size:.78rem;
    color:var(--text-muted);
    font-style:italic;
    padding:8px;
}

@media(max-width:480px) {
    .brand-title {
        font-size:.75rem;
    }

    .toolbar-tools {
        max-width:72%;
    }

    .tool-btn {
        font-size:.65rem;
        padding:4px 6px;
    }

    .play-right-bar {
        right:4px;
    }

    .jumper-chip {
        width:52px;
        font-size:.56rem;
    }

    .output-box {
        padding-right:68px;
    }
}
</style>
</head>

<body>

<header>
    <span class="brand-title">Line-up Maker</span>

    <div class="toolbar-tools">

        <div class="trans-badge">
            <span>K:<strong id="trans-val" style="color:#fff;">0</strong></span>
            <button onclick="transposeGlobal(-1)">-</button>
            <button onclick="transposeGlobal(1)">+</button>
        </div>

        <button class="tool-btn" onclick="openDrawer('drawer-setlist')">📋 Set List</button>
        <button class="tool-btn" onclick="openDrawer('drawer-songs')">🎵 Songs</button>
        <button class="tool-btn" onclick="openAddSongModal()">➕ Add Song</button>
        <button class="tool-btn" onclick="openDrawer('drawer-newlineup')">📝 New</button>
        <button class="tool-btn" onclick="openQRModal()">🌐 Wi-Fi</button>

    </div>
</header>

<div class="workspace">

    <!-- HOME -->
    <div id="view-home" class="view-section active">

        <div class="active-lineup-screen">

            <div class="screen-header">
                <span>ACTIVE LINE-UP</span>
                <button class="btn btn-sm btn-success" onclick="openSaveLineupModal()">Save Line-up</button>
            </div>

            <!-- FIX: Active lineup container was missing -->
            <div id="canvas-active-categories"
                 style="display:flex;flex-direction:column;gap:8px;">
            </div>

            <div style="flex:1;min-height:20px;"></div>

            <button class="btn btn-primary"
                    style="font-size:1.1rem;padding:15px 30px;border-radius:12px;"
                    onclick="openDrawer('drawer-setlist')">
                Start Jam
            </button>

        </div>
    </div>

    <!-- EDIT -->
    <div id="view-edit" class="view-section">

        <div class="full-screen-container">

            <div class="edit-topbar">

                <button class="btn btn-sm" onclick="goBackFromEdit()">⬅ Back</button>

                <span id="edit-song-title-label"
                      style="font-weight:bold;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:center;">
                    Edit Song
                </span>

                <div style="display:flex;gap:4px;">
                    <button class="btn btn-sm btn-danger" onclick="deleteCurrentSong()">Delete</button>
                    <button class="btn btn-sm btn-success" onclick="saveSongFromEditor()">Save</button>
                </div>

            </div>

            <!-- Live song-part detection in Edit Mode -->
            <div class="editor-detection">
                <strong>DETECTED PARTS:</strong>
                <span id="editor-detected-parts">None detected</span>
            </div>

            <textarea id="editor-textarea"
                      class="editor-textarea"

                      spellcheck="false"
                      wrap="off"

    </div>

    <!-- PLAY -->

        <div class="full-screen-container">

            <div class="edit-topbar">

                <button class="btn btn-sm" onclick="goBackFromPlay()">⬅ Back</button>

        </div>
    </div>

</div>

<!-- SET LIST DRAWER -->
<div id="drawer-setlist" class="drawer-overlay" onclick="closeDrawer('drawer-setlist')">

    <div class="drawer-panel" onclick="event.stopPropagation()">

        <h3 style="color:var(--success);font-size:.95rem;">Set List (Saved Line-ups)</h3>

        <div id="setlist-container"
             style="max-height:250px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;">

        <button class="btn" onclick="closeDrawer('drawer-setlist')">Close</button>

    </div>

<!-- SONG DATABASE -->
<div id="drawer-songs" class="drawer-overlay" onclick="closeDrawer('drawer-songs')">

<div id="drawer-newlineup" class="drawer-overlay" onclick="closeDrawer('drawer-newlineup')">

    </div>

<!-- ADD SONG TITLE -->

    <div class="drawer-panel" onclick="event.stopPropagation()">

        <h3 style="color:var(--accent);font-size:.95rem;">Enter Song Title</h3>

        <div style="display:flex;gap:6px;align-items:center;">

            <input type="text"

                    style="padding:8px 12px;">↵</button>

        <button class="btn" onclick="closeModal('add-song-title-modal')">Cancel</button>

    </div>
</div>


<script>
/* ==========================================
   GLOBAL VARIABLES
========================================== */

let categories = ["Opening","Joyful","Solemn","Offering","Closing"];

let activeLineUp = {};
let songsDatabase = {};
let songKeys = {};
let songTitles = {};
let setLists = [];

let globalSemitones = 0;
let activeEditingKey = null;
let currentPlayingSong = {title:"",content:""};
let activeCategoryToAssign = null;

let viewHistory = ["home"];

const notesSharp = [
    "C","C#","D","D#","E","F",
    "F#","G","G#","A","A#","B"
];

let firebaseInitialized = false;


/* ==========================================
   FIREBASE CONNECTION
========================================== */

window.addEventListener("firebase-ready",initializeFirebase);

function initializeFirebase() {

    if(firebaseInitialized || !window.fbDB) return;

    firebaseInitialized = true;

    // SONG DATABASE
    window.fbOnValue(
        window.fbRef(window.fbDB,"worship_songs"),
        snapshot => {

            const data = snapshot.val() || {};

            songsDatabase = {};
            songKeys = {};

            Object.entries(data).forEach(([key,content]) => {

                const title = songTitles[key] || key.replace(/_/g," ");

                songsDatabase[title] = content;
                songKeys[title] = key;

            });

            renderSongsDatabase();
            renderActiveLineUpCanvas();
            renderNewLineUpForm();

            // Refresh current song when cloud data changes
            if(currentPlayingSong.title &&
               currentPlayingSong.title in songsDatabase &&
               !document.getElementById("view-play").classList.contains("active")) {
                currentPlayingSong.content = songsDatabase[currentPlayingSong.title];
            }

        },
        error => console.error("Songs listener:",error)
    );


    // SONG TITLE METADATA
    window.fbOnValue(
        window.fbRef(window.fbDB,"worship_song_titles"),
        snapshot => {

            songTitles = snapshot.val() || {};

            window.fbGet(
                window.fbRef(window.fbDB,"worship_songs")
            ).then(songSnapshot => {

                songsDatabase = {};
                songKeys = {};

                const data = songSnapshot.val() || {};

                Object.entries(data).forEach(([key,content]) => {

                    const title = songTitles[key] || key.replace(/_/g," ");

                    songsDatabase[title] = content;
                    songKeys[title] = key;

                });

                renderSongsDatabase();
                renderActiveLineUpCanvas();
                renderNewLineUpForm();

            }).catch(console.error);

        },
        error => console.error("Song titles listener:",error)
    );


    // SAVED SET LISTS
    window.fbOnValue(
        window.fbRef(window.fbDB,"worship_setlists"),
        snapshot => {

            const data = snapshot.val();

            setLists = snapshot.exists()
                ? (Array.isArray(data) ? data : Object.values(data))
                : [];

            renderSetList();

        },
        error => console.error("Set lists listener:",error)
    );


    // CUSTOM CATEGORIES
    window.fbOnValue(
        window.fbRef(window.fbDB,"worship_categories"),
        snapshot => {

            const saved = snapshot.val();

            if(Array.isArray(saved) && saved.length) {
                categories = saved;
            }

            renderActiveLineUpCanvas();
            renderNewLineUpForm();

        },
        error => console.error("Categories listener:",error)
    );

}


/* ==========================================
   GENERAL HELPERS & VIEW ROUTING
========================================== */

function escapeHTML(value) {

    return String(value).replace(/[&<>"']/g,char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
    })[char]);

}

function safeKey(title) {
    return title.replace(/[.#$/\[\]]/g,"_");
}

function getSongKey(title) {
    return songKeys[title] || safeKey(title);
}

function switchView(viewName,pushHistory=true) {

    document.querySelectorAll(".view-section").forEach(el => {
        el.classList.remove("active");
    });

    const target = document.getElementById("view-"+viewName);

    if(!target) return;

    target.classList.add("active");

    if(pushHistory) {

        const currentTop = viewHistory[viewHistory.length-1];

        if(currentTop !== viewName) {
            viewHistory.push(viewName);
        }

    }

}

function goBack() {

    if(viewHistory.length>1) {

        viewHistory.pop();

        const previousView = viewHistory[viewHistory.length-1];

        switchView(previousView,false);

    } else {

        switchView("home",false);

    }

}

function goBackFromEdit() {
    goBack();
}

function goBackFromPlay() {
    goBack();
}

/* ==========================================
   TRANSPOSE FEATURE
========================================== */

function transposeGlobal(amount) {

    globalSemitones += amount;

    document.getElementById("trans-val").innerText =
        globalSemitones>0 ? "+"+globalSemitones : globalSemitones;

    if(document.getElementById("view-play").classList.contains("active")) {
        renderPlayScreen();
    }

}

function transposeNote(chord,semitones) {

    const match = chord.match(
        /^([A-G](?:#|b)?)(.*?)(?:\/([A-G](?:#|b)?))?$/
    );

    if(!match) return chord;

    function shift(note) {

        if(!note) return "";

        const normalized = note
            .replace("Db","C#")
            .replace("Eb","D#")
            .replace("Gb","F#")
            .replace("Ab","G#")
            .replace("Bb","A#");

        let index = notesSharp.indexOf(normalized);

        if(index===-1) return note;

        index = (index+semitones)%12;

        if(index<0) index+=12;

        return notesSharp[index];

    }

    return shift(match[1])+match[2]+
        (match[3] ? "/"+shift(match[3]) : "");

}


/* ==========================================
   SMART SONG PART DETECTOR
========================================== */

function isSongPartHeading(line) {

    let text = line.trim();

    if(!text) return null;

    text = text.replace(/^\[(.*?)\]$/,"$1").trim();
    text = text.replace(/:$/,"").trim();

    const patterns = [
        /^intro(?:duction)?$/i,
        /^verse(?:\s*\d+)?$/i,
        /^v(?:erse)?\s*\d+$/i,
        /^chorus$/i,
        /^pre[\s-]?chorus$/i,
        /^post[\s-]?chorus$/i,
        /^bridge$/i,
        /^ad[\s-]?lib$/i,
        /^outro$/i,
        /^ending$/i,
        /^end$/i,
        /^refrain$/i,
        /^tag$/i,
        /^instrumental$/i,
        /^interlude$/i,
        /^solo$/i,
        /^repeat(?:\s+chorus)?$/i,
        /^turnaround$/i,
        /^vamp$/i,
        /^coda$/i,
        /^modulation$/i,
        /^spoken$/i,
        /^prayer$/i
    ];

    if(patterns.some(pattern => pattern.test(text))) {
        return text.toUpperCase();
    }

    return null;

}


/* ==========================================
   LIVE DETECTION IN EDIT MODE
========================================== */

function updateEditorDetection() {

    const editor = document.getElementById("editor-textarea");
    const display = document.getElementById("editor-detected-parts");

    if(!editor || !display) return;

    const lines = editor.value.split(/\r?\n/);

    const detected = [];

    lines.forEach(line => {

        const part = isSongPartHeading(line);

        if(part) detected.push(part);

    });

    display.innerHTML = "";

    if(detected.length===0) {

        display.textContent="None detected";

        return;

    }

    detected.forEach(part => {

        const chip = document.createElement("span");

        chip.className="detected-part";
        chip.textContent=part;

        display.appendChild(chip);

    });

}


/* ==========================================
   CHORD DETECTOR
========================================== */

function isChordToken(token) {

    return /^[A-G](?:#|b)?(?:maj|min|m|dim|aug|sus|add|M)?\d*(?:\/[A-G](?:#|b)?)?$/.test(token);

}

function formatChordLine(line) {

    const chordRegex =
        /[A-G](?:#|b)?(?:maj|min|m|dim|aug|sus|add|M)?\d*(?:\/[A-G](?:#|b)?)?/g;

    const tokens = line.trim().split(/\s+/).filter(Boolean);

    const isChordLine =
        tokens.length>0 &&
        tokens.every(token => {

            const cleaned=token.replace(/^[|]+|[|]+$/g,"");

            return cleaned==="" || isChordToken(cleaned);

        });

    if(isChordLine) {

        return line.replace(chordRegex,chord => {

            return `<span class="chord">${escapeHTML(
                transposeNote(chord,globalSemitones)
            )}</span>`;

        });

    }

    // Inline chord notation, preserving every original character
    return escapeHTML(line).replace(
        /\[([A-G](?:#|b)?(?:maj|min|m|dim|aug|sus|add|M)?\d*(?:\/[A-G](?:#|b)?)?)\]/g,
        (match,chord) => {

            return `<span class="chord">${escapeHTML(
                transposeNote(chord,globalSemitones)
            )}</span>`;

        }
    );

}


/* ==========================================
   CONDITIONAL AUTO-SCALE
========================================== */

function autoScaleContent() {

    const box=document.getElementById("play-lyrics-box");

    if(!box) return;

    box.style.fontSize=".95rem";

    const availableWidth=box.clientWidth-95;

    if(availableWidth<=0) return;

    let maxLineWidth=0;

    box.querySelectorAll(".song-part-content,.loose-content").forEach(el => {

        if(el.scrollWidth>maxLineWidth) {
            maxLineWidth=el.scrollWidth;
        }

    });

    if(maxLineWidth>availableWidth) {

        const scaleRatio=availableWidth/maxLineWidth;

        const newFontSize=.95*scaleRatio;

        box.style.fontSize=Math.max(.6,newFontSize).toFixed(2)+"rem";

    }

}


/* ==========================================
   RENDER PLAY SCREEN
========================================== */

function renderPlayScreen() {

    const box=document.getElementById("play-lyrics-box");
    const jumper=document.getElementById("floating-jumper-bar");

    box.innerHTML="";
    jumper.innerHTML="";

    const content=currentPlayingSong.content || "";
    const lines=content.split(/\r?\n/);

    let htmlOutput="";
    let partCounter=0;
    let insideBlock=false;
    let hasContent=false;

    function closeBlock() {

        if(insideBlock) {

            htmlOutput+="</div></div>\n";

            insideBlock=false;

        }

    }

    function createBlock(label) {

        const id="song-part-"+partCounter++;

        htmlOutput+=`
            <div id="${id}" class="song-part-block">
                <div class="song-part-title-wrapper">
                    <span class="song-part-title"
                          onclick="jumpToBlock('${id}')">
                        [${escapeHTML(label)}]
                    </span>
                </div>
                <div class="song-part-content">`;

        const chip=document.createElement("button");

        chip.className="jumper-chip";
        chip.textContent=label;
        chip.dataset.target=id;
        chip.onclick=()=>jumpToBlock(id);

        jumper.appendChild(chip);

        insideBlock=true;
        hasContent=true;

    }

    let looseLines="";

    function closeLooseLines() {

        if(looseLines!=="") {

            htmlOutput+=`<div class="loose-content">${looseLines}</div>`;

            looseLines="";

        }

    }

    for(let i=0;i<lines.length;i++) {

        const line=lines[i];
        const detectedPart=isSongPartHeading(line);

        if(detectedPart) {

            closeLooseLines();
            closeBlock();

            createBlock(detectedPart);

        } else {

            const formatted=formatChordLine(line)+"\n";

            if(insideBlock) {

                htmlOutput+=formatted;

            } else {

                // Keep lyrics before the first detected heading.
                // They remain unclassified and receive no jumper.
                looseLines+=formatted;

                if(line.trim()) hasContent=true;

            }

        }

    }

    closeBlock();
    closeLooseLines();

    box.innerHTML=htmlOutput;

    if(!hasContent) {

        box.innerHTML=
            '<div class="empty-message">No song content available.</div>';

    }

    box.scrollTop=0;

    requestAnimationFrame(autoScaleContent);

}


/* ==========================================
   JUMP TO SONG PART
========================================== */

function jumpToBlock(id) {

    const box=document.getElementById("play-lyrics-box");
    const target=document.getElementById(id);

    if(!box || !target) return;

    box.querySelectorAll(".song-part-block").forEach(block => {

        block.classList.remove("active-block");
        block.style.minHeight="";

    });

    target.classList.add("active-block");

    // Use the visible lyrics area as the selected block height.
    const availableHeight=box.clientHeight;

    target.style.minHeight=availableHeight+"px";

    document.querySelectorAll(".jumper-chip").forEach(chip => {

        chip.classList.toggle(
            "selected",
            chip.dataset.target===id
        );

    });

    // Position the complete selected block in the center of the display.
    const boxRect=box.getBoundingClientRect();
    const targetRect=target.getBoundingClientRect();

    const targetPosition=
        box.scrollTop+
        targetRect.top-
        boxRect.top;

    box.scrollTo({
        top:Math.max(0,targetPosition),
        behavior:"smooth"
    });

    requestAnimationFrame(autoScaleContent);

}

/* ==========================================
   SAVE SONG
========================================== */

async function saveSongFromEditor() {

    // Preserve original line breaks and spacing.
    const text=document.getElementById("editor-textarea").value;

    if(!text.trim()) {

        return alert("Please enter song content.");

    }

    if(!window.fbDB) {

        return alert("Firebase is not connected.");

    }

    const title=document.getElementById("edit-song-title-label").textContent.trim();

    if(!title || title==="Edit Song") {

        return alert("Invalid song title.");

    }

    const content=text;

    const newKey=safeKey(title);

    try {

        await window.fbSet(
            window.fbRef(window.fbDB,"worship_songs/"+newKey),
            content
        );

        await window.fbSet(
            window.fbRef(window.fbDB,"worship_song_titles/"+newKey),
            title
        );

        if(activeEditingKey && activeEditingKey!==title) {

            const oldKey=getSongKey(activeEditingKey);

            if(oldKey!==newKey) {

                await window.fbRemove(
                    window.fbRef(window.fbDB,"worship_songs/"+oldKey)
                );

                await window.fbRemove(
                    window.fbRef(window.fbDB,"worship_song_titles/"+oldKey)
                );

            }

        }

        activeEditingKey=title;

        // Keep currently opened song synchronized.
        if(currentPlayingSong.title===title) {
            currentPlayingSong.content=content;
        }

        viewHistory=["home"];

        switchView("home",false);

        alert("Song saved successfully!");

    } catch(e) {

        alert("Error saving song: "+e.message);

    }

}


/* ==========================================
   DELETE SONG
========================================== */

async function deleteCurrentSong() {

    if(!activeEditingKey) {

        return alert("This song has not been saved yet.");

    }

    if(!confirm(`Delete "${activeEditingKey}"?`)) return;

    if(!window.fbDB) {

        return alert("Firebase is not connected.");

    }

    try {

        const deletedTitle=activeEditingKey;
        const key=getSongKey(deletedTitle);

        await window.fbRemove(
            window.fbRef(window.fbDB,"worship_songs/"+key)
        );

        await window.fbRemove(
            window.fbRef(window.fbDB,"worship_song_titles/"+key)
        );

        Object.keys(activeLineUp).forEach(cat=>{

            if(activeLineUp[cat]===deletedTitle) {
                delete activeLineUp[cat];
            }

        });

        if(currentPlayingSong.title===deletedTitle) {
            currentPlayingSong={title:"",content:""};
        }

        activeEditingKey=null;

        renderActiveLineUpCanvas();

        viewHistory=["home"];

        switchView("home",false);

        alert("Song deleted.");

    } catch(e) {

        alert("Error deleting song: "+e.message);

    }

}

function openAddCategoryModal() {

    document.getElementById("add-cat-modal").style.display="flex";

}

async function confirmAddCategory() {

    const input=document.getElementById("new-cat-input");

    const name=input.value.trim();

    if(!name) return;

    if(categories.some(cat=>cat.toLowerCase()===name.toLowerCase())) {

        return alert("Category already exists.");

    }

    if(!window.fbDB) {

        return alert("Firebase is not connected.");

    }

    const previous=[...categories];

    categories.push(name);

    try {

        await window.fbSet(
            window.fbRef(window.fbDB,"worship_categories"),
            categories
        );

        input.value="";

        renderActiveLineUpCanvas();
        renderNewLineUpForm();

        closeModal("add-cat-modal");

    } catch(e) {

        categories=previous;

        renderActiveLineUpCanvas();
        renderNewLineUpForm();

        alert("Error saving category: "+e.message);

    }

}


/* ==========================================
   INITIALIZE PAGE
========================================== */

document.addEventListener("DOMContentLoaded",()=>{

    renderActiveLineUpCanvas();
    renderNewLineUpForm();
    renderSetList();
    updateEditorDetection();

});

window.addEventListener("resize",()=>{

    if(document.getElementById("view-play").classList.contains("active")) {

        const activeBlock=document.querySelector(
            ".song-part-block.active-block"
        );

        if(activeBlock) {

            activeBlock.style.minHeight=
                document.getElementById("play-lyrics-box").clientHeight+"px";

        }

        autoScaleContent();

    }

});

</script>
