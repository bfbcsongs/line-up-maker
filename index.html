<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Worship Line Up Maker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --chord-color: #22c55e;
            --section-color: #38bdf8;
            --highlight-color: #facc15;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        h1 { font-size: 1rem; font-weight: 700; color: #fff; }

        .header-btns { display: flex; gap: 8px; }

        .btn {
            background: #334155;
            color: #fff;
            border: 1px solid #475569;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn:hover { background: #475569; }
        .btn-primary { background: var(--accent-color); border: none; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-success { background: var(--success-color); border: none; color: #000; font-weight: bold; }
        .btn-danger { background: var(--danger-color); border: none; }
        .btn-sm { padding: 3px 8px; font-size: 0.75rem; }

        .workspace {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .view-section { display: none; flex-direction: column; height: 100%; }
        .view-section.active { display: flex; }

        /* Category Card Style */
        .category-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--section-color);
            text-transform: uppercase;
        }

        .assigned-song-display {
            font-size: 0.85rem;
            color: #fff;
            background: #0f172a;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px dashed var(--border-color);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .assigned-song-display:hover { border-color: var(--accent-color); }

        /* Play View Layout with Right-Side Jumper */
        .play-container {
            display: flex;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .play-lyrics-pane {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            font-family: monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre;
            scroll-behavior: smooth;
        }

        .play-jumper-pane {
            width: 130px;
            background: #111827;
            border-left: 1px solid var(--border-color);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .chord { color: var(--chord-color); font-weight: bold; }

        .song-part-block {
            display: block;
            margin-top: 14px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.3s ease;
        }

        .song-part-title {
            color: var(--section-color);
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .song-part-block.active-block {
            background-color: rgba(250, 204, 21, 0.15);
            border-left: 4px solid var(--highlight-color);
        }
        .song-part-block.active-block .song-part-title {
            color: var(--highlight-color) !important;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-content input, .modal-content textarea, .modal-content select {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        .setlist-item {
            background: #111827;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="app-title">Worship Line Up Maker</h1>
        <div class="header-btns">
            <button class="btn" onclick="switchView('builder')">Builder</button>
            <button class="btn btn-primary" onclick="openSaveModal()">Save Line Up</button>
            <button class="btn btn-success" onclick="openSetListModal()">Set Lists</button>
        </div>
    </header>

    <div class="workspace">
        <!-- BUILDER VIEW -->
        <div id="view-builder" class="view-section active">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span style="font-size: 0.85rem; color: #94a3b8;">Ayusin ang Line Up para sa Service:</span>
                <button class="btn btn-sm btn-primary" onclick="openAddCategoryModal()">+ Add Category</button>
            </div>
            <div id="categories-container" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </div>

        <!-- PLAY VIEW -->
        <div id="view-play" class="view-section">
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #1e293b; border-bottom: 1px solid var(--border-color);">
                <button class="btn btn-sm" onclick="switchView('builder')">⬅ Back to Line Up</button>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span id="play-song-title" style="font-weight: bold; font-size: 0.9rem; color: var(--section-color);">Song Title</span>
                    <div style="background: #0f172a; border: 1px solid var(--border-color); border-radius: 4px; display: flex; overflow: hidden;">
                        <span style="padding: 2px 6px; font-size: 0.75rem; font-family: monospace;">Key: <strong id="trans-val">0</strong></span>
                        <button onclick="transposeKey(-1)" style="background:#334155; color:#fff; border:none; padding:2px 8px; cursor:pointer;">-</button>
                        <button onclick="transposeKey(1)" style="background:#334155; color:#fff; border:none; padding:2px 8px; cursor:pointer;">+</button>
                    </div>
                </div>
            </div>
            <div class="play-container">
                <div id="play-lyrics-box" class="play-lyrics-pane">Pumili ng kanta mula sa Line Up para simulan.</div>
                <div id="play-jumper-pane" class="play-jumper-pane">
                    <span style="font-size: 0.7rem; color: #94a3b8; font-weight: bold; text-align: center;">JUMPER</span>
                </div>
            </div>
        </div>
    </div>

    <!-- SONG SELECTOR MODAL -->
    <div id="song-select-modal" class="modal-overlay" onclick="closeModal('song-select-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="font-size: 1rem; color: var(--accent-color);">Pumili ng Kanta para sa <span id="modal-cat-name"></span></h3>
            <div style="display: flex; gap: 6px;">
                <input type="text" id="song-search-input" placeholder="Hanapin o i-type ang pangalan ng kanta..." oninput="filterSongsList()">
                <button class="btn btn-primary btn-sm" onclick="openNewSongDirectModal()">+ New</button>
            </div>
            <div id="songs-list-container" style="max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;"></div>
            <button class="btn" onclick="closeModal('song-select-modal')">Cancel</button>
        </div>
    </div>

    <!-- DIRECT NEW SONG & EDIT MODAL -->
    <div id="song-edit-modal" class="modal-overlay" onclick="closeModal('song-edit-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="font-size: 1rem; color: var(--accent-color);" id="edit-modal-title">I-edit ang Kanta</h3>
            <input type="text" id="edit-song-title" placeholder="Pamagat ng Kanta...">
            <textarea id="edit-song-content" placeholder="Ilagay ang lyrics at chords (Gamitin ang [Verse 1], [Chorus], etc.)..." style="height: 160px; font-family: monospace; resize: none;"></textarea>
            <div style="display: flex; gap: 8px;">
                <button class="btn" style="flex:1;" onclick="closeModal('song-edit-modal')">Cancel</button>
                <button class="btn btn-primary" style="flex:1;" onclick="saveSongDefinition()">Save Song</button>
            </div>
        </div>
    </div>

    <!-- SAVE LINE UP MODAL -->
    <div id="save-lineup-modal" class="modal-overlay" onclick="closeModal('save-lineup-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="font-size: 1rem; color: var(--success-color);">I-save ang Line Up sa Set List</h3>
            <input type="text" id="wl-name-input" placeholder="Pangalan ng Worship Leader...">
            <input type="date" id="lineup-date-input">
            <div style="display: flex; gap: 8px;">
                <button class="btn" style="flex:1;" onclick="closeModal('save-lineup-modal')">Cancel</button>
                <button class="btn btn-success" style="flex:1;" onclick="confirmSaveLineUp()">Save to Set List</button>
            </div>
        </div>
    </div>

    <!-- SET LIST MODAL -->
    <div id="setlist-modal" class="modal-overlay" onclick="closeModal('setlist-modal')">
        <div class="modal-content" onclick="event.stopPropagation()" style="max-width: 460px;">
            <h3 style="font-size: 1rem; color: var(--success-color);">Naka-save na Set Lists</h3>
            <div id="setlist-container" style="max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;"></div>
            <button class="btn" onclick="closeModal('setlist-modal')">Close</button>
        </div>
    </div>

    <!-- ADD CATEGORY MODAL -->
    <div id="add-cat-modal" class="modal-overlay" onclick="closeModal('add-cat-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="font-size: 1rem; color: var(--section-color);">Magdagdag ng Bagong Category</h3>
            <input type="text" id="new-cat-name" placeholder="Pangalan ng Category (Hal: Special Number)...">
            <div style="display: flex; gap: 8px;">
                <button class="btn" style="flex:1;" onclick="closeModal('add-cat-modal')">Cancel</button>
                <button class="btn btn-primary" style="flex:1;" onclick="confirmAddCategory()">Add</button>
            </div>
        </div>
    </div>

    <script>
        let categories = ["Opening", "Joyful", "Solemn", "Offerings", "Closing"];
        let lineUpData = {}; // { CategoryName: { title, content } }
        let songsDatabase = JSON.parse(localStorage.getItem('worship_songs_db') || "{}");
        let setLists = JSON.parse(localStorage.getItem('worship_setlists') || "[]");
        
        let activeCategoryForSelection = null;
        let activeEditingSongTitle = null;
        let currentPlayingSong = { title: "", content: "", semitones: 0 };
        const notesSharp = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

        window.addEventListener('DOMContentLoaded', () => {
            renderBuilderCategories();
            document.getElementById('lineup-date-input').valueAsDate = new Date();
        });

        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            if (viewName === 'builder') {
                document.getElementById('view-builder').classList.add('active');
                renderBuilderCategories();
            } else if (viewName === 'play') {
                document.getElementById('view-play').classList.add('active');
            }
        }

        function renderBuilderCategories() {
            const container = document.getElementById('categories-container');
            container.innerHTML = "";

            categories.forEach(cat => {
                let assigned = lineUpData[cat];
                let card = document.createElement('div');
                card.className = 'category-card';
                card.innerHTML = `
                    <div class="category-header">
                        <span class="category-title">${cat}</span>
                        <div style="display: flex; gap: 4px;">
                            <button class="btn btn-sm btn-primary" onclick="openSongSelector('${cat}')">+ Add Song</button>
                        </div>
                    </div>
                    <div class="assigned-song-display" onclick="${assigned ? `playAssignedSong('${cat}')` : `openSongSelector('${cat}')`}">
                        <span>${assigned ? '🎵 ' + assigned.title : '+ Pindutin para maglagay ng kanta'}</span>
                        ${assigned ? `<div style="display:flex; gap:4px;" onclick="event.stopPropagation()">
                            <button class="btn btn-sm" onclick="openEditAssignedSong('${cat}')">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="clearCategorySong('${cat}')">X</button>
                        </div>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        /* --- SONG SELECTOR & ASSIGN --- */
        function openSongSelector(cat) {
            activeCategoryForSelection = cat;
            document.getElementById('modal-cat-name').innerText = cat;
            renderSongsListModal("");
            document.getElementById('song-select-modal').style.display = 'flex';
        }

        function renderSongsListModal(filter) {
            const listContainer = document.getElementById('songs-list-container');
            listContainer.innerHTML = "";

            let found = false;
            for (let title in songsDatabase) {
                if (title.toLowerCase().includes(filter.toLowerCase()) || filter === "") {
                    found = true;
                    let item = document.createElement('div');
                    item.style.cssText = "display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 8px; border-radius: 6px;";
                    item.innerHTML = `
                        <span style="font-size: 0.85rem; cursor:pointer; flex:1;" onclick="selectSongForCategory('${title}')">🎵 ${title}</span>
                        <div style="display:flex; gap:4px;">
                            <button class="btn btn-sm" onclick="openEditExistingSong('${title}')">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteSongFromDb('${title}')">Del</button>
                        </div>
                    `;
                    listContainer.appendChild(item);
                }
            }
            if (!found) {
                listContainer.innerHTML = `<span style="font-size: 0.8rem; color: #94a3b8; text-align:center; padding: 10px;">Walang nakitang kanta. I-click ang '+ New' para gumawa.</span>`;
            }
        }

        function filterSongsList() {
            let query = document.getElementById('song-search-input').value;
            renderSongsListModal(query);
        }

        function selectSongForCategory(title) {
            if (songsDatabase[title]) {
                lineUpData[activeCategoryForSelection] = {
                    title: title,
                    content: songsDatabase[title]
                };
                closeModal('song-select-modal');
                renderBuilderCategories();
            }
        }

        function clearCategorySong(cat) {
            delete lineUpData[cat];
            renderBuilderCategories();
        }

        /* --- EDIT & NEW SONG MODAL --- */
        function openNewSongDirectModal() {
            closeModal('song-select-modal');
            activeEditingSongTitle = null;
            document.getElementById('edit-modal-title').innerText = "Gumawa ng Bagong Kanta";
            document.getElementById('edit-song-title').value = "";
            document.getElementById('edit-song-content').value = "";
            document.getElementById('song-edit-modal').style.display = 'flex';
        }

        function openEditExistingSong(title) {
            closeModal('song-select-modal');
            activeEditingSongTitle = title;
            document.getElementById('edit-modal-title').innerText = "I-edit ang Kanta: " + title;
            document.getElementById('edit-song-title').value = title;
            document.getElementById('edit-song-content').value = songsDatabase[title];
            document.getElementById('song-edit-modal').style.display = 'flex';
        }

        function openEditAssignedSong(cat) {
            let song = lineUpData[cat];
            if (!song) return;
            activeEditingSongTitle = song.title;
            document.getElementById('edit-modal-title').innerText = "I-edit ang Kanta: " + song.title;
            document.getElementById('edit-song-title').value = song.title;
            document.getElementById('edit-song-content').value = song.content;
            document.getElementById('song-edit-modal').style.display = 'flex';
        }

        function saveSongDefinition() {
            let title = document.getElementById('edit-song-title').value.trim();
            let content = document.getElementById('edit-song-content').value.trim();
            if (!title || !content) {
                alert("Mangyaring punan ang pamagat at ang nilalaman.");
                return;
            }

            if (activeEditingSongTitle && activeEditingSongTitle !== title) {
                delete songsDatabase[activeEditingSongTitle];
            }

            songsDatabase[title] = content;
            localStorage.setItem('worship_songs_db', JSON.stringify(songsDatabase));

            // Update din sa active line up kung nandoon man
            for (let cat in lineUpData) {
                if (lineUpData[cat].title === activeEditingSongTitle || lineUpData[cat].title === title) {
                    lineUpData[cat] = { title: title, content: content };
                }
            }

            closeModal('song-edit-modal');
            renderBuilderCategories();
            if (activeCategoryForSelection) openSongSelector(activeCategoryForSelection);
        }

        function deleteSongFromDb(title) {
            if (confirm(`Burahin ang "${title}" sa database?`)) {
                delete songsDatabase[title];
                localStorage.setItem('worship_songs_db', JSON.stringify(songsDatabase));
                renderSongsListModal("");
            }
        }

        /* --- PLAY VIEW & JUMPER --- */
        function playAssignedSong(cat) {
            let song = lineUpData[cat];
            if (!song) return;
            currentPlayingSong = { title: song.title, content: song.content, semitones: 0 };
            document.getElementById('play-song-title').innerText = song.title;
            renderPlayScreen();
            switchView('play');
        }

        function transposeNote(chord, semitones) {
            let root = chord[0];
            let suffix = chord.substring(root.length);
            let idx = notesSharp.indexOf(root);
            if (idx === -1) return chord;
            let newIdx = (idx + semitones) % 12;
            if (newIdx < 0) newIdx += 12;
            return notesSharp[newIdx] + suffix;
        }

        function renderPlayScreen() {
            const lyricsBox = document.getElementById('play-lyrics-box');
            const jumperPane = document.getElementById('play-jumper-pane');
            jumperPane.innerHTML = '<span style="font-size: 0.7rem; color: #94a3b8; font-weight: bold; text-align: center;">JUMPER</span>';
            document.getElementById('trans-val').innerText = currentPlayingSong.semitones > 0 ? `+${currentPlayingSong.semitones}` : currentPlayingSong.semitones;

            const lines = currentPlayingSong.content.split('\n');
            let htmlOutput = '';
            const chordRegex = /\b([A-G][#b]?(?:m|maj|min|dim|aug|sus|7|9|11|13)?(?:\/[A-G][#b]?)?)\b/g;
            const bracketRegex = /^\[(.*?)\]\s*$/;

            let partCounter = 0;
            let insideBlock = false;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                let trimmed = line.trim();
                let escaped = line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                
                let match = trimmed.match(bracketRegex);
                if (match) {
                    if (insideBlock) htmlOutput += `</div>\n`;
                    let label = match[1];
                    let id = `play-block-${partCounter}`;
                    
                    htmlOutput += `<div id="${id}" class="song-part-block">\n`;
                    htmlOutput += `<span class="song-part-title" onclick="jumpToBlock('${id}')">[${label}]</span>\n`;

                    // Button sa right-side jumper pane
                    let jBtn = document.createElement('button');
                    jBtn.className = 'btn btn-sm';
                    jBtn.style.fontSize = '0.7rem';
                    jBtn.innerText = label;
                    jBtn.onclick = () => jumpToBlock(id);
                    jumperPane.appendChild(jBtn);

                    partCounter++;
                    insideBlock = true;
                } else {
                    if (!insideBlock) {
                        htmlOutput += `<div id="play-block-intro" class="song-part-block">\n`;
                        insideBlock = true;
                    }
                    let formatted = escaped.replace(chordRegex, (m) => `<span class="chord">${transposeNote(m, currentPlayingSong.semitones)}</span>`);
                    htmlOutput += formatted + (i < lines.length - 1 ? '\n' : '');
                }
            }
            if (insideBlock) htmlOutput += `</div>\n`;
            lyricsBox.innerHTML = htmlOutput;
        }

        function jumpToBlock(blockId) {
            document.querySelectorAll('.song-part-block').forEach(el => el.classList.remove('active-block'));
            const target = document.getElementById(blockId);
            const box = document.getElementById('play-lyrics-box');
            if (target && box) {
                target.classList.add('active-block');
                const centerScroll = target.offsetTop - (box.clientHeight / 2) + (target.offsetHeight / 2);
                box.scrollTo({ top: centerScroll, behavior: 'smooth' });
            }
        }

        function transposeKey(amount) {
            currentPlayingSong.semitones += amount;
            renderPlayScreen();
        }

        /* --- SAVE LINE UP & SET LIST --- */
        function openSaveModal() {
            document.getElementById('save-lineup-modal').style.display = 'flex';
        }

        function confirmSaveLineUp() {
            let wlName = document.getElementById('wl-name-input').value.trim();
            let dateVal = document.getElementById('lineup-date-input').value;

            if (!wlName || !dateVal) {
                alert("Mangyaring ilagay ang Pangalan ng Worship Leader at ang Petsa.");
                return;
            }

            let newSetList = {
                id: Date.now(),
                worshipLeader: wlName,
                date: dateVal,
                lineup: { ...lineUpData }
            };

            setLists.unshift(newSetList);
            localStorage.setItem('worship_setlists', JSON.stringify(setLists));
            closeModal('save-lineup-modal');
            alert("Matagumpay na na-save ang Line Up sa Set List!");
        }

        function openSetListModal() {
            renderSetLists();
            document.getElementById('setlist-modal').style.display = 'flex';
        }

        function renderSetLists() {
            const container = document.getElementById('setlist-container');
            container.innerHTML = "";
            if (setLists.length === 0) {
                container.innerHTML = `<span style="font-size: 0.85rem; color: #94a3b8; text-align: center;">Wala pang naka-save na Set List.</span>`;
                return;
            }

            setLists.forEach((sl, index) => {
                let div = document.createElement('div');
                div.className = 'setlist-item';
                div.innerHTML = `
                    <div>
                        <strong style="color: var(--success-color); font-size: 0.85rem; display:block;">📅 ${sl.date} — WL: ${sl.worshipLeader}</strong>
                        <span style="font-size: 0.75rem; color: #94a3b8;">(${Object.keys(sl.lineup).length} kanta ang nakalista)</span>
                    </div>
                    <div style="display:flex; gap:4px;">
                        <button class="btn btn-sm btn-primary" onclick="loadSetList(${index})">Load</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteSetList(${index})">Del</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function loadSetList(index) {
            let sl = setLists[index];
            if (sl) {
                lineUpData = { ...sl.lineup };
                closeModal('setlist-modal');
                renderBuilderCategories();
                alert(`Na-load ang Set List noong ${sl.date} (WL: ${sl.worshipLeader})`);
            }
        }

        function deleteSetList(index) {
            if (confirm("Burahin ang Set List na ito?")) {
                setLists.splice(index, 1);
                localStorage.setItem('worship_setlists', JSON.stringify(setLists));
                renderSetLists();
            }
        }

        /* --- ADD CATEGORY --- */
        function openAddCategoryModal() {
            document.getElementById('new-cat-name').value = "";
            document.getElementById('add-cat-modal').style.display = 'flex';
        }

        function confirmAddCategory() {
            let catName = document.getElementById('new-cat-name').value.trim();
            if (catName && !categories.includes(catName)) {
                categories.push(catName);
                closeModal('add-cat-modal');
                renderBuilderCategories();
            }
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
