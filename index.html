<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Worship Line Up Maker Pro</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #131b2e;
            --panel-border: #1e293b;
            --card-bg: #1a233a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #059669;
            --danger: #dc2626;
            --chord: #4ade80;
            --section: #38bdf8;
            --highlight: #facc15;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Modern Header */
        header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 100;
        }

        .brand { display: flex; flex-direction: column; }
        h1 { font-size: 0.95rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
        .sub-brand { font-size: 0.7rem; color: var(--text-muted); }

        .header-actions { display: flex; gap: 6px; }

        .btn {
            background: #273548;
            color: #fff;
            border: 1px solid #334155;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--accent); border: none; }
        .btn-success { background: var(--success); border: none; color: #fff; font-weight: bold; }
        .btn-danger { background: var(--danger); border: none; }
        .btn-sm { padding: 4px 8px; font-size: 0.72rem; }

        .workspace {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .view-section {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            background: var(--bg-color);
        }
        .view-section.active { display: flex; }

        /* Builder Layout */
        .builder-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .builder-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            padding: 0 4px;
        }

        .categories-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 20px;
        }

        .category-card {
            background: var(--card-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .category-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-name {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--section);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .song-slot {
            background: #0f172a;
            border: 1px dashed #334155;
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .song-slot:hover { border-color: var(--accent); }
        .song-slot-filled { border: 1px solid #334155; border-style: solid; background: #111c33; }

        .song-title-text {
            font-size: 0.88rem;
            font-weight: 600;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .slot-actions { display: flex; gap: 6px; }

        /* True Full-Screen Edit & Play Views */
        .full-screen-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            background: var(--bg-color);
        }

        .mode-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
            flex-shrink: 0;
            z-index: 50;
        }

        /* Full Screen Textarea para sa Edit Mode */
        .editor-textarea {
            flex: 1;
            width: 100%;
            background: transparent;
            color: var(--text-main);
            border: none;
            padding: 16px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            tab-size: 4;
            -webkit-overflow-scrolling: touch;
        }

        /* Full Screen Output para sa Play Mode */
        .output-box {
            flex: 1;
            padding: 16px;
            padding-bottom: 90px; /* Dagdag space para sa floating jumper sa ibaba */
            overflow-y: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre;
            tab-size: 4;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        /* Floating Jumper Icons Bar sa ibaba */
        .floating-jumper-bar {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(19, 27, 46, 0.92);
            border: 1px solid var(--panel-border);
            padding: 6px 12px;
            border-radius: 24px;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            max-width: 95%;
            backdrop-filter: blur(6px);
            z-index: 60;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            -webkit-overflow-scrolling: touch;
        }
        .floating-jumper-bar::-webkit-scrollbar { display: none; }

        .jumper-chip {
            background: #1e293b;
            color: var(--section);
            border: 1px solid #334155;
            padding: 5px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: bold;
            white-space: nowrap;
            cursor: pointer;
            text-transform: uppercase;
        }
        .jumper-chip:hover { background: #334155; color: #fff; }

        .chord { color: var(--chord); font-weight: bold; }

        /* Full Block Yellow Highlight */
        .song-part-block {
            display: block;
            margin-top: 14px;
            padding: 6px 10px;
            border-radius: 6px;
            transition: background 0.3s ease;
        }

        .song-part-title {
            color: var(--section);
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-block;
        }

        .song-part-block.active-block {
            background-color: rgba(250, 204, 21, 0.15);
            border-left: 4px solid var(--highlight);
        }
        .song-part-block.active-block .song-part-title {
            color: var(--highlight) !important;
        }

        /* Modern Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 8, 15, 0.85);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-card h3 { font-size: 0.95rem; font-weight: 700; }
        
        .modal-card input, .modal-card textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .song-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #1e293b;
        }

        .setlist-card {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>Worship Line Up</h1>
            <span class="sub-brand" id="active-lineup-label">Service Builder</span>
        </div>
        <div class="header-actions">
            <button class="btn" onclick="switchView('builder')">Builder</button>
            <button class="btn btn-primary btn-sm" onclick="openSaveModal()">Save</button>
            <button class="btn btn-success btn-sm" onclick="openSetListModal()">Set Lists</button>
        </div>
    </header>

    <div class="workspace">
        <!-- BUILDER VIEW -->
        <div id="view-builder" class="view-section active">
            <div class="builder-scroll">
                <div class="builder-toolbar">
                    <span style="font-size: 0.78rem; color: var(--text-muted); font-weight: 500;">Piliin ang mga kanta bawat bahagi:</span>
                    <button class="btn btn-sm btn-primary" onclick="openAddCategoryModal()">+ Category</button>
                </div>
                <div id="categories-container" class="categories-grid"></div>
            </div>
        </div>

        <!-- EDIT VIEW (True Full Screen WYSIWYG) -->
        <div id="view-edit" class="view-section">
            <div class="full-screen-container">
                <div class="mode-topbar">
                    <button class="btn btn-sm" onclick="exitEditMode()">⬅ Back</button>
                    <span id="edit-song-title-label" style="font-weight: 600; font-size: 0.85rem; color: var(--accent);">Edit Song</span>
                    <button class="btn btn-sm btn-success" onclick="saveActiveSongChanges()">Save & Play</button>
                </div>
                <textarea id="editor-textarea" class="editor-textarea" placeholder="[Verse 1]&#10;C    G&#10;Lyrics dito..." oninput="previewEditChanges()"></textarea>
            </div>
        </div>

        <!-- PLAY VIEW (True Full Screen with Floating Jumper) -->
        <div id="view-play" class="view-section">
            <div class="full-screen-container">
                <div class="mode-topbar">
                    <button class="btn btn-sm" onclick="switchView('builder')">⬅ Builder</button>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span id="play-song-title" style="font-weight: 600; font-size: 0.85rem; color: var(--section);">Song Title</span>
                        <div style="background: #0f172a; border: 1px solid #334155; border-radius: 6px; display: flex; overflow: hidden; align-items: center;">
                            <span style="padding: 2px 6px; font-size: 0.7rem; font-family: monospace; color: var(--text-muted);">Key: <strong id="trans-val" style="color:#fff;">0</strong></span>
                            <button onclick="transposeKey(-1)" style="background:#273548; color:#fff; border:none; padding:4px 8px; cursor:pointer; font-weight:bold;">-</button>
                            <button onclick="transposeKey(1)" style="background:#273548; color:#fff; border:none; padding:4px 8px; cursor:pointer; font-weight:bold;">+</button>
                        </div>
                        <button class="btn btn-sm btn-primary" onclick="openEditorFromPlay()">Edit</button>
                    </div>
                </div>
                <div id="play-lyrics-box" class="output-box">Wala pang nakatalagang kanta.</div>
                <!-- Floating Jumper Icons Bar sa Ibaba -->
                <div id="floating-jumper-bar" class="floating-jumper-bar">
                    <span style="font-size: 0.65rem; color: var(--text-muted); align-self: center; font-weight: bold;">JUMP:</span>
                </div>
            </div>
        </div>
    </div>

    <!-- SONG SELECTOR MODAL -->
    <div id="song-select-modal" class="modal-overlay" onclick="closeModal('song-select-modal')">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3>Pumili para sa <span id="modal-cat-name" style="color: var(--section);"></span></h3>
                <button class="btn btn-sm btn-primary" onclick="openNewSongDirectModal()">+ New Song</button>
            </div>
            <input type="text" id="song-search-input" placeholder="Hanapin ang kanta..." oninput="filterSongsList()">
            <div id="songs-list-container" style="max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;"></div>
            <button class="btn" onclick="closeModal('song-select-modal')">Cancel</button>
        </div>
    </div>

    <!-- SAVE LINEUP MODAL -->
    <div id="save-lineup-modal" class="modal-overlay" onclick="closeModal('save-lineup-modal')">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h3 style="color: var(--success);">Save to Set List</h3>
            <input type="text" id="wl-name-input" placeholder="Pangalan ng Worship Leader...">
            <input type="date" id="lineup-date-input">
            <div style="display: flex; gap: 8px;">
                <button class="btn" style="flex:1;" onclick="closeModal('save-lineup-modal')">Cancel</button>
                <button class="btn btn-success" style="flex:1;" onclick="confirmSaveLineUp()">Save</button>
            </div>
        </div>
    </div>

    <!-- SET LISTS MODAL -->
    <div id="setlist-modal" class="modal-overlay" onclick="closeModal('setlist-modal')">
        <div class="modal-card" onclick="event.stopPropagation()" style="max-width: 440px;">
            <h3 style="color: var(--success);">Naka-save na Set Lists</h3>
            <div id="setlist-container" style="max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;"></div>
            <button class="btn" onclick="closeModal('setlist-modal')">Close</button>
        </div>
    </div>

    <!-- ADD CATEGORY MODAL -->
    <div id="add-cat-modal" class="modal-overlay" onclick="closeModal('add-cat-modal')">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h3 style="color: var(--section);">Bagong Category</h3>
            <input type="text" id="new-cat-name" placeholder="Pangalan (Hal: Special Number)...">
            <div style="display: flex; gap: 8px;">
                <button class="btn" style="flex:1;" onclick="closeModal('add-cat-modal')">Cancel</button>
                <button class="btn btn-primary" style="flex:1;" onclick="confirmAddCategory()">Add</button>
            </div>
        </div>
    </div>

    <script>
        let categories = ["Opening", "Joyful", "Solemn", "Offerings", "Closing"];
        let lineUpData = {}; 
        let songsDatabase = JSON.parse(localStorage.getItem('worship_songs_db') || "{}");
        let setLists = JSON.parse(localStorage.getItem('worship_setlists') || "[]");
        
        let activeCategoryForSelection = null;
        let activePlayingCategory = null;
        let currentPlayingSong = { title: "", content: "", semitones: 0 };
        const notesSharp = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

        window.addEventListener('DOMContentLoaded', () => {
            renderBuilderCategories();
            document.getElementById('lineup-date-input').valueAsDate = new Date();
        });

        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            if (viewName === 'builder') {
                document.getElementById('view-builder').classList.add('active');
                document.getElementById('active-lineup-label').innerText = "Service Builder";
                renderBuilderCategories();
            } else if (viewName === 'play') {
                document.getElementById('view-play').classList.add('active');
                document.getElementById('active-lineup-label').innerText = "Live Performance";
            } else if (viewName === 'edit') {
                document.getElementById('view-edit').classList.add('active');
                document.getElementById('active-lineup-label').innerText = "Song Editor";
            }
        }

        function renderBuilderCategories() {
            const container = document.getElementById('categories-container');
            container.innerHTML = "";

            categories.forEach(cat => {
                let assigned = lineUpData[cat];
                let card = document.createElement('div');
                card.className = 'category-card';
                card.innerHTML = `
                    <div class="category-top">
                        <span class="category-name">${cat}</span>
                        <button class="btn btn-sm" onclick="openSongSelector('${cat}')">+ Add Song</button>
                    </div>
                    <div class="song-slot ${assigned ? 'song-slot-filled' : ''}" onclick="${assigned ? `playAssignedSong('${cat}')` : `openSongSelector('${cat}')`}">
                        <div class="song-title-text">${assigned ? '🎵 ' + assigned.title : '<span style="color:var(--text-muted); font-size:0.8rem; font-style:italic;">Walang kanta pang nailagay...</span>'}</div>
                        ${assigned ? `<div class="slot-actions" onclick="event.stopPropagation()">
                            <button class="btn btn-sm" onclick="openEditorForCategory('${cat}')">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="clearCategorySong('${cat}')">X</button>
                        </div>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openSongSelector(cat) {
            activeCategoryForSelection = cat;
            document.getElementById('modal-cat-name').innerText = cat;
            renderSongsListModal("");
            document.getElementById('song-select-modal').style.display = 'flex';
        }

        function renderSongsListModal(filter) {
            const listContainer = document.getElementById('songs-list-container');
            listContainer.innerHTML = "";

            let found = false;
            for (let title in songsDatabase) {
                if (title.toLowerCase().includes(filter.toLowerCase()) || filter === "") {
                    found = true;
                    let item = document.createElement('div');
                    item.className = 'song-item-row';
                    item.innerHTML = `
                        <span style="font-size: 0.85rem; font-weight: 500; cursor:pointer; flex:1;" onclick="selectSongForCategory('${title}')">🎵 ${title}</span>
                        <div style="display:flex; gap:4px;">
                            <button class="btn btn-sm btn-danger" onclick="deleteSongFromDb('${title}')">Del</button>
                        </div>
                    `;
                    listContainer.appendChild(item);
                }
            }
            if (!found) {
                listContainer.innerHTML = `<span style="font-size: 0.8rem; color: var(--text-muted); text-align:center; padding: 12px; font-style:italic;">Walang nakitang kanta sa database.</span>`;
            }
        }

        function filterSongsList() {
            renderSongsListModal(document.getElementById('song-search-input').value);
        }

        function selectSongForCategory(title) {
            if (songsDatabase[title]) {
                lineUpData[activeCategoryForSelection] = { title: title, content: songsDatabase[title] };
                closeModal('song-select-modal');
                renderBuilderCategories();
            }
        }

        function clearCategorySong(cat) {
            delete lineUpData[cat];
            renderBuilderCategories();
        }

        function openNewSongDirectModal() {
            closeModal('song-select-modal');
            activePlayingCategory = null;
            document.getElementById('edit-song-title-label').innerText = "Bagong Kanta";
            document.getElementById('editor-textarea').value = "[Verse 1]\n\n[Chorus]\n";
            switchView('edit');
        }

        function openEditorForCategory(cat) {
            activePlayingCategory = cat;
            let song = lineUpData[cat];
            if (!song) return;
            document.getElementById('edit-song-title-label').innerText = "I-edit: " + song.title;
            // Isasama natin ang pamagat sa itaas ng textarea para madali ma-edit o ma-save
            document.getElementById('editor-textarea').value = `[${song.title}]\n\n` + song.content;
            switchView('edit');
        }

        function openEditorFromPlay() {
            if (!activePlayingCategory) return;
            openEditorForCategory(activePlayingCategory);
        }

        function exitEditMode() {
            if (activePlayingCategory) {
                switchView('play');
            } else {
                switchView('builder');
            }
        }

        function saveActiveSongChanges() {
            let fullText = document.getElementById('editor-textarea').value.trim();
            if (!fullText) { alert("Walang nilalaman ang kanta."); return; }

            // Kunin ang pamagat mula sa unang bracket [Title] kung mayroon, o gamitin default
            let firstLineMatch = fullText.match(/^\[(.*?)\]/);
            let title = firstLineMatch ? firstLineMatch[1] : "Untitled Song";
            
            // Tanggalin ang title block sa simula para maging purong lyrics & chords ang content
            let content = fullText.replace(/^\[.*?\]\s*/, "").trim();

            songsDatabase[title] = content;
            localStorage.setItem('worship_songs_db', JSON.stringify(songsDatabase));

            if (activePlayingCategory) {
                lineUpData[activePlayingCategory] = { title: title, content: content };
                currentPlayingSong = { title: title, content: content, semitones: 0 };
                document.getElementById('play-song-title').innerText = title;
                renderPlayScreen();
                switchView('play');
            } else {
                renderBuilderCategories();
                switchView('builder');
            }
        }

        function playAssignedSong(cat) {
            activePlayingCategory = cat;
            let song = lineUpData[cat];
            if (!song) return;
            currentPlayingSong = { title: song.title, content: song.content, semitones: 0 };
            document.getElementById('play-song-title').innerText = song.title;
            renderPlayScreen();
            switchView('play');
        }

        function transposeNote(chord, semitones) {
            let root = chord[0];
            let suffix = chord.substring(root.length);
            let idx = notesSharp.indexOf(root);
            if (idx === -1) return chord;
            let newIdx = (idx + semitones) % 12;
            if (newIdx < 0) newIdx += 12;
            return notesSharp[newIdx] + suffix;
        }

        function renderPlayScreen() {
            const lyricsBox = document.getElementById('play-lyrics-box');
            const jumperBar = document.getElementById('floating-jumper-bar');
            jumperBar.innerHTML = '<span style="font-size: 0.65rem; color: var(--text-muted); align-self: center; font-weight: bold;">JUMP:</span>';
            document.getElementById('trans-val').innerText = currentPlayingSong.semitones > 0 ? `+${currentPlayingSong.semitones}` : currentPlayingSong.semitones;

            const lines = currentPlayingSong.content.split('\n');
            let htmlOutput = '';
            const chordRegex = /\b([A-G][#b]?(?:m|maj|min|dim|aug|sus|7|9|11|13)?(?:\/[A-G][#b]?)?)\b/g;
            const bracketRegex = /^\[(.*?)\]\s*$/;

            let partCounter = 0;
            let insideBlock = false;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                let trimmed = line.trim();
                let escaped = line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                
                let match = trimmed.match(bracketRegex);
                if (match) {
                    if (insideBlock) htmlOutput += `</div>\n`;
                    let label = match[1];
                    let id = `play-block-${partCounter}`;
                    
                    htmlOutput += `<div id="${id}" class="song-part-block">\n`;
                    htmlOutput += `<span class="song-part-title" onclick="jumpToBlock('${id}')">[${label}]</span>\n`;

                    // Floating Jumper Chip sa ibaba
                    let jChip = document.createElement('button');
                    jChip.className = 'jumper-chip';
                    jChip.innerText = label;
                    jChip.onclick = () => jumpToBlock(id);
                    jumperBar.appendChild(jChip);

                    partCounter++;
                    insideBlock = true;
                } else {
                    if (!insideBlock) {
                        htmlOutput += `<div id="play-block-intro" class="song-part-block">\n`;
                        insideBlock = true;
                    }
                    let formatted = escaped.replace(chordRegex, (m) => `<span class="chord">${transposeNote(m, currentPlayingSong.semitones)}</span>`);
                    htmlOutput += formatted + (i < lines.length - 1 ? '\n' : '');
                }
            }
            if (insideBlock) htmlOutput += `</div>\n`;
            lyricsBox.innerHTML = htmlOutput;
        }

        // Line-Count Dynamic Centering batay sa buong haba ng bloke
        function jumpToBlock(blockId) {
            document.querySelectorAll('.song-part-block').forEach(el => el.classList.remove('active-block'));
            const target = document.getElementById(blockId);
            const box = document.getElementById('play-lyrics-box');
            if (target && box) {
                target.classList.add('active-block');
                const blockTop = target.offsetTop;
                const blockHeight = target.offsetHeight;
                const boxHeight = box.clientHeight;
                
                const exactCenterScroll = blockTop - (boxHeight / 2) + (blockHeight / 2);
                box.scrollTo({ top: exactCenterScroll, behavior: 'smooth' });
            }
        }

        function transposeKey(amount) {
            currentPlayingSong.semitones += amount;
            renderPlayScreen();
        }

        function deleteSongFromDb(title) {
            if (confirm(`Burahin ang "${title}"?`)) {
                delete songsDatabase[title];
                localStorage.setItem('worship_songs_db', JSON.stringify(songsDatabase));
                renderSongsListModal("");
            }
        }

        function openSaveModal() { document.getElementById('save-lineup-modal').style.display = 'flex'; }

        function confirmSaveLineUp() {
            let wlName = document.getElementById('wl-name-input').value.trim();
            let dateVal = document.getElementById('lineup-date-input').value;
            if (!wlName || !dateVal) { alert("Ilagay ang pangalan ng Worship Leader at petsa."); return; }

            setLists.unshift({ id: Date.now(), worshipLeader: wlName, date: dateVal, lineup: { ...lineUpData } });
            localStorage.setItem('worship_setlists', JSON.stringify(setLists));
            closeModal('save-lineup-modal');
            alert("Matagumpay na nai-save ang Set List!");
        }

        function openSetListModal() { renderSetLists(); document.getElementById('setlist-modal').style.display = 'flex'; }

        function renderSetLists() {
            const container = document.getElementById('setlist-container');
            container.innerHTML = "";
            if (setLists.length === 0) {
                container.innerHTML = `<span style="font-size: 0.8rem; color: var(--text-muted); text-align:center; font-style:italic; padding: 10px;">Walang naka-save na Set List.</span>`;
                return;
            }

            setLists.forEach((sl, index) => {
                let div = document.createElement('div');
                div.className = 'setlist-card';
                div.innerHTML = `
                    <div>
                        <strong style="color: var(--success); font-size: 0.82rem; display:block;">📅 ${sl.date} — WL: ${sl.worshipLeader}</strong>
                        <span style="font-size: 0.72rem; color: var(--text-muted);">${Object.keys(sl.lineup).length} kanta ang nakalista</span>
                    </div>
                    <div style="display:flex; gap:4px;">
                        <button class="btn btn-sm btn-primary" onclick="loadSetList(${index})">Load</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteSetList(${index})">Del</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function loadSetList(index) {
            let sl = setLists[index];
            if (sl) {
                lineUpData = { ...sl.lineup };
                closeModal('setlist-modal');
                renderBuilderCategories();
                alert(`Na-load ang Set List noong ${sl.date}`);
            }
        }

        function openAddCategoryModal() { document.getElementById('new-cat-name').value = ""; document.getElementById('add-cat-modal').style.display = 'flex'; }
        function confirmAddCategory() {
            let name = document.getElementById('new-cat-name').value.trim();
            if (name && !categories.includes(name)) { categories.push(name); closeModal('add-cat-modal'); renderBuilderCategories(); }
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
