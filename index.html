
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Line-up Maker</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
    getDatabase, ref, set, get, remove, onValue
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBLXaXG8EcxhGxqZCkFiqzLp9uF7vnYZS0",
    authDomain: "preach-mate.firebaseapp.com",
    databaseURL: "https://preach-mate-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "preach-mate",
    storageBucket: "preach-mate.firebasestorage.app",
    messagingSenderId: "977514996603",
    appId: "1:1b0521748b3f7692b553de"
};

try {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.fbDB = db;
    window.fbRef = ref;
    window.fbSet = set;
    window.fbGet = get;
    window.fbRemove = remove;
    window.fbOnValue = onValue;

    window.dispatchEvent(new Event("firebase-ready"));
} catch (error) {
    console.error("Firebase initialization failed:", error);
    alert("Firebase initialization failed: " + error.message);
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root {
    --bg-color: #0b0f19;
    --panel-bg: #131b2e;
    --panel-border: #1e293b;
    --card-bg: #1a233a;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #2563eb;
    --success: #059669;
    --danger: #dc2626;
    --chord: #4ade80;
    --section: #38bdf8;
    --highlight: #facc15;
    --song-font-size: 16px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-color);
    color: var(--text-main);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

header {
    background: var(--panel-bg);
    border-bottom: 1px solid var(--panel-border);
    padding: 8px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    z-index: 100;
}

.brand-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.3px;
    white-space: nowrap;
}

.toolbar-tools {
    display: flex;
    gap: 4px;
    align-items: center;
    overflow-x: auto;
    max-width: 65%;
}

.toolbar-tools::-webkit-scrollbar {
    display: none;
}

.tool-btn {
    background: #1e293b;
    color: var(--text-main);
    border: 1px solid #334155;
    padding: 4px 8px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 0.7rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
}

.trans-badge {
    display: flex;
    align-items: center;
    background: #0f172a;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    overflow: hidden;
    font-size: 0.68rem;
    flex-shrink: 0;
}

.trans-badge span {
    padding: 2px 3px;
    color: var(--text-muted);
    font-family: monospace;
}

.trans-badge button {
    background: #273548;
    color: #fff;
    border: none;
    padding: 2px 5px;
    cursor: pointer;
    font-weight: bold;
}

.workspace {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

.view-section {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
    flex-direction: column;
    background: var(--bg-color);
}

.view-section.active {
    display: flex;
}

.active-lineup-screen {
    flex: 1;
    margin: 10px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

.screen-header {
    font-size: 0.85rem;
    font-weight: bold;
    color: var(--section);
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 6px;
}

.category-row {
    background: #0f172a;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
}

.cat-label {
    font-weight: bold;
    font-size: 0.8rem;
    color: var(--text-muted);
    flex-shrink: 0;
}

.cat-song-title {
    font-size: 0.88rem;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    flex: 1;
    margin: 0 5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
}

.drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 15, 0.75);
    backdrop-filter: blur(3px);

    z-index: 9999;
}

.drawer-panel {
    background: var(--panel-bg);
    border-top: 1px solid var(--panel-border);
    border-radius: 16px 16px 0 0;
    padding: 18px;

    flex-direction: column;
    gap: 10px;
    box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
}

.btn {
    background: #273548;
    color: #fff;
    border: 1px solid #334155;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 0.8rem;
    cursor: pointer;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    justify-content: center;
}

.btn-primary {
    background: var(--accent);
    border: none;
}

.btn-success {
    background: var(--success);
    border: none;
    color: #fff;
    font-weight: bold;
}

.btn-danger {
    background: var(--danger);
    border: none;
}

.btn-sm {
    padding: 4px 8px;
    font-size: 0.72rem;
    flex-shrink: 0;
}

.full-screen-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    background: var(--bg-color);
}

.edit-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: var(--panel-bg);
    border-bottom: 1px solid var(--panel-border);
    flex-shrink: 0;

    gap: 6px;
}

.editor-title-input {
    width: 100%;
    min-width: 0;
    background: #0f172a;
    border: 1px solid #334155;
    color: #fff;
    padding: 9px 10px;
    border-radius: 6px;
    font-size: 0.9rem;
    outline: none;
}

/* SONG SHEET */

.song-sheet-viewport {
    flex: 1;
    width: 100%;
    min-height: 0;
    overflow: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 14px 12px 40px;
}

.song-sheet {
    display: block;
    width: 100%;
    min-width: 0;
    font-family: "Courier New", Courier, monospace;
    font-size: var(--song-font-size);
    line-height: 1.35;
}

.song-part-block {
    display: block;
    width: 100%;
    min-width: 0;
    padding: 10px;
    margin: 0 0 14px 0;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
}

.song-part-block.active-block {
    background: rgba(250, 204, 21, 0.12) !important;
    border: 1px solid var(--highlight) !important;
    border-radius: 10px;
}

.song-part-title-wrapper {
    display: block;
    width: 100%;
    text-align: left;
    margin-bottom: 7px;
}

.song-part-title {
    display: inline-block;
    color: var(--section);
    font-weight: bold;
    text-align: left;
    cursor: pointer;
}

.song-part-content {
    display: block;
    width: 100%;
}

.song-fixed-line {
    position: relative;
    display: block;
    width: 100%;
    min-height: 2.7em;
    font-family: "Courier New", Courier, monospace;
    font-size: var(--song-font-size);
    line-height: 1.35;
    margin-bottom: 5px;
    padding-top: 1.25em;
}

.song-lyric-layer {
    position: relative;
    display: block;
    width: 100%;
    min-height: 1.35em;
    color: var(--text-main);
    font-family: "Courier New", Courier, monospace;
    font-size: var(--song-font-size);
    line-height: 1.35;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-break: normal;
    outline: none;
    z-index: 1;
}

.song-lyric-layer[contenteditable="true"] {
    cursor: text;
    caret-color: var(--highlight);
    border-radius: 2px;
}

.song-lyric-layer[contenteditable="true"]:focus {
    background: rgba(255,255,255,0.025);
}

.song-chord-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 4;
}

.song-chord {
    position: absolute;
    display: inline-block;
    color: var(--chord);
    font-weight: bold;
    white-space: nowrap;
    font-family: "Courier New", Courier, monospace;

    margin: 0;

}

.song-heading-editable {
    cursor: pointer;
    border-bottom: 1px dashed rgba(56,189,248,0.25);
}

.song-heading-editable:active {

}

.chord {
    color: #4ade80 !important;
    font-weight: bold;
}

/* PLAY WORKSPACE */

.play-workspace {
    display: flex;
    flex: 1;
    position: relative;
    overflow: hidden;
    min-height: 0;
}

.output-box {
    flex: 1;
    padding: 12px 16px;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-behavior: smooth;
    min-height: 0;
    -webkit-overflow-scrolling: touch;
}

.play-right-bar {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);

    flex-direction: column;
    gap: 10px;
    padding: 8px 5px;
    overflow-y: auto;
    overflow-x: hidden;
    z-index: 99;
    background: transparent !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    border: none !important;
    border-radius: 14px;

}

.jumper-chip {
    background: rgba(30, 41, 59, 0.08) !important;
    color: var(--section);
    border: 1px solid rgba(56, 189, 248, 0.35);
    padding: 9px 5px;
    border-radius: 11px;
    font-size: 0.7rem;
    font-weight: bold;

    width: 68px;
    min-height: 38px;
    cursor: pointer;
    text-transform: uppercase;
    flex-shrink: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.12);
    transition: background 0.2s, border-color 0.2s;
}

.jumper-chip:active,
.jumper-chip.selected {
    background: rgba(30, 41, 59, 0.08) !important;
    color: var(--highlight);
    border: 2px solid var(--highlight);
    box-shadow: 0 0 5px rgba(250, 204, 21, 0.35);
}

.empty-message {
    color: var(--text-muted);
    font-size: 0.85rem;
    padding: 10px;
}

@media(max-width: 480px) {
    .brand-title {
        font-size: 0.75rem;
    }

    .toolbar-tools {
        max-width: 72%;
    }

    .tool-btn {
        font-size: 0.65rem;
        padding: 4px 6px;
    }

    .play-right-bar {
        right: 4px;
    }

    .jumper-chip {
        width: 62px;
        min-height: 36px;
        font-size: 0.65rem;
    }

    .song-sheet-viewport {
        padding-left: 8px;
        padding-right: 8px;
    }

    .output-box {
        padding-left: 10px;
        padding-right: 70px;
    }
}
</style>

<body>

<header>
    <span class="brand-title">Line-up Maker</span>

    <div class="toolbar-tools">
        <div class="trans-badge">
            <span>K:<strong id="trans-val" style="color:#fff;">0</strong></span>
            <button onclick="transposeGlobal(-1)">-</button>
            <button onclick="transposeGlobal(1)">+</button>
        </div>

        <button class="tool-btn" onclick="openDrawer('drawer-setlist')">📋 Set List</button>
        <button class="tool-btn" onclick="openDrawer('drawer-songs')">🎵 Songs</button>
        <button class="tool-btn" onclick="openAddSongModal()">➕ Add Song</button>
        <button class="tool-btn" onclick="openDrawer('drawer-newlineup')">📝 New</button>
        <button class="tool-btn" onclick="openQRModal()">🌐 Wi-Fi</button>
    </div>
</header>

<div class="workspace">

    <!-- HOME -->
    <div id="view-home" class="view-section active">
        <div class="active-lineup-screen">
            <div class="screen-header">
                <span>ACTIVE LINE-UP</span>
                <span id="home-worship-leader"></span>
            </div>

            <div id="home-lineup-container" style="display:flex;flex-direction:column;gap:8px;">
                <div class="empty-message">No active line-up. Select Start Jam.</div>
            </div>

            <button id="start-jam-btn" class="btn btn-primary"
                onclick="openDrawer('drawer-setlist')">
                Start Jam
            </button>
        </div>
    </div>

    <!-- EDIT -->
    <div id="view-edit" class="view-section">
        <div class="full-screen-container">

            <div class="edit-topbar">
                <button class="btn btn-sm" onclick="goBackFromEdit()">⬅ Back</button>

                <span id="edit-song-title-label" style="font-weight:bold;color:var(--accent);">
                    Edit Song

                    <button class="btn btn-sm btn-danger" onclick="deleteCurrentSong()">Delete</button>
                    <button class="btn btn-sm btn-success" onclick="saveSongFromEditor()">Save</button>

            </div>

            <div style="padding:10px;background:var(--panel-bg);border-bottom:1px solid var(--panel-border);">

            </div>

            <div id="editor-song-viewport" class="song-sheet-viewport">

        </div>
    </div>

    <!-- PLAY -->
    <div id="view-play" class="view-section">
        <div class="full-screen-container">
            <div class="edit-topbar">
                <button class="btn btn-sm" onclick="goBackFromPlay()">⬅ Back</button>
                <span id="play-song-title" style="font-weight:bold;color:var(--section);">Song Title</span>
                <button class="btn btn-sm btn-primary" onclick="openEditorFromPlay()">Edit</button>
            </div>

            <div class="play-workspace">
                <div id="play-lyrics-box" class="output-box"></div>
                <div id="floating-jumper-bar" class="play-right-bar"></div>
            </div>
        </div>
    </div>

</div>

<!-- SET LIST DRAWER -->
<div id="drawer-setlist" class="drawer-overlay" onclick="closeDrawer('drawer-setlist')">
    <div class="drawer-panel" onclick="event.stopPropagation()">
        <h3 style="color:var(--success);font-size:0.95rem;">Set List (Saved Line-ups)</h3>
        <div id="setlist-container" style="max-height:250px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;"></div>
        <button class="btn" onclick="closeDrawer('drawer-setlist')">Close</button>
    </div>
</div>

<!-- SONG DATABASE -->
<div id="drawer-songs" class="drawer-overlay" onclick="closeDrawer('drawer-songs')">
    <div class="drawer-panel" onclick="event.stopPropagation()">
        <h3 style="color:var(--accent);font-size:0.95rem;">Song Database</h3>
        <input type="text" id="song-search-input" placeholder="Search song..."
            oninput="renderSongsDatabase()"
            style="background:#0f172a;border:1px solid #334155;color:#fff;padding:8px;border-radius:6px;outline:none;">
        <div id="songs-db-container" style="max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;"></div>
        <button class="btn" onclick="closeDrawer('drawer-songs')">Close</button>
    </div>
</div>

<!-- NEW LINEUP -->
<div id="drawer-newlineup" class="drawer-overlay" onclick="closeDrawer('drawer-newlineup')">
    <div class="drawer-panel" onclick="event.stopPropagation()">
        <h3 style="color:var(--highlight);font-size:0.95rem;">Create New Line-up</h3>

        <div style="display:flex;gap:6px;">
            <button class="btn btn-sm" onclick="openAddCategoryModal()">+ Category</button>

        <button class="btn" onclick="closeDrawer('drawer-newlineup')">Close</button>

<!-- SELECT SONG -->
<div id="select-song-modal" class="drawer-overlay" onclick="closeModal('select-song-modal')">

        <h3 style="font-size:0.95rem;">Select Song for <span id="select-modal-cat" style="color:var(--section);"></span></h3>
        <div id="modal-songs-list" style="max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;"></div>
        <button class="btn" onclick="closeModal('select-song-modal')">Cancel</button>
    </div>
</div>

<!-- SAVE ACTIVE LINEUP -->
<div id="save-lineup-modal" class="drawer-overlay" onclick="closeModal('save-lineup-modal')">
    <div class="drawer-panel" onclick="event.stopPropagation()">
        <h3 style="color:var(--success);font-size:0.95rem;">Save Active Line-up</h3>
        <input type="text" id="save-wl-input" placeholder="Worship Leader Name..."
            style="background:#0f172a;border:1px solid #334155;color:#fff;padding:8px;border-radius:6px;outline:none;">
        <button class="btn btn-success" onclick="confirmSaveActiveLineUp()">Save</button>
        <button class="btn" onclick="closeModal('save-lineup-modal')">Cancel</button>
    </div>
</div>

<!-- QR -->
<div id="qr-modal" class="drawer-overlay" onclick="closeModal('qr-modal')">
    <div class="drawer-panel" onclick="event.stopPropagation()" style="align-items:center;text-align:center;">
        <h3 style="font-size:0.95rem;">Local Wi-Fi QR Code</h3>
        <div id="qrcode" style="background:#fff;padding:10px;border-radius:8px;"></div>
        <p style="font-size:0.75rem;color:var(--text-muted);word-break:break-all;" id="wifi-link-text"></p>
        <button class="btn" onclick="closeModal('qr-modal')">Close</button>
    </div>
</div>

<!-- ADD CATEGORY -->
<div id="add-cat-modal" class="drawer-overlay" onclick="closeModal('add-cat-modal')">
    <div class="drawer-panel" onclick="event.stopPropagation()">
        <h3 style="font-size:0.95rem;">Add Custom Category</h3>
        <input type="text" id="new-cat-input" placeholder="Category Name..."
            style="background:#0f172a;border:1px solid #334155;color:#fff;padding:8px;border-radius:6px;outline:none;">
        <button class="btn btn-primary" onclick="confirmAddCategory()">Add</button>
        <button class="btn" onclick="closeModal('add-cat-modal')">Cancel</button>
    </div>
</div>

<script>
let categories = ["Opening", "Joyful", "Solemn", "Offering", "Closing"];
let activeLineUp = {};
let songsDatabase = {};
let songKeys = {};
let songTitles = {};
let setLists = [];

let globalSemitones = 0;
let activeEditingKey = null;
let currentPlayingSong = { title: "", content: "" };
let activeCategoryToAssign = null;
let viewHistory = ["home"];

let editorLines = [];

const notesSharp = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

let firebaseInitialized = false;

window.addEventListener("firebase-ready", initializeFirebase);

/* -----------------------------------------
   FIREBASE
----------------------------------------- */

function initializeFirebase() {
    if (firebaseInitialized || !window.fbDB) return;
    firebaseInitialized = true;

    window.fbOnValue(
        window.fbRef(window.fbDB, "worship_songs"),
        snapshot => {
            const data = snapshot.val() || {};
            songsDatabase = {};
            songKeys = {};

            Object.entries(data).forEach(([key, content]) => {
                const title = songTitles[key] || key.replace(/_/g, " ");
                songsDatabase[title] = content;
                songKeys[title] = key;
            });

            renderSongsDatabase();
            renderNewLineUpForm();
        },
        error => console.error("Songs listener:", error)
    );

    window.fbOnValue(
        window.fbRef(window.fbDB, "worship_song_titles"),
        snapshot => {
            songTitles = snapshot.val() || {};

            window.fbGet(window.fbRef(window.fbDB, "worship_songs")).then(songSnapshot => {
                songsDatabase = {};
                songKeys = {};

                const data = songSnapshot.val() || {};

                Object.entries(data).forEach(([key, content]) => {
                    const title = songTitles[key] || key.replace(/_/g, " ");
                    songsDatabase[title] = content;
                    songKeys[title] = key;
                });

                renderSongsDatabase();
                renderNewLineUpForm();
            }).catch(console.error);
        },
        error => console.error("Song titles listener:", error)
    );

    window.fbOnValue(
        window.fbRef(window.fbDB, "worship_setlists"),
        snapshot => {
            const data = snapshot.val();

            if (!data) {
                setLists = [];
            } else if (Array.isArray(data)) {
                setLists = data.filter(Boolean);
            } else {
                setLists = Object.values(data).filter(Boolean);
            }

            renderSetList();
        },
        error => console.error("Set lists listener:", error)
    );

    window.fbOnValue(
        window.fbRef(window.fbDB, "worship_categories"),
        snapshot => {

            if (Array.isArray(saved) && saved.length) {

            }

            renderNewLineUpForm();
        },
        error => console.error("Categories listener:", error)
    );

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function safeKey(title) {

/* -----------------------------------------
   TRANSPOSE
----------------------------------------- */

function transposeGlobal(amount) {
    globalSemitones += amount;

    const el = document.getElementById("trans-val");

    if (el) {
        el.innerText = globalSemitones > 0
            ? "+" + globalSemitones
            : globalSemitones;
    }

    if (document.getElementById("view-play")?.classList.contains("active")) {
        renderPlayScreen();
    }

    if (document.getElementById("view-edit")?.classList.contains("active")) {
        renderEditor();
    }
}

function transposeNote(chord, semitones) {
    const match = chord.match(/^([A-G](?:#|b)?)(.*?)(?:\/([A-G](?:#|b)?))?$/);
    if (!match) return chord;

    function shift(note) {
        if (!note) return "";

        const normalized = note
            .replace("Db", "C#")
            .replace("Eb", "D#")
            .replace("Gb", "F#")
            .replace("Ab", "G#")
            .replace("Bb", "A#");

        let index = notesSharp.indexOf(normalized);
        if (index === -1) return note;

        index = (index + semitones) % 12;
        if (index < 0) index += 12;

        return notesSharp[index];
    }

    return shift(match[1]) +
        match[2] +
        (match[3] ? "/" + shift(match[3]) : "");
}

/* -----------------------------------------
   SONG PART DETECTION
----------------------------------------- */

function isSongPartHeading(line) {
    let text = line.trim();

    if (!text) return null;

    text = text
        .replace(/^\[(.*?)\]$/, "$1")
        .trim()
        .replace(/:$/, "")
        .trim();

    const patterns = [
        /^intro(?:duction)?$/i,
        /^verse(?:\s*\d+)?$/i,
        /^v(?:erse)?\s*\d+$/i,
        /^chorus$/i,
        /^pre[\s-]?chorus$/i,
        /^post[\s-]?chorus$/i,
        /^bridge$/i,
        /^ad[\s-]?lib$/i,
        /^outro$/i,
        /^ending$/i,
        /^end$/i,
        /^refrain$/i,
        /^tag$/i,
        /^instrumental$/i,
        /^interlude$/i,
        /^solo$/i,
        /^repeat(?:\s+chorus)?$/i,
        /^turnaround$/i,
        /^vamp$/i,
        /^coda$/i,
        /^modulation$/i,
        /^spoken$/i,
        /^prayer$/i
    ];

    return patterns.some(pattern => pattern.test(text))
        ? text.toUpperCase()
        : null;
}

function isChordToken(token) {
    return /^[A-G](?:#|b)?(?:maj|min|m|dim|aug|sus|add|M)?\d*(?:\/[A-G](?:#|b)?)?$/.test(token);
}

/* -----------------------------------------
   SONG PARSER / SERIALIZER
----------------------------------------- */

function parseSongLine(line) {
    const result = {
        text: "",
        chords: [],
        chordOnly: false,
        original: line
    };

    if (!line) return result;

    const tokens = [...line.matchAll(/[^ \t|]+/g)];

    if (tokens.length > 0) {
        const cleaned = tokens.map(match =>
            match[0].replace(/^[|]+|[|]+$/g, "")
        );

        const allChords = cleaned.every(token =>
            token === "" || isChordToken(token)
        );

        if (allChords) {
            result.chordOnly = true;

            tokens.forEach(match => {
                const chord = match[0].replace(/^[|]+|[|]+$/g, "");

                if (isChordToken(chord)) {
                    result.chords.push({
                        pos: match.index,
                        chord: chord
                    });
                }
            });

            return result;
        }
    }

    const regex = /\[([^\]]+)\]/g;
    let lastIndex = 0;
    let match;

    while ((match = regex.exec(line)) !== null) {
        const chord = match[1].trim();

        if (isChordToken(chord)) {
            result.text += line.slice(lastIndex, match.index);

            result.chords.push({
                pos: result.text.length,
                chord: chord
            });

            lastIndex = regex.lastIndex;
        }
    }

    result.text += line.slice(lastIndex);

    return result;
}

function serializeSongLine(line) {
    const parsed = typeof line === "string"
        ? parseSongLine(line)
        : line;

    if (parsed.chordOnly) {
        if (!parsed.chords.length) return "";

        const sorted = [...parsed.chords].sort((a, b) => a.pos - b.pos);
        let output = "";

        sorted.forEach(item => {
            const target = Math.max(0, item.pos);

            if (output.length < target) {
                output += " ".repeat(target - output.length);
            }

            if (output.length > target) {
                output += " ";
            }

            output += item.chord;
        });

        return output;
    }

    let output = parsed.text || "";

    const sorted = [...parsed.chords].sort((a, b) => b.pos - a.pos);

    sorted.forEach(item => {
        const position = Math.max(0, Math.min(item.pos, output.length));

        output =
            output.slice(0, position) +
            "[" + item.chord + "]" +
            output.slice(position);
    });

    return output;
}

/* -----------------------------------------
   CHORD POSITION MEASUREMENT
----------------------------------------- */

function getTextPositionRect(textElement, position) {
    const textNode = textElement.firstChild;

    if (!textNode || textNode.nodeType !== Node.TEXT_NODE) {
        const rect = textElement.getBoundingClientRect();

        return {
            left: rect.left,
            top: rect.top,
            height: parseFloat(getComputedStyle(textElement).lineHeight) || 22
        };
    }

    const textLength = textNode.textContent.length;
    const safePosition = Math.max(0, Math.min(position, textLength));

    const range = document.createRange();

    if (safePosition < textLength) {
        range.setStart(textNode, safePosition);
        range.setEnd(textNode, safePosition + 1);

        const rects = range.getClientRects();

        if (rects.length) {
            return {
                left: rects[0].left,
                top: rects[0].top,
                height: rects[0].height
            };
        }
    }

    if (textLength > 0) {
        range.setStart(textNode, textLength - 1);
        range.setEnd(textNode, textLength);

        const rects = range.getClientRects();

        if (rects.length) {
            return {
                left: rects[0].right,
                top: rects[0].top,
                height: rects[0].height
            };
        }
    }

    const fallback = textElement.getBoundingClientRect();

    return {
        left: fallback.left,
        top: fallback.top,
        height: parseFloat(getComputedStyle(textElement).lineHeight) || 22
    };
}

/* -----------------------------------------
   SHARED SONG LINE RENDERER
----------------------------------------- */

function createSongLine(rawLine, editable = false, lineIndex = -1) {
    const parsed = parseSongLine(rawLine);

    const container = document.createElement("div");
    container.className = "song-fixed-line";

    const lyricLayer = document.createElement("div");
    lyricLayer.className = "song-lyric-layer";
    lyricLayer.textContent = parsed.chordOnly ? "" : parsed.text;

    const chordLayer = document.createElement("div");
    chordLayer.className = "song-chord-layer";

    container.append(lyricLayer, chordLayer);

    if (editable) {
        lyricLayer.contentEditable = "true";
        lyricLayer.spellcheck = false;

        lyricLayer.addEventListener("input", () => {
            const current = parseSongLine(editorLines[lineIndex]);
            const newText = lyricLayer.textContent;

            current.text = newText;
            current.chordOnly = false;

            current.chords = current.chords.map(item => ({
                pos: Math.max(0, Math.min(item.pos, newText.length)),
                chord: item.chord
            }));

            editorLines[lineIndex] = serializeSongLine(current);
        });

        lyricLayer.addEventListener("blur", () => {
            const current = parseSongLine(editorLines[lineIndex]);

            current.text = lyricLayer.textContent;
            current.chordOnly = false;

            current.chords = current.chords.map(item => ({
                pos: Math.max(0, Math.min(item.pos, current.text.length)),
                chord: item.chord
            }));

            editorLines[lineIndex] = serializeSongLine(current);
        });

        lyricLayer.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                event.preventDefault();

                const selection = window.getSelection();
                if (!selection || !selection.rangeCount) return;

                const range = selection.getRangeAt(0);
                const offset = range.startOffset;

                const current = parseSongLine(editorLines[lineIndex]);
                const text = lyricLayer.textContent;

                current.text = text.slice(0, offset) + "\n" + text.slice(offset);
                editorLines[lineIndex] = serializeSongLine(current);

                renderEditor();
            }
        });
    }

    parsed.chords.forEach(item => {
        const chord = document.createElement("span");

        chord.className = "song-chord";
        chord.textContent = transposeNote(item.chord, globalSemitones);

        const positionRect = getTextPositionRect(lyricLayer, item.pos);
        const parentRect = container.getBoundingClientRect();

        const fontSize = parseFloat(getComputedStyle(lyricLayer).fontSize) || 16;

        chord.style.left = (positionRect.left - parentRect.left) + "px";
        chord.style.top =
            (positionRect.top - parentRect.top - fontSize * 1.25) + "px";

        chordLayer.appendChild(chord);
    });

    return container;
}

/* -----------------------------------------
   EDITOR RENDERING
----------------------------------------- */

function renderEditor() {
    const sheet = document.getElementById("editor-song-sheet");
    if (!sheet) return;

    sheet.innerHTML = "";

    editorLines.forEach((line, index) => {
        const heading = isSongPartHeading(line);

        if (heading) {
            const headingElement = document.createElement("div");
            headingElement.className = "song-part-title-wrapper";

            const title = document.createElement("span");
            title.className = "song-part-title song-heading-editable";
            title.textContent = "[" + heading + "]";
            title.title = "Tap to rename this song part";

            title.onclick = () => {
                const current = line
                    .trim()
                    .replace(/^\[/, "")
                    .replace(/\]$/, "");

                const replacement = prompt(
                    "Song part name:",
                    current
                );

                if (replacement === null || !replacement.trim()) return;

                editorLines[index] = "[" + replacement.trim() + "]";
                renderEditor();
            };

            headingElement.appendChild(title);
            sheet.appendChild(headingElement);
            return;
        }

        sheet.appendChild(createSongLine(line, true, index));
    });
}

/* -----------------------------------------
   SAVE SONG
----------------------------------------- */

async function saveSongFromEditor() {
    const title = document.getElementById("editor-song-title").value.trim();

    if (!title) {
        alert("Please enter a song title.");
        return;
    }

    if (!window.fbDB) {
        alert("Firebase is not connected.");
        return;
    }

    const content = editorLines
        .map(line => typeof line === "string" ? line : serializeSongLine(line))
        .join("\n")
        .trim();

    const newKey = activeEditingKey
        ? getSongKey(activeEditingKey)
        : safeKey(title);

    try {
        await window.fbSet(
            window.fbRef(window.fbDB, "worship_songs/" + newKey),
            content
        );

        await window.fbSet(
            window.fbRef(window.fbDB, "worship_song_titles/" + newKey),
            title
        );

        activeEditingKey = title;

        songsDatabase[title] = content;
        songKeys[title] = newKey;
        songTitles[newKey] = title;

        switchView("home");
        alert("Song saved successfully!");

        renderSongsDatabase();
        renderNewLineUpForm();

    } catch (error) {
        alert("Error saving song: " + error.message);
    }
}

async function deleteCurrentSong() {
    if (!activeEditingKey) {
        return alert("Song not saved yet.");
    }

    if (!confirm(`Delete "${activeEditingKey}"?`)) return;

    try {
        const key = getSongKey(activeEditingKey);

        await window.fbRemove(
            window.fbRef(window.fbDB, "worship_songs/" + key)
        );

        await window.fbRemove(
            window.fbRef(window.fbDB, "worship_song_titles/" + key)
        );

        activeEditingKey = null;
        switchView("home");
        alert("Song deleted.");

    } catch (error) {
        alert("Error deleting song: " + error.message);
    }
}

   PLAY SCREEN
----------------------------------------- */

function renderPlayScreen() {
    const box = document.getElementById("play-lyrics-box");
    const jumper = document.getElementById("floating-jumper-bar");

    if (!box || !jumper) return;

    box.innerHTML = "";
    jumper.innerHTML = "";

    const content = currentPlayingSong.content || "";
    const lines = content.split(/\r?\n/);

    let currentBlock = null;
    let partCounter = 0;
    let hasContent = false;

    function createBlock(label) {
        const id = "song-part-" + partCounter++;

        const block = document.createElement("div");
        block.id = id;
        block.className = "song-part-block";

        const titleWrapper = document.createElement("div");
        titleWrapper.className = "song-part-title-wrapper";

        const title = document.createElement("span");
        title.className = "song-part-title";
        title.textContent = "[" + label + "]";
        title.onclick = () => jumpToBlock(id);

        titleWrapper.appendChild(title);

        const partContent = document.createElement("div");
        partContent.className = "song-part-content";

        block.append(titleWrapper, partContent);
        box.appendChild(block);

        const chip = document.createElement("button");
        chip.className = "jumper-chip";
        chip.textContent = label;
        chip.dataset.target = id;

        chip.onclick = () => jumpToBlock(id);

        jumper.appendChild(chip);

        currentBlock = partContent;
        hasContent = true;
    }

    lines.forEach(line => {
        const detectedPart = isSongPartHeading(line.trim());

        if (detectedPart) {
            createBlock(detectedPart);
            return;
        }

        if (currentBlock) {
            currentBlock.appendChild(
                createSongLine(line, false)
            );
        }
    });

    if (!hasContent) {
        box.innerHTML =
            '<div class="empty-message">No song sections found. Add section headers like [Verse 1].</div>';
    }

    box.scrollTop = 0;
}

function jumpToBlock(id) {
    const box = document.getElementById("play-lyrics-box");
    const target = document.getElementById(id);

    if (!box || !target) return;

    box.querySelectorAll(".song-part-block").forEach(block => {
        block.classList.remove("active-block");
    });

    target.classList.add("active-block");

    document.querySelectorAll(".jumper-chip").forEach(chip => {
        chip.classList.toggle("selected", chip.dataset.target === id);
    });

    const boxRect = box.getBoundingClientRect();
    const targetRect = target.getBoundingClientRect();

    const targetPosition =
        box.scrollTop +
        targetRect.top -
        boxRect.top -
        (box.clientHeight / 2) +
        (target.offsetHeight / 2);

    box.scrollTo({
        top: Math.max(0, targetPosition),
        behavior: "smooth"
    });
}

    } catch (error) {
        alert("Error saving line-up: " + error.message);
    }
}

/* -----------------------------------------
   PLAY SONG
----------------------------------------- */

function playSong(title) {
    if (!(title in songsDatabase)) {
        return alert("Song not found.");
    }

    currentPlayingSong = {
        title: title,
        content: songsDatabase[title]
    };

    document.getElementById("play-song-title").textContent = title;

    renderPlayScreen();
    switchView("play");
}

/* -----------------------------------------
   QR CODE
----------------------------------------- */

function openQRModal() {
    const localUrl = window.location.href;

    document.getElementById("wifi-link-text").textContent = localUrl;

    const qr = document.getElementById("qrcode");
    qr.innerHTML = "";

    if (typeof QRCode !== "undefined") {
        new QRCode(qr, {
            text: localUrl,
            width: 150,
            height: 150
        });
    }

    document.getElementById("qr-modal").style.display = "flex";
}

/* -----------------------------------------
   CATEGORY
----------------------------------------- */

function openAddCategoryModal() {
    document.getElementById("add-cat-modal").style.display = "flex";
}

async function confirmAddCategory() {
    const input = document.getElementById("new-cat-input");
    const name = input.value.trim();

    if (!name) return;

    if (categories.some(category =>
        category.toLowerCase() === name.toLowerCase()
    )) {
        return alert("Category already exists.");
    }

    categories.push(name);

    try {
        await window.fbSet(
            window.fbRef(window.fbDB, "worship_categories"),
            categories
        );

        input.value = "";
        renderNewLineUpForm();
        closeModal("add-cat-modal");

    } catch (error) {
        alert("Error saving category: " + error.message);
        categories.pop();
    }
}

/* -----------------------------------------
   STARTUP
----------------------------------------- */

document.addEventListener("DOMContentLoaded", () => {
    renderNewLineUpForm();
    renderSetList();
});
</script>
