<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Line-up Maker</title>
    
    <!-- Firebase SDK v10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, child, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBLXaXG8EcxhGxqZCkFiqzLp9uF7vnYZS0",
            authDomain: "preach-mate.firebaseapp.com",
            databaseURL: "https://preach-mate-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "preach-mate",
            storageBucket: "preach-mate.firebasestorage.app",
            messagingSenderId: "977514996603",
            appId: "1:1b0521748b3f7692b553de"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.fbDB = db;
        window.fbRef = ref;
        window.fbSet = set;
        window.fbGet = get;
        window.fbRemove = remove;
        window.fbOnValue = onValue;

        window.dispatchEvent(new Event('firebase-ready'));
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #131b2e;
            --panel-border: #1e293b;
            --card-bg: #1a233a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #059669;
            --danger: #dc2626;
            --chord: #4ade80;
            --section: #38bdf8;
            --highlight: #facc15;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 100;
        }

        .brand-title { font-size: 0.85rem; font-weight: 700; color: #fff; letter-spacing: 0.3px; }

        .toolbar-tools {
            display: flex;
            gap: 4px;
            align-items: center;
            overflow-x: auto;
            max-width: 65%;
        }
        .toolbar-tools::-webkit-scrollbar { display: none; }

        .tool-btn {
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid #334155;
            padding: 4px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
        }
        .tool-btn:hover { background: #334155; border-color: var(--accent); }

        .trans-badge {
            display: flex;
            align-items: center;
            background: #0f172a;
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            overflow: hidden;
            font-size: 0.68rem;
        }
        .trans-badge span { padding: 2px 3px; color: var(--text-muted); font-family: monospace; }
        .trans-badge button { background: #273548; color: #fff; border: none; padding: 2px 5px; cursor: pointer; font-weight: bold; }

        .workspace {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .view-section {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            background: var(--bg-color);
        }
        .view-section.active { display: flex; }

        /* Active Line-up Main Screen */
        .active-lineup-screen {
            flex: 1;
            margin: 10px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .screen-header {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--section);
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 6px;
        }

        .category-row {
            background: #0f172a;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cat-label { font-weight: bold; font-size: 0.8rem; color: var(--text-muted); }
        .cat-song-title { font-size: 0.88rem; font-weight: 600; color: #fff; cursor: pointer; flex: 1; margin: 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Slide-out Drawers */
        .drawer-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 8, 15, 0.75);
            backdrop-filter: blur(3px);
            display: none;
            justify-content: flex-end;
            flex-direction: column;
            z-index: 9999;
        }

        .drawer-panel {
            background: var(--panel-bg);
            border-top: 1px solid var(--panel-border);
            border-radius: 16px 16px 0 0;
            padding: 18px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
        }

        .btn {
            background: #273548;
            color: #fff;
            border: 1px solid #334155;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            justify-content: center;
        }
        .btn-primary { background: var(--accent); border: none; }
        .btn-success { background: var(--success); border: none; color: #fff; font-weight: bold; }
        .btn-danger { background: var(--danger); border: none; }
        .btn-sm { padding: 4px 8px; font-size: 0.72rem; }

        /* Full Screen Editor & Play Mode */
        .full-screen-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--bg-color);
            position: relative;
        }
        .edit-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
            z-index: 50;
        }
        .editor-textarea {
            flex: 1;
            width: 100%;
            background: transparent;
            color: var(--text-main);
            border: none;
            padding: 16px;
            font-family: monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        /* Floating Jumper Chips sa Ibaba */
        .floating-jumper-bar {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(19, 27, 46, 0.95);
            border: 1px solid var(--panel-border);
            padding: 6px 12px;
            border-radius: 24px;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            max-width: 95%;
            z-index: 60;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        .floating-jumper-bar::-webkit-scrollbar { display: none; }
        .jumper-chip {
            background: #1e293b;
            color: var(--section);
            border: 1px solid #334155;
            padding: 5px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: bold;
            white-space: nowrap;
            cursor: pointer;
            text-transform: uppercase;
        }
        .jumper-chip:hover { background: #334155; color: #fff; }

        .output-box {
            flex: 1;
            padding: 16px;
            padding-bottom: 90px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre;
            scroll-behavior: smooth;
        }

        .chord { color: var(--chord); font-weight: bold; }

        /* Full Block Yellow Tint Highlight */
        .song-part-block {
            display: block;
            margin-top: 14px;
            padding: 8px 12px;
            border-radius: 6px;
            transition: background 0.3s ease;
        }
        .song-part-title { 
            color: var(--section); 
            font-weight: bold; 
            text-transform: uppercase; 
            font-size: 0.9rem; 
            cursor: pointer;
            display: inline-block;
        }
        .song-part-block.active-block {
            background-color: rgba(250, 204, 21, 0.18);
            border-left: 4px solid var(--highlight);
        }
        .song-part-block.active-block .song-part-title { 
            color: var(--highlight) !important; 
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <header>
        <span class="brand-title">Line-up Maker</span>
        <div class="toolbar-tools">
            <div class="trans-badge">
                <span>K:<strong id="trans-val" style="color:#fff;">0</strong></span>
                <button onclick="transposeGlobal(-1)">-</button>
                <button onclick="transposeGlobal(1)">+</button>
            </div>
            <button class="tool-btn" onclick="openDrawer('drawer-setlist')">📋 Set List</button>
            <button class="tool-btn" onclick="openDrawer('drawer-songs')">🎵 Songs</button>
            <button class="tool-btn" onclick="openAddSongModal()">➕ Add Song</button>
            <button class="tool-btn" onclick="openDrawer('drawer-newlineup')">📝 New</button>
            <button class="tool-btn" onclick="openQRModal()">🌐 Wi-Fi</button>
        </div>
    </header>

    <div class="workspace">
        <!-- HOME SCREEN: Active Line-up -->
        <div id="view-home" class="view-section active">
            <div class="active-lineup-screen">
                <div class="screen-header">
                    <span>Active Line-up</span>
                    <button class="btn btn-sm btn-success" onclick="openSaveLineupModal()">Save Line-up</button>
                </div>
                <div id="canvas-active-categories" style="display:flex; flex-direction:column; gap:8px;"></div>
            </div>
        </div>

        <!-- FULL SCREEN EDIT MODE -->
        <div id="view-edit" class="view-section">
            <div class="full-screen-container">
                <div class="edit-topbar">
                    <button class="btn btn-sm" onclick="switchView('home')">⬅ Back</button>
                    <span id="edit-song-title-label" style="font-weight:bold; color:var(--accent);">Edit Song</span>
                    <div style="display:flex; gap:4px;">
                        <button class="btn btn-sm btn-danger" onclick="deleteCurrentSong()">Delete</button>
                        <button class="btn btn-sm btn-success" onclick="saveSongFromEditor()">Save</button>
                    </div>
                </div>
                <textarea id="editor-textarea" class="editor-textarea" placeholder="[Verse 1]&#10;C    G&#10;Paste Lyrics & Chords here..."></textarea>
            </div>
        </div>

        <!-- PLAY VIEW WITH AUTO-DETECT & JUMPER -->
        <div id="view-play" class="view-section">
            <div class="full-screen-container">
                <div class="edit-topbar">
                    <button class="btn btn-sm" onclick="switchView('home')">⬅ Back</button>
                    <span id="play-song-title" style="font-weight:bold; color:var(--section);">Song Title</span>
                    <button class="btn btn-sm btn-primary" onclick="openEditorFromPlay()">Edit</button>
                </div>
                <div id="play-lyrics-box" class="output-box"></div>
                <!-- ITO ANG FLOATING JUMPER BAR NA NAWALA KANINA -->
                <div id="floating-jumper-bar" class="floating-jumper-bar"></div>
            </div>
        </div>
    </div>

    <!-- DRAWERS -->
    <div id="drawer-setlist" class="drawer-overlay" onclick="closeDrawer('drawer-setlist')">
        <div class="drawer-panel" onclick="event.stopPropagation()">
            <h3 style="color:var(--success); font-size:0.95rem;">Set List (Saved Line-ups)</h3>
            <div id="setlist-container" style="max-height:250px; overflow-y:auto; display:flex; flex-direction:column; gap:6px;"></div>
            <button class="btn" onclick="closeDrawer('drawer-setlist')">Close</button>
        </div>
    </div>

    <div id="drawer-songs" class="drawer-overlay" onclick="closeDrawer('drawer-songs')">
        <div class="drawer-panel" onclick="event.stopPropagation()">
            <h3 style="color:var(--accent); font-size:0.95rem;">Song Database</h3>
            <input type="text" id="song-search-input" placeholder="Search song..." oninput="renderSongsDatabase()" style="background:#0f172a; border:1px solid #334155; color:#fff; padding:8px; border-radius:6px; outline:none;">
            <div id="songs-db-container" style="max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:4px;"></div>
            <button class="btn" onclick="closeDrawer('drawer-songs')">Close</button>
        </div>
    </div>

    <div id="drawer-newlineup" class="drawer-overlay" onclick="closeDrawer('drawer-newlineup')">
        <div class="drawer-panel" onclick="event.stopPropagation()">
            <h3 style="color:var(--highlight); font-size:0.95rem;">Create New Line-up</h3>
            <input type="text" id="new-wl-name" placeholder="Worship Leader Name..." style="background:#0f172a; border:1px solid #334155; color:#fff; padding:8px; border-radius:6px; outline:none;">
            <div id="new-lineup-selectors" style="max-height:200px; overflow-y:auto; display:flex; flex-direction:column; gap:6px;"></div>
            <div style="display:flex; gap:6px;">
                <button class="btn btn-sm" onclick="openAddCategoryModal()">+ Category</button>
                <button class="btn btn-success" style="flex:1;" onclick="saveNewLineUpFromForm()">Save</button>
            </div>
            <button class="btn" onclick="closeDrawer('drawer-newlineup')">Close</button>
        </div>
    </div>

    <!-- MODALS -->
    <div id="select-song-modal" class="drawer-overlay" onclick="closeModal('select-song-modal')">
        <div class="drawer-panel" onclick="event.stopPropagation()">
            <h3 style="font-size:0.95rem;">Select Song for <span id="select-modal-cat" style="color:var(--section);"></span></h3>
            <div id="modal-songs-list" style="max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:4px;"></div>
            <button class="btn" onclick="closeModal('select-song-modal')">Cancel</button>
        </div>
    </div>

    <div id="save-lineup-modal" class="drawer-overlay" onclick="closeModal('save-lineup-modal')">
        <div class="drawer-panel" onclick="event.stopPropagation()">
            <h3 style="color:var(--success); font-size:0.95rem;">Save Active Line-up</h3>
            <input type="text" id="save-wl-input" placeholder="Worship Leader Name..." style="background:#0f172a; border:1px solid #334155; color:#fff; padding:8px; border-radius:6px; outline:none;">
            <button class="btn btn-success" onclick="confirmSaveActiveLineUp()">Save</button>
            <button class="btn" onclick="closeModal('save-lineup-modal')">Cancel</button>
        </div>
    </div>

    <div id="qr-modal" class="drawer-overlay" onclick="closeModal('qr-modal')">
        <div class="drawer-panel" onclick="event.stopPropagation()" style="align-items:center; text-align:center;">
            <h3 style="font-size:0.95rem;">Local Wi-Fi QR Code</h3>
            <div id="qrcode" style="background:#fff; padding:10px; border-radius:8px;"></div>
            <p style="font-size:0.75rem; color:var(--text-muted); word-break:break-all;" id="wifi-link-text"></p>
            <button class="btn" onclick="closeModal('qr-modal')">Close</button>
        </div>
    </div>

    <div id="add-cat-modal" class="drawer-overlay" onclick="closeModal('add-cat-modal')">
        <div class="drawer-panel" onclick="event.stopPropagation()">
            <h3 style="font-size:0.95rem;">Add Custom Category</h3>
            <input type="text" id="new-cat-input" placeholder="Category Name..." style="background:#0f172a; border:1px solid #334155; color:#fff; padding:8px; border-radius:6px; outline:none;">
            <button class="btn btn-primary" onclick="confirmAddCategory()">Add</button>
            <button class="btn" onclick="closeModal('add-cat-modal')">Cancel</button>
        </div>
    </div>

    <script>
        let categories = ["Opening", "Joyful", "Solemn", "Offering", "Closing"];
        let activeLineUp = {}; 
        let songsDatabase = {};
        let setLists = [];
        
        let globalSemitones = 0;
        let activeEditingKey = null;
        let currentPlayingSong = { title: "", content: "" };
        let activeCategoryToAssign = null;

        const notesSharp = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

        window.addEventListener('firebase-ready', () => {
            window.fbOnValue(window.fbRef(window.fbDB, 'worship_songs'), (snapshot) => {
                songsDatabase = snapshot.exists() ? snapshot.val() : {};
                renderSongsDatabase();
                renderActiveLineUpCanvas();
                renderNewLineUpForm();
            });

            window.fbOnValue(window.fbRef(window.fbDB, 'worship_setlists'), (snapshot) => {
                let data = snapshot.val();
                setLists = snapshot.exists() ? (Array.isArray(data) ? data : Object.values(data)) : [];
                renderSetList();
            });
        });

        window.addEventListener('DOMContentLoaded', () => {
            renderActiveLineUpCanvas();
            renderNewLineUpForm();
        });

        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${viewName}`).classList.add('active');
        }

        function openDrawer(drawerId) { 
            document.querySelectorAll('.drawer-overlay').forEach(el => el.style.display = 'none');
            document.getElementById(drawerId).style.display = 'flex'; 
        }
        function closeDrawer(drawerId) { document.getElementById(drawerId).style.display = 'none'; }
        function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }

        function transposeGlobal(amount) {
            globalSemitones += amount;
            document.getElementById('trans-val').innerText = globalSemitones > 0 ? `+${globalSemitones}` : globalSemitones;
            if (document.getElementById('view-play').classList.contains('active')) {
                renderPlayScreen();
            }
        }

        function renderSetList() {
            const container = document.getElementById('setlist-container');
            container.innerHTML = "";
            if (setLists.length === 0) {
                container.innerHTML = `<span style="font-size:0.78rem; color:var(--text-muted); font-style:italic;">No saved set lists.</span>`;
                return;
            }
            setLists.forEach((sl, index) => {
                let row = document.createElement('div');
                row.className = 'category-row';
                row.innerHTML = `
                    <span style="font-size:0.85rem; font-weight:bold; color:var(--success);">${index + 1}. ${sl.worshipLeader}</span>
                    <button class="btn btn-sm btn-primary" onclick="loadSetListToActive(${index}); closeDrawer('drawer-setlist');">Load</button>
                `;
                container.appendChild(row);
            });
        }

        function loadSetListToActive(index) {
            let sl = setLists[index];
            if (sl && sl.lineup) {
                activeLineUp = { ...sl.lineup };
                renderActiveLineUpCanvas();
                alert(`Loaded Line-up: ${sl.worshipLeader}`);
            }
        }

        function renderActiveLineUpCanvas() {
            const container = document.getElementById('canvas-active-categories');
            container.innerHTML = "";

            categories.forEach(cat => {
                let songTitle = activeLineUp[cat];
                let rowHtml = `
                    <span class="cat-label">♦️ ${cat}:</span>
                    <span class="cat-song-title" onclick="${songTitle ? `playSong('${songTitle}')` : `openSelectSongModal('${cat}')`}">${songTitle ? '🎵 ' + songTitle : '<span style="color:var(--text-muted); font-style:italic;">Tap to assign song</span>'}</span>
                    <div style="display:flex; gap:4px;">
                        ${songTitle ? `<button class="btn btn-sm" onclick="openEditSongDirect('${songTitle}')">Edit</button>` : ''}
                        <button class="btn btn-sm btn-primary" onclick="openSelectSongModal('${cat}')">${songTitle ? 'Change' : '+Select'}</button>
                    </div>
                `;

                let div1 = document.createElement('div');
                div1.className = 'category-row';
                div1.innerHTML = rowHtml;
                container.appendChild(div1);
            });
        }

        function openSelectSongModal(cat) {
            activeCategoryToAssign = cat;
            document.getElementById('select-modal-cat').innerText = cat;
            const list = document.getElementById('modal-songs-list');
            list.innerHTML = "";
            for (let title in songsDatabase) {
                let div = document.createElement('div');
                div.style.cssText = "background:#0f172a; padding:8px; border-radius:6px; cursor:pointer; font-size:0.85rem; color:#fff;";
                div.innerText = "🎵 " + title;
                div.onclick = () => {
                    activeLineUp[cat] = title;
                    closeModal('select-song-modal');
                    renderActiveLineUpCanvas();
                };
                list.appendChild(div);
            }
            document.getElementById('select-song-modal').style.display = 'flex';
        }

        function renderSongsDatabase() {
            const container = document.getElementById('songs-db-container');
            container.innerHTML = "";
            let query = document.getElementById('song-search-input').value.toLowerCase();
            for (let title in songsDatabase) {
                if (title.toLowerCase().includes(query)) {
                    let div = document.createElement('div');
                    div.style.cssText = "display:flex; justify-content:space-between; align-items:center; background:#0f172a; padding:6px 10px; border-radius:6px;";
                    div.innerHTML = `
                        <span style="font-size:0.85rem; cursor:pointer; color:#fff;" onclick="playSong('${title}'); closeDrawer('drawer-songs');">🎵 ${title}</span>
                        <button class="btn btn-sm" onclick="openEditSongDirect('${title}')">Edit</button>
                    `;
                    container.appendChild(div);
                }
            }
        }

        function openAddSongModal() {
            activeEditingKey = null;
            document.getElementById('edit-song-title-label').innerText = "Add New Song";
            document.getElementById('editor-textarea').value = "[Untitled Song]\n\n[Verse 1]\n\n[Chorus]\n";
            switchView('edit');
        }

        function openEditSongDirect(title) {
            activeEditingKey = title;
            document.getElementById('edit-song-title-label').innerText = "Edit: " + title;
            document.getElementById('editor-textarea').value = `[${title}]\n\n` + songsDatabase[title];
            switchView('edit');
        }

        function openEditorFromPlay() {
            if (currentPlayingSong.title) openEditSongDirect(currentPlayingSong.title);
        }

        async function saveSongFromEditor() {
            let text = document.getElementById('editor-textarea').value.trim();
            if (!text) return alert("Please enter song content.");
            let match = text.match(/^\[(.*?)\]/);
            let title = match ? match[1] : "Untitled";
            let content = text.replace(/^\[.*?\]\s*/, "").trim();
            let safeKey = title.replace(/[\.#$\/\[\]]/g, "_");

            try {
                await window.fbSet(window.fbRef(window.fbDB, 'worship_songs/' + safeKey), content);
                switchView('home');
            } catch(e) { alert("Error saving: " + e.message); }
        }

        async function deleteCurrentSong() {
            if (activeEditingKey && confirm(`Delete "${activeEditingKey}"?`)) {
                let safeKey = activeEditingKey.replace(/[\.#$\/\[\]]/g, "_");
                await window.fbRemove(window.fbRef(window.fbDB, 'worship_songs/' + safeKey));
                switchView('home');
            }
        }

        function renderNewLineUpForm() {
            const container = document.getElementById('new-lineup-selectors');
            container.innerHTML = "";
            categories.forEach(cat => {
                let div = document.createElement('div');
                div.style.cssText = "display:flex; justify-content:space-between; align-items:center; background:#0f172a; padding:6px 10px; border-radius:6px;";
                div.innerHTML = `
                    <span style="font-size:0.8rem; color:var(--section); font-weight:bold;">♦️ ${cat}:</span>
                    <select id="select-new-${cat}" style="background:#1e293b; color:#fff; border:1px solid #334155; padding:4px; border-radius:4px; font-size:0.8rem; width:60%;">
                        <option value="">-- Select Song --</option>
                        ${Object.keys(songsDatabase).map(t => `<option value="${t}">${t}</option>`).join('')}
                    </select>
                `;
                container.appendChild(div);
            });
        }

        async function saveNewLineUpFromForm() {
            let wlName = document.getElementById('new-wl-name').value.trim();
            if (!wlName) return alert("Please input Worship Leader Name.");
            
            let tempLineup = {};
            categories.forEach(cat => {
                let val = document.getElementById(`select-new-${cat}`).value;
                if (val) tempLineup[cat] = val;
            });

            setLists.unshift({ worshipLeader: wlName, lineup: tempLineup });
            await window.fbSet(window.fbRef(window.fbDB, 'worship_setlists'), setLists);
            document.getElementById('new-wl-name').value = "";
            closeDrawer('drawer-newlineup');
            alert("New Line-up saved to Set List!");
        }

        function openSaveLineupModal() { document.getElementById('save-lineup-modal').style.display = 'flex'; }
        
        async function confirmSaveActiveLineUp() {
            let wlName = document.getElementById('save-wl-input').value.trim();
            if (!wlName) return alert("Enter Worship Leader Name.");
            setLists.unshift({ worshipLeader: wlName, lineup: { ...activeLineUp } });
            await window.fbSet(window.fbRef(window.fbDB, 'worship_setlists'), setLists);
            closeModal('save-lineup-modal');
            alert("Active Line-up saved to Set List!");
        }

        function playSong(title) {
            currentPlayingSong = { title: title, content: songsDatabase[title] };
            document.getElementById('play-song-title').innerText = title;
            renderPlayScreen();
            switchView('play');
        }

        function transposeNote(chord, semitones) {
            let root = chord[0];
            let suffix = chord.substring(root.length);
            let idx = notesSharp.indexOf(root);
            if (idx === -1) return chord;
            let newIdx = (idx + semitones) % 12;
            if (newIdx < 0) newIdx += 12;
            return notesSharp[newIdx] + suffix;
        }

        /* Song Part Auto-Detect & Full Block Yellow Highlight */
        function renderPlayScreen() {
            const box = document.getElementById('play-lyrics-box');
            const jumper = document.getElementById('floating-jumper-bar');
            jumper.innerHTML = '';
            
            const lines = (currentPlayingSong.content || "").split('\n');
            let htmlOutput = '';
            const chordRegex = /\b([A-G][#b]?(?:m|maj|min|dim|aug|sus|7|9|11|13)?(?:\/[A-G][#b]?)?)\b/g;
            const bracketRegex = /^\[(.*?)\]\s*$/;

            let partCounter = 0;
            let insideBlock = false;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                let trimmed = line.trim();
                let escaped = line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                let match = trimmed.match(bracketRegex);

                if (match) {
                    if (insideBlock) htmlOutput += `</div>\n`;
                    let label = match[1];
                    let id = `block-${partCounter}`;
                    htmlOutput += `<div id="${id}" class="song-part-block">\n<span class="song-part-title" onclick="jumpToBlock('${id}')">[${label}]</span>\n`;

                    let chip = document.createElement('button');
                    chip.className = 'jumper-chip';
                    chip.innerText = label;
                    chip.onclick = () => jumpToBlock(id);
                    jumper.appendChild(chip);

                    partCounter++;
                    insideBlock = true;
                } else {
                    if (!insideBlock) { htmlOutput += `<div id="block-intro" class="song-part-block">\n`; insideBlock = true; }
                    let formatted = escaped.replace(chordRegex, (m) => `<span class="chord">${transposeNote(m, globalSemitones)}</span>`);
                    htmlOutput += formatted + (i < lines.length - 1 ? '\n' : '');
                }
            }
            if (insideBlock) htmlOutput += `</div>\n`;
            box.innerHTML = htmlOutput;
        }

        function jumpToBlock(id) {
            document.querySelectorAll('.song-part-block').forEach(b => b.classList.remove('active-block'));
            const target = document.getElementById(id);
            const box = document.getElementById('play-lyrics-box');
            if (target && box) {
                target.classList.add('active-block');
                const centerScroll = target.offsetTop - (box.clientHeight / 2) + (target.offsetHeight / 2);
                box.scrollTo({ top: centerScroll, behavior: 'smooth' });
            }
        }

        function openQRModal() {
            let localUrl = window.location.href;
            document.getElementById('wifi-link-text').innerText = localUrl;
            document.getElementById('qrcode').innerHTML = '';
            new QRCode(document.getElementById('qrcode'), { text: localUrl, width: 150, height: 150 });
            document.getElementById('qr-modal').style.display = 'flex';
        }

        function openAddCategoryModal() { document.getElementById('add-cat-modal').style.display = 'flex'; }
        function confirmAddCategory() {
            let name = document.getElementById('new-cat-input').value.trim();
            if (name && !categories.includes(name)) {
                categories.push(name);
                renderActiveLineUpCanvas();
                renderNewLineUpForm();
                closeModal('add-cat-modal');
            }
        }
    </script>
</body>
